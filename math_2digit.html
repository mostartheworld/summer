<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔢 บวกลบสองหลัก — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  .eq {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: #fff; border-radius: 999px; padding: 6px 26px; box-shadow: 0 6px 0 rgba(0,0,0,.08);
    font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; white-space: nowrap; color: var(--ink);
  }
  .eq .op { color: var(--orange); margin: 0 6px; }
  .eq #ans { display: inline-block; min-width: 64px; text-align: center; color: #cbbda4; }
  .eq #ans.ok { color: #16a34a; }
  .w-caption { top: 158px; }
  .info { font-weight: 800; }
  .info b { color: var(--orange-dark); }
  .legend { font-size: 15px; font-weight: 700; color: var(--muted); }
  .choice { min-width: 0; flex: 1 1 0; font-size: 32px; min-height: 72px; font-family: 'Fredoka', sans-serif; }
  .choice.right { background: #22c55e; box-shadow: 0 6px 0 #15803d; }
  .choice.wrong { background: #ef4444; box-shadow: 0 6px 0 #b91c1c; }
  #nextBtn { display: none; }
  .stars-big { font-size: 46px; text-align: center; }
  @media (max-width: 480px) { .eq { font-size: 32px; padding: 4px 18px; } .choice { font-size: 26px; } }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🔢 บวกลบ <span class="en">· 2-DIGIT MATH</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="levelBtn" title="ระดับ Level" style="width:auto;padding:0 14px;font-size:16px">⭐</button>
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="eq"><span id="na">–</span><span class="op" id="op">+</span><span id="nb">–</span><span class="op">=</span><span id="ans">?</span></div>
<div class="w-caption" id="caption"></div>

<div class="w-dock">
  <div class="w-controls">
    <div class="w-pill info">⭐ <b id="score">0</b> · ข้อ <b id="qnum">1</b>/10</div>
    <div class="w-pill legend">🟦 สิบ · 🟥 หนึ่ง</div>
  </div>
  <div class="w-controls" id="choices"></div>
  <div class="w-controls"><button class="w-btn big" id="nextBtn">ข้อต่อไป ▶</button></div>
  <div class="w-modes">
    <button class="w-mode on" data-mode="add"><span class="em">➕</span>บวก</button>
    <button class="w-mode" data-mode="sub"><span class="em">➖</span>ลบ</button>
    <button class="w-mode" data-mode="mix"><span class="em">🎲</span>ผสม</button>
  </div>
</div>

<div class="w-modal-bg" id="result">
  <div class="w-card" style="text-align:center">
    <div class="stars-big" id="rStars">⭐⭐⭐</div>
    <h2>จบแล้ว! 🎉</h2>
    <p>ได้คะแนน <b id="rScore" style="font-size:28px">10/10</b></p>
    <button class="w-btn" id="retryBtn">เล่นอีกครั้ง 🔄</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🔢</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   บวกลบสองหลัก (2-digit + and −, no carrying/borrowing)
   Each number is shown as base-ten blocks: 🟦 tower = 10, 🟥 cube = 1.
   After answering, the blocks act it out:
     +  the right tray's blocks jump into the left tray
     −  the right tray's blocks pair up with blocks on the left and both fly away
   10 questions per round.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 42;
controls.minPolarAngle = .35; controls.maxPolarAngle = 1.4;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 15, spread: 10, y0: -2 });

const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

/* =========================================================
   Problems (same rules as before: no carrying, no borrowing)
   ========================================================= */
const TOTAL = 10;
const RANGES = [
  { aMin: 20, aMax: 39, bMin: 11, bMax: 18 },   // ⭐ easy
  { aMin: 30, aMax: 65, bMin: 11, bMax: 30 },   // ⭐⭐ medium
  { aMin: 42, aMax: 86, bMin: 11, bMax: 42 },   // ⭐⭐⭐ hard
];
let mode = 'add', level = 1, score = 0, qIndex = 0, Q = null, answered = false;

function genProblem() {
  const r = RANGES[level - 1];
  let op = mode === 'add' ? '+' : mode === 'sub' ? '-' : (Math.random() < .5 ? '+' : '-');
  for (let tries = 0; ; tries++) {
    if (tries > 400) op = '+';
    const a = r.aMin + Math.floor(Math.random() * (r.aMax - r.aMin + 1));
    const b = r.bMin + Math.floor(Math.random() * (r.bMax - r.bMin + 1));
    if (op === '+') {
      if (a % 10 + b % 10 > 9 || Math.floor(a / 10) + Math.floor(b / 10) > 9) continue;
      return { a, b, op, answer: a + b };
    }
    if (a <= b || a % 10 < b % 10 || a - b < 10) continue;
    return { a, b, op, answer: a - b };
  }
}
function genChoices(answer) {
  const s = new Set([answer]);
  const offsets = [10, -10, 1, -1, 11, -11, 9, -9, 2, -2, 20, -20].sort(() => Math.random() - .5);
  for (const off of offsets) {
    const w = answer + off;
    if (w >= 10 && w <= 99) s.add(w);
    if (s.size === 4) break;
  }
  return [...s].sort(() => Math.random() - .5);
}

/* =========================================================
   Scene: two trays of blocks with a big sign between them
   ========================================================= */
box(scene, 18, .4, 10, '#8fd16a', 0, -.2, 0);
box(scene, 18, 1.2, 10, '#d39a5c', 0, -1, 0);
box(scene, 16, 1, 8, '#b87e47', 0, -2.1, 0);
box(scene, 11, .8, 6, '#9b6a3c', 0, -3, 0);
const TRAY = { a: -4.2, b: 4.2, w: 6, d: 3.6 };
[TRAY.a, TRAY.b].forEach(x => {
  box(scene, TRAY.w, .2, TRAY.d, '#f2e6d0', x, .1, 0);
  box(scene, TRAY.w, .45, .2, '#c98a5a', x, .22, TRAY.d / 2);
  box(scene, TRAY.w, .45, .2, '#c98a5a', x, .22, -TRAY.d / 2);
  box(scene, .2, .45, TRAY.d, '#c98a5a', x - TRAY.w / 2, .22, 0);
  box(scene, .2, .45, TRAY.d, '#c98a5a', x + TRAY.w / 2, .22, 0);
});
// sign between the trays (shows + or −)
const signPost = new THREE.Group();
signPost.position.set(0, 0, -.4);
scene.add(signPost);
box(signPost, .2, 2.2, .2, '#8b5a3c', 0, 1.1, 0);
const plusBar = [box(signPost, 1.3, .35, .3, '#f59e0b', 0, 2.8, 0), box(signPost, .35, 1.3, .3, '#f59e0b', 0, 2.8, 0)];
const summer = kit.makeSummer();
summer.g.position.set(0, 0, -2.6);
scene.add(summer.g);

const UNIT = .42;   // block size
const blueMats = [kit.mat('#3b82f6'), kit.mat('#2563eb')];
const redMat = kit.mat('#ef4444');
const cubeGeo = new THREE.BoxGeometry(UNIT * .94, UNIT * .94, UNIT * .94);
function makeTen() {
  const g = new THREE.Group();
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(cubeGeo, blueMats[i % 2]);
    m.position.y = UNIT / 2 + i * UNIT; m.castShadow = true; g.add(m);
  }
  return g;
}
function makeOne() {
  const g = new THREE.Group();
  const m = new THREE.Mesh(cubeGeo, redMat);
  m.position.y = UNIT / 2; m.castShadow = true; g.add(m);
  return g;
}
// k-th ten tower / k-th one cube position inside a tray
function tenPos(trayX, k) { return new THREE.Vector3(trayX - 2.4 + k * .58, .2, -.8); }
function onePos(trayX, k) { return new THREE.Vector3(trayX - 2.4 + (k % 5) * .58, .2, .55 + Math.floor(k / 5) * .58); }

let blocks = [], labels = [], moves = [];
function clearBlocks() {
  blocks.forEach(b => scene.remove(b.g)); labels.forEach(l => scene.remove(l));
  blocks = []; labels = []; moves = [];
}
function fill(trayKey, n) {
  const x = TRAY[trayKey], tens = Math.floor(n / 10), ones = n % 10;
  for (let k = 0; k < tens; k++) { const g = makeTen(); g.position.copy(tenPos(x, k)); scene.add(g); blocks.push({ g, tray: trayKey, kind: 'ten', k }); }
  for (let k = 0; k < ones; k++) { const g = makeOne(); g.position.copy(onePos(x, k)); scene.add(g); blocks.push({ g, tray: trayKey, kind: 'one', k }); }
  const l = kit.labelSprite(String(n), 1.1); l.position.set(x, 5.4, 0); scene.add(l); labels.push(l);
  // pop-in
  blocks.filter(b => b.tray === trayKey).forEach((b, i) => { b.g.scale.setScalar(.01); moves.push({ g: b.g, grow: true, t: -i * .04 }); });
}

/* =========================================================
   Questions
   ========================================================= */
const choicesEl = document.getElementById('choices'), nextBtn = document.getElementById('nextBtn');
function loadQuestion() {
  answered = false;
  Q = genProblem();
  clearBlocks();
  fill('a', Q.a); fill('b', Q.b);
  plusBar[1].visible = Q.op === '+';
  document.getElementById('na').textContent = Q.a;
  document.getElementById('nb').textContent = Q.b;
  document.getElementById('op').textContent = Q.op === '+' ? '+' : '−';
  const ans = document.getElementById('ans'); ans.textContent = '?'; ans.className = '';
  document.getElementById('qnum').textContent = qIndex + 1;
  nextBtn.style.display = 'none';
  choicesEl.innerHTML = '';
  genChoices(Q.answer).forEach(v => {
    const b = document.createElement('button');
    b.className = 'w-btn white choice'; b.textContent = v;
    b.onclick = () => choose(b, v);
    choicesEl.appendChild(b);
  });
  caption(`${Q.a} ${Q.op === '+' ? 'บวก' : 'ลบ'} ${Q.b} ได้เท่าไหร่?`);
}

function choose(btn, v) {
  if (answered) return;
  answered = true;
  const ok = v === Q.answer;
  [...choicesEl.children].forEach(b => {
    b.disabled = true;
    if (+b.textContent === Q.answer) b.classList.add('right');
  });
  if (!ok) btn.classList.add('wrong');
  if (ok) { score++; document.getElementById('score').textContent = score; }
  actItOut(() => {
    const ans = document.getElementById('ans'); ans.textContent = Q.answer; ans.className = 'ok';
    const l = kit.labelSprite(`= ${Q.answer}`, 1.1); l.position.set(TRAY.a, 5.4, 0);
    scene.remove(labels[0]); labels[0] = l; scene.add(l);
    if (ok) { caption(`ถูกต้อง! ${Q.answer} เก่งมาก! 🎉`); fx.burst(TRAY.a, 4, 0); kit.cheer(); cheerT = 2; }
    else caption(`คำตอบคือ ${Q.answer} ดูบล็อกสิ ลองข้อต่อไปนะ 💪`);
    if (qIndex < TOTAL - 1) nextBtn.style.display = 'inline-flex';
    else setTimeout(showResult, 1800);
  });
  if (!ok) caption('ดูบล็อกนะ... 👀', false, 2000);
}

// Blocks act out the sum: + moves the right tray into the left; − cancels pairs
function actItOut(done) {
  const A = blocks.filter(b => b.tray === 'a'), B = blocks.filter(b => b.tray === 'b');
  let delay = 0;
  if (Q.op === '+') {
    const aT = Math.floor(Q.a / 10), aO = Q.a % 10;
    B.forEach(b => {
      const to = b.kind === 'ten' ? tenPos(TRAY.a, aT + b.k) : onePos(TRAY.a, aO + b.k);
      moves.push({ g: b.g, from: b.g.position.clone(), to, t: -delay, arc: 3 });
      b.tray = 'a'; delay += .12;
    });
    scene.remove(labels[1]);
  } else {
    // pair each block on the right with a matching block on the left; both float away
    ['ten', 'one'].forEach(kind => {
      const left = A.filter(b => b.kind === kind).reverse(), right = B.filter(b => b.kind === kind);
      right.forEach((rb, i) => {
        [rb, left[i]].forEach(b => moves.push({ g: b.g, from: b.g.position.clone(), to: b.g.position.clone().add(new THREE.Vector3(0, 7, 0)), t: -delay, vanish: true }));
        delay += .15;
      });
    });
    scene.remove(labels[1]);
  }
  setTimeout(done, (delay + 1) * 1000);
}

function showResult() {
  const pct = score / TOTAL;
  document.getElementById('rStars').textContent = pct === 1 ? '🏆⭐⭐⭐' : pct >= .7 ? '⭐⭐' : pct >= .5 ? '⭐' : '💪';
  document.getElementById('rScore').textContent = `${score}/10`;
  document.getElementById('result').classList.add('show');
  kit.speak(`จบแล้ว ได้ ${score} คะแนน`);
  if (pct >= .7) { fx.burst(0, 5, 0); kit.cheer(); }
}
function resetGame() {
  score = 0; qIndex = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('result').classList.remove('show');
  loadQuestion();
}
nextBtn.onclick = () => { qIndex++; loadQuestion(); };
document.getElementById('retryBtn').onclick = resetGame;
document.querySelectorAll('.w-mode').forEach(b => b.onclick = () => {
  document.querySelectorAll('.w-mode').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.mode; resetGame();
});
const levelBtn = document.getElementById('levelBtn');
levelBtn.onclick = () => {
  level = level % 3 + 1;
  levelBtn.textContent = '⭐'.repeat(level);
  kit.speak(['ง่าย', 'กลาง', 'ยาก'][level - 1]);
  resetGame();
};

/* =========================================================
   Loop
   ========================================================= */
const portrait = innerWidth < innerHeight;
camera.position.set(0, 12, 24); controls.target.set(0, 1.5, 0);
kit.flyTo(stage, portrait ? new THREE.Vector3(0, 19, 37) : new THREE.Vector3(0, 9.5, 17), new THREE.Vector3(0, portrait ? 1 : 1.8, .5), 1000);
let cheerT = 0;
loadQuestion();

stage.start((dt, time) => {
  for (let i = moves.length - 1; i >= 0; i--) {
    const m = moves[i];
    m.t += dt * 1.6;
    if (m.t < 0) continue;
    const t = Math.min(1, m.t);
    if (m.grow) m.g.scale.setScalar(.01 + .99 * t + Math.sin(t * Math.PI) * .25);
    else {
      m.g.position.lerpVectors(m.from, m.to, t);
      if (m.arc) m.g.position.y += Math.sin(t * Math.PI) * m.arc;
      if (m.vanish) { m.g.scale.setScalar(1 - t); m.g.rotation.y = t * 4; }
    }
    if (t >= 1) {
      if (m.arc) kit.tones([700 + Math.random() * 200], .03, 'triangle', .06);
      moves.splice(i, 1);
    }
  }
  plusBar.forEach(p => { p.rotation.y = Math.sin(time * 1.5) * .3; });
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
