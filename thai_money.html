<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪙 เหรียญไทย — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  .info { font-weight: 800; }
  .info b { color: var(--orange-dark); }
  .choice { min-width: 0; flex: 1 1 0; font-size: 24px; min-height: 68px; }
  .choice.right { background: #22c55e; box-shadow: 0 6px 0 #15803d; color: #fff; }
  .choice.wrong { background: #ef4444; box-shadow: 0 6px 0 #b91c1c; color: #fff; }
  #nextBtn { display: none; }
  .big-em { font-size: 56px; text-align: center; }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🪙 เหรียญไทย <span class="en">· THAI COINS</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="w-caption" id="caption"></div>

<div class="w-dock">
  <!-- Meet the coins -->
  <div class="w-controls" data-mode="meet">
    <div class="w-pill">👆 แตะเหรียญเพื่อฟังชื่อ</div>
  </div>
  <!-- Quiz -->
  <div class="w-controls" data-mode="quiz">
    <div class="w-pill info">⭐ <b id="score">0</b> · ข้อ <b id="qnum">1</b>/8</div>
  </div>
  <div class="w-controls" data-mode="quiz" id="choices"></div>
  <div class="w-controls" data-mode="quiz"><button class="w-btn big" id="nextBtn">ข้อต่อไป ▶</button></div>
  <div class="w-modes">
    <button class="w-mode on" data-go="meet"><span class="em">🔍</span>รู้จักเหรียญ</button>
    <button class="w-mode" data-go="quiz"><span class="em">🎮</span>ทายเหรียญ</button>
  </div>
</div>

<div class="w-modal-bg" id="result">
  <div class="w-card" style="text-align:center">
    <div class="big-em" id="rEm">🥇</div>
    <h2 id="rTitle">เก่งมาก!</h2>
    <p>ได้ <b id="rScore" style="font-size:28px">0 / 8</b> ข้อ</p>
    <button class="w-btn" id="retryBtn">เล่นอีกครั้ง 🔄</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🪙</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   เหรียญไทย (Thai coins)
   🔍 meet : 4 giant coins stand on pedestals — tap one to flip it and hear about it
   🎮 quiz : a coin spins in the middle — tap how many baht it is (8 questions)
   Coin models come from kit.makeCoin (world-kit.js)
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 7; controls.maxDistance = 38;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.45;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 14, spread: 10, y0: -2 });

const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

// ── Coin museum ──
box(scene, 16, .4, 10, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 10, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 8, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
box(scene, 14, .12, 4, '#c0392b', 0, .06, .4, false);                         // red carpet
const VALUES = [1, 2, 5, 10];
const SCALE = 2.6;                                                              // giant coins
const museum = VALUES.map((v, i) => {
  const x = -5.1 + i * 3.4;
  box(scene, 2, 1.2, 2, '#f2e6d0', x, .6, -1);
  box(scene, 2.2, .2, 2.2, '#e3793a', x, 1.3, -1);
  const coin = kit.makeCoin(v, SCALE);
  coin.rotation.x = Math.PI / 2;                                                // stand up, face the camera
  coin.position.set(x, 1.4 + kit.COINS[v].r * SCALE, -1);
  scene.add(coin);
  const l = kit.labelSprite(`${v} บาท`, .55); l.position.set(x, .7, .3); scene.add(l);
  return { v, coin, flip: 0, spin: 0 };
});
const summer = kit.makeSummer();
summer.g.position.set(-6.4, 0, 2.2); summer.g.rotation.y = .5;
scene.add(summer.g);

// ── Quiz coin (shown in quiz mode, spins in front of the museum) ──
let quizCoin = null;
function showQuizCoin(v) {
  if (quizCoin) scene.remove(quizCoin);
  quizCoin = kit.makeCoin(v, 2.5);
  quizCoin.rotation.x = Math.PI / 2;
  quizCoin.position.set(0, 3.6, 2.6);
  quizCoin.userData.pop = 0;
  scene.add(quizCoin);
}

function describe(v) {
  const C = kit.COINS[v];
  return `${C.th} ${C.color} ขนาด${C.size}`;
}

/* =========================================================
   Quiz (same rules as before: each coin twice, 8 questions, 3 choices)
   ========================================================= */
const TOTAL = 8;
const shuffle = a => [...a].sort(() => Math.random() - .5);
let questions = [], qi = 0, score = 0, answered = false;
const choicesEl = document.getElementById('choices'), nextBtn = document.getElementById('nextBtn');
function startQuiz() {
  questions = shuffle([...VALUES, ...VALUES]); qi = 0; score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('result').classList.remove('show');
  ask();
}
function ask() {
  answered = false; nextBtn.style.display = 'none';
  const v = questions[qi];
  document.getElementById('qnum').textContent = qi + 1;
  showQuizCoin(v);
  choicesEl.innerHTML = '';
  shuffle([v, ...shuffle(VALUES.filter(x => x !== v)).slice(0, 2)]).forEach(o => {
    const b = document.createElement('button');
    b.className = 'w-btn white choice'; b.textContent = `${o} บาท`; b.dataset.v = o;
    b.onclick = () => answer(b, o);
    choicesEl.appendChild(b);
  });
  caption('เหรียญนี้กี่บาท? 🤔');
}
function answer(btn, o) {
  if (answered) return;
  answered = true;
  const v = questions[qi];
  [...choicesEl.children].forEach(b => { b.disabled = true; if (+b.dataset.v === v) b.classList.add('right'); });
  if (o === v) {
    score++; document.getElementById('score').textContent = score;
    caption(`ถูกต้อง! ${describe(v)} 🎉`);
    fx.burst(0, 4, 2.6, ['#f2cf63', '#d9dde3', '#ffffff']); cheerT = 2;
  } else {
    btn.classList.add('wrong');
    caption(`นี่คือ${describe(v)} นะ 💪`, true, 5500);
    quizCoin.userData.shake = .5;
  }
  qi++;
  if (qi >= TOTAL) setTimeout(showResult, 1800);
  else nextBtn.style.display = 'inline-flex';
}
function showResult() {
  const [em, title] = score >= 7 ? ['🥇', 'เก่งมาก!'] : score >= 5 ? ['⭐', 'ดีมาก!'] : ['😊', 'ฝึกอีกนิดนะ!'];
  document.getElementById('rEm').textContent = em;
  document.getElementById('rTitle').textContent = title;
  document.getElementById('rScore').textContent = `${score} / ${TOTAL}`;
  document.getElementById('result').classList.add('show');
  kit.speak(`${title} ได้ ${score} ข้อ`);
  if (score >= 5) kit.cheer();
}
nextBtn.onclick = ask;
document.getElementById('retryBtn').onclick = startQuiz;

/* =========================================================
   Modes, taps, loop
   ========================================================= */
let mode = null;
const portrait = innerWidth < innerHeight;
function setMode(m) {
  mode = m;
  document.querySelectorAll('.w-mode').forEach(b => b.classList.toggle('on', b.dataset.go === m));
  document.querySelectorAll('.w-controls').forEach(c => { c.style.display = c.dataset.mode === m ? '' : 'none'; });
  museum.forEach(x => { x.coin.visible = m === 'meet'; });   // hide the labelled coins during the quiz (no peeking!)
  if (m === 'quiz') { startQuiz(); kit.flyTo(stage, new THREE.Vector3(0, 5, portrait ? 19 : 13), new THREE.Vector3(0, portrait ? 2.6 : 2.4, 1)); }
  else {
    if (quizCoin) { scene.remove(quizCoin); quizCoin = null; }
    nextBtn.style.display = 'none';
    kit.flyTo(stage, new THREE.Vector3(1, 7, portrait ? 37 : 15), new THREE.Vector3(0, portrait ? 2 : 2.4, 0));
    caption('แตะเหรียญเพื่อฟังชื่อนะ 👆');
  }
}
document.querySelectorAll('.w-mode').forEach(b => b.onclick = () => setMode(b.dataset.go));

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap || mode !== 'meet') return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(museum.map(m => m.coin))[0];
  if (!hit) return;
  const m = museum.find(x => x.coin === hit.object);
  m.flip = 1;
  kit.tones([1200 + m.v * 40, 1500 + m.v * 40], .05, 'sine', .1);   // "ting!"
  caption(describe(m.v) + ' 🪙');
  cheerT = 1.2;
});

camera.position.set(0, 9, 26); controls.target.set(0, 2.4, 0);
setMode('meet');

stage.start((dt, time) => {
  museum.forEach((m, i) => {
    // tapped coins do a full flip; idle coins sway gently
    if (m.flip > 0) { m.flip = Math.max(0, m.flip - dt * 1.2); m.coin.rotation.z = (1 - m.flip) * Math.PI * 2; m.coin.position.y = 1.4 + kit.COINS[m.v].r * SCALE + Math.sin((1 - m.flip) * Math.PI) * 1.2; }
    else m.coin.rotation.z = Math.sin(time * 1.2 + i) * .35;
  });
  if (quizCoin) {
    const u = quizCoin.userData;
    u.pop = Math.min(1, u.pop + dt * 3);
    quizCoin.scale.setScalar(u.pop + Math.sin(u.pop * Math.PI) * .2);
    quizCoin.rotation.z = Math.sin(time * 1.5) * .6;
    if (u.shake > 0) { u.shake -= dt; quizCoin.position.x = Math.sin(time * 50) * .15; } else quizCoin.position.x = 0;
    quizCoin.position.y = 3.2 + Math.sin(time * 2) * .15;
  }
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
