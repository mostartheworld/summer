<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🛒 จ่ายเงิน — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  .info { font-weight: 800; }
  .info b { color: var(--orange-dark); }
  .coin-btn {
    width: 72px; height: 72px; border-radius: 50%; border: 5px solid var(--rim); background: var(--face);
    box-shadow: 0 6px 0 rgba(0,0,0,.2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Noto Sans Thai', sans-serif; font-weight: 900; font-size: 24px; color: var(--ink); line-height: 1;
  }
  .coin-btn small { font-size: 12px; font-weight: 700; }
  .coin-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .coin-btn:disabled { opacity: .5; }
  .total { font-weight: 800; font-size: 20px; }
  .total b { font-size: 26px; color: var(--orange-dark); }
  .big-em { font-size: 56px; text-align: center; }
  @media (max-width: 480px) { .coin-btn { width: 64px; height: 64px; font-size: 20px; } }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🛒 จ่ายเงิน <span class="en">· PAY &amp; SHOP</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="w-caption" id="caption"></div>

<div class="w-dock">
  <div class="w-controls">
    <div class="w-pill info">⭐ <b id="score">0</b> · รอบ <b id="round">1</b>/5</div>
    <div class="w-pill total">👛 <b id="total">0</b> บาท</div>
  </div>
  <div class="w-controls" id="coinBtns"></div>
  <div class="w-controls">
    <button class="w-btn white" id="clearBtn">🗑️ เอาออก</button>
    <button class="w-btn" id="payBtn">💳 จ่ายเงิน!</button>
    <button class="w-btn" id="nextBtn" style="display:none">ของชิ้นต่อไป ▶</button>
  </div>
</div>

<div class="w-modal-bg" id="result">
  <div class="w-card" style="text-align:center">
    <div class="big-em" id="rEm">🥇</div>
    <h2 id="rTitle">นักช้อปตัวจริง!</h2>
    <p>ซื้อของสำเร็จ <b id="rScore" style="font-size:28px">5 / 5</b> รอบ</p>
    <button class="w-btn" id="retryBtn">เล่นอีกครั้ง 🔄</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🛒</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   จ่ายเงิน (Pay at the shop) — 5 rounds
   An item sits on the market stall with a price tag. Tap coin buttons → coins
   drop onto the counter. Tap a coin on the counter to take it back.
   Pay: exact → 🎯 / too much → the shopkeeper slides the change back / too little → how much more.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 6; controls.maxDistance = 30;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.4;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 14, spread: 10, y0: -2 });

const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

const ITEMS = [
  { emoji: '🍭', th: 'ลูกอม',      price: 3 },  { emoji: '🍪', th: 'คุกกี้',    price: 5 },
  { emoji: '🧃', th: 'น้ำผลไม้',   price: 7 },  { emoji: '🍡', th: 'ขนมเสียบไม้', price: 2 },
  { emoji: '🌭', th: 'ไส้กรอก',    price: 10 }, { emoji: '🍿', th: 'ป๊อปคอร์น', price: 8 },
  { emoji: '🥤', th: 'น้ำเย็น',     price: 6 },  { emoji: '🍬', th: 'ขนมหวาน',  price: 4 },
  { emoji: '🍦', th: 'ไอศกรีม',    price: 9 },  { emoji: '🧁', th: 'คัพเค้ก',   price: 6 },
];
const VALUES = [1, 2, 5, 10];
const TOTAL_ROUNDS = 5;

/* =========================================================
   The market stall
   ========================================================= */
box(scene, 16, .4, 11, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 11, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 9, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
const COUNTER_Y = 2;
box(scene, 8, COUNTER_Y, 2.4, '#c98a5a', 0, COUNTER_Y / 2, 0);               // counter
box(scene, 8.4, .25, 2.8, '#f2e6d0', 0, COUNTER_Y + .12, 0);
for (let x = -3.5; x <= 3.6; x += 1) box(scene, .5, COUNTER_Y - .3, .06, '#b87e47', x, COUNTER_Y / 2, 1.22, false);
[-3.9, 3.9].forEach(x => box(scene, .3, 5.4, .3, '#8b5a3c', x, 2.7, -1));      // posts
for (let i = 0; i < 8; i++) box(scene, 1.05, .35, 3.4, i % 2 ? '#ffffff' : '#e63946', -3.7 + i * 1.06, 5.5, -.2);   // striped awning
for (let i = 0; i < 8; i++) box(scene, 1.05, .5, .12, i % 2 ? '#ffffff' : '#e63946', -3.7 + i * 1.06, 5.2, 1.5);
// shopkeeper (a friendly voxel cat) behind the counter
const keeper = new THREE.Group();
box(keeper, 1.4, 1.6, 1, '#f4a261', 0, 2.6, 0);
box(keeper, 1.2, 1, 1, '#f4a261', 0, 3.9, 0);
[-.38, .38].forEach(x => box(keeper, .3, .35, .3, '#f4a261', x, 4.55, 0));
[-.28, .28].forEach(x => box(keeper, .14, .14, .05, '#2b2118', x, 4, .52, false));
box(keeper, .2, .1, .05, '#ff8fab', 0, 3.75, .52, false);
box(keeper, 1.45, .4, 1.05, '#ffffff', 0, 2.2, 0);                              // apron
keeper.position.set(0, 0, -1.9);
scene.add(keeper);
const summer = kit.makeSummer();
summer.g.position.set(-2.4, 0, 3); summer.g.rotation.y = .3;
scene.add(summer.g);

// Item on a little plate + price tag
let itemSprite = null, priceTag = null;
box(scene, 1.6, .12, 1.6, '#ffffff', 2, COUNTER_Y + .3, -.2);
function showItem(item) {
  [itemSprite, priceTag].forEach(s => s && scene.remove(s));
  itemSprite = kit.emojiSprite(item.emoji, null, 2);
  itemSprite.position.set(2, COUNTER_Y + 1.4, -.2);
  itemSprite.userData.pop = 0;
  priceTag = kit.labelSprite(`${item.th} ${item.price} บาท`, .62);
  priceTag.position.set(2, COUNTER_Y + 2.8, -.2);
  scene.add(itemSprite, priceTag);
}

/* =========================================================
   Coins on the counter
   ========================================================= */
const PAY_AREA = { x: -2, z: .5 };
let wallet = [];          // [{ v, m }]
let moving = [];          // coins animating
function coinSpot(i) {     // coins sit in a 4-wide grid on the counter
  return new THREE.Vector3(PAY_AREA.x - 1.5 + (i % 4) * 1, COUNTER_Y + .32, PAY_AREA.z - .7 + Math.floor(i / 4) * .9);
}
function layout() {
  wallet.forEach((c, i) => moving.push({ m: c.m, from: c.m.position.clone(), to: coinSpot(i), t: 0, arc: .3 }));
  const total = sum();
  document.getElementById('total').textContent = total;
}
const sum = () => wallet.reduce((s, c) => s + c.v, 0);

let item = null, round = 0, score = 0, paid = false, pool = [];
function addCoin(v) {
  if (paid || wallet.length >= 12) return;
  const m = kit.makeCoin(v, 1);
  const spot = coinSpot(wallet.length);
  m.position.set(spot.x, spot.y + 4, spot.z);
  scene.add(m);
  wallet.push({ v, m });
  moving.push({ m, from: m.position.clone(), to: spot, t: 0, drop: true });
  document.getElementById('total').textContent = sum();
  kit.speak(`${v} บาท`);
}
function removeCoin(m) {
  if (paid) return;
  const i = wallet.findIndex(c => c.m === m);
  if (i < 0) return;
  scene.remove(m); wallet.splice(i, 1);
  kit.tones([500, 380], .05, 'triangle', .1);
  layout();
}
function clearWallet() {
  if (paid) return;
  wallet.forEach(c => scene.remove(c.m)); wallet = [];
  layout();
}

function pay() {
  if (paid) return;
  const total = sum(), price = item.price;
  if (!wallet.length) { caption('เลือกเหรียญก่อนนะ 😊'); return; }
  if (total < price) { caption(`ยังไม่พอ ขาดอีก ${price - total} บาท 😊`); keeperT = -1; return; }
  paid = true; score++;
  document.getElementById('score').textContent = score;
  // coins slide across to the shopkeeper
  wallet.forEach((c, i) => moving.push({ m: c.m, from: c.m.position.clone(), to: new THREE.Vector3(0, COUNTER_Y + .3, -1.3), t: -i * .08, arc: 1, vanish: true }));
  wallet = [];
  document.getElementById('total').textContent = 0;
  if (total === price) {
    caption(`จ่ายพอดีเป๊ะ! เก่งมาก 🎯`);
  } else {
    const change = total - price;
    caption(`จ่าย ${total} บาท ได้เงินทอน ${change} บาท 😊`, true, 6000);
    // the change comes back as coins (biggest first)
    let left = change, k = 0;
    [10, 5, 2, 1].forEach(v => { while (left >= v) { left -= v; const delay = .8 + k * .25, idx = k++; setTimeout(() => giveChange(v, idx), delay * 1000); } });
  }
  fx.burst(2, COUNTER_Y + 2, -.2); kit.cheer(); cheerT = 2.5; keeperT = 2;
  // Summer gets the item: it floats over to him
  moving.push({ sprite: itemSprite, from: itemSprite.position.clone(), to: new THREE.Vector3(-2.4, 3.2, 3), t: -.6 });
  document.getElementById('payBtn').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = '';
  document.getElementById('nextBtn').textContent = round < TOTAL_ROUNDS ? 'ของชิ้นต่อไป ▶' : 'ดูผล 🏆';
}
let changeCoins = [];
function giveChange(v, i) {
  const m = kit.makeCoin(v, 1);
  m.position.set(0, COUNTER_Y + .3, -1.3);
  scene.add(m); changeCoins.push(m);
  const to = new THREE.Vector3(.2 + i * 1.1, COUNTER_Y + .32, 1);   // change lands on the right, away from the item Summer is holding
  moving.push({ m, from: m.position.clone(), to, t: 0, arc: 1 });
  kit.tones([1400, 1700], .05, 'sine', .1);
  const l = kit.labelSprite('ทอน', .35); l.position.set(to.x, to.y + .6, to.z); scene.add(l); changeCoins.push(l);
}

function startGame() {
  round = 0; score = 0; pool = [...ITEMS].sort(() => Math.random() - .5);
  document.getElementById('score').textContent = 0;
  document.getElementById('result').classList.remove('show');
  nextRound();
}
function nextRound() {
  if (round >= TOTAL_ROUNDS) { showResult(); return; }
  paid = false;
  wallet.forEach(c => scene.remove(c.m)); wallet = [];
  changeCoins.forEach(m => scene.remove(m)); changeCoins = [];
  item = pool[round % pool.length]; round++;
  document.getElementById('round').textContent = round;
  document.getElementById('total').textContent = 0;
  document.getElementById('payBtn').style.display = '';
  document.getElementById('clearBtn').style.display = '';
  document.getElementById('nextBtn').style.display = 'none';
  showItem(item);
  caption(`${item.th} ราคา ${item.price} บาท เลือกเหรียญจ่ายเลย 👇`);
}
function showResult() {
  const [em, title] = score >= 5 ? ['🥇', 'นักช้อปตัวจริง!'] : score >= 3 ? ['⭐', 'เก่งขึ้นเยอะเลย!'] : ['😊', 'ฝึกอีกนิดนะ!'];
  document.getElementById('rEm').textContent = em;
  document.getElementById('rTitle').textContent = title;
  document.getElementById('rScore').textContent = `${score} / ${TOTAL_ROUNDS}`;
  document.getElementById('result').classList.add('show');
  kit.speak(title);
}

// Coin buttons look like the real coins
const coinBtns = document.getElementById('coinBtns');
VALUES.forEach(v => {
  const C = kit.COINS[v], b = document.createElement('button');
  b.className = 'coin-btn'; b.title = `${v} บาท`;
  b.style.setProperty('--face', C.face); b.style.setProperty('--rim', C.rim); b.style.setProperty('--ink', C.ink);
  b.innerHTML = `${C.thai}<small>${v} บาท</small>`;
  b.onclick = () => addCoin(v);
  coinBtns.appendChild(b);
});
document.getElementById('clearBtn').onclick = clearWallet;
document.getElementById('payBtn').onclick = pay;
document.getElementById('nextBtn').onclick = nextRound;
document.getElementById('retryBtn').onclick = startGame;

// Tap a coin on the counter to take it back
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0, keeperT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(wallet.map(c => c.m))[0];
  if (hit) removeCoin(hit.object);
});

const portrait = innerWidth < innerHeight;
camera.position.set(0, 10, 22); controls.target.set(0, 2.5, 0);
kit.flyTo(stage, portrait ? new THREE.Vector3(0, 11, 22) : new THREE.Vector3(0, 7.5, 12.5), new THREE.Vector3(0, portrait ? 2.6 : 2.6, 0), 1000);
startGame();

stage.start((dt, time) => {
  for (let i = moving.length - 1; i >= 0; i--) {
    const a = moving[i];
    a.t += dt * (a.drop ? 2.2 : 1.8);
    if (a.t < 0) continue;
    const t = Math.min(1, a.t);
    const obj = a.m || a.sprite;
    if (a.drop) {   // falling coin with a little bounce
      const e = t < .7 ? (t / .7) ** 2 : 1 - Math.sin((t - .7) / .3 * Math.PI) * .08;
      obj.position.lerpVectors(a.from, a.to, e);
      obj.rotation.x = (1 - t) * 6;
    } else {
      obj.position.lerpVectors(a.from, a.to, t);
      if (a.arc) obj.position.y += Math.sin(t * Math.PI) * a.arc;
      if (a.vanish) obj.scale.setScalar(1 - t * .9);
    }
    if (t >= 1) {
      if (a.drop) { kit.tones([1300 + Math.random() * 300], .03, 'sine', .08); obj.rotation.x = 0; }
      if (a.vanish) scene.remove(obj);
      moving.splice(i, 1);
    }
  }
  if (itemSprite && itemSprite.userData.pop < 1) {
    itemSprite.userData.pop = Math.min(1, itemSprite.userData.pop + dt * 3);
    itemSprite.scale.setScalar(2 * (itemSprite.userData.pop + Math.sin(itemSprite.userData.pop * Math.PI) * .2));
  }
  // shopkeeper: happy hop after paying, head shake when it's not enough
  keeperT += keeperT > 0 ? -dt : dt;
  keeper.position.y = keeperT > 0 ? Math.abs(Math.sin(time * 8)) * .3 : 0;
  keeper.rotation.y = keeperT < 0 ? Math.sin(time * 20) * .2 : 0;
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
