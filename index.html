<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --sun: #ffe9b3;
    --sun2: #f6cf7a;
    --orange: #f59e0b;
    --ink: #3b2a1a;
    --card: #ffffff;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--sun) 0%, var(--sun2) 100%);
    font-family: 'Fredoka', 'Noto Sans Thai', sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }

  #world { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }

  /* ── Top bar ── */
  .topbar {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .logo {
    font-family: 'Bungee', cursive; font-size: 20px; color: var(--orange);
    background: #fff; border-radius: 999px; padding: 0 18px; min-height: 56px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
    border: none; cursor: pointer;
  }
  .logo small { font-family: 'Fredoka', 'Noto Sans Thai', sans-serif; font-size: 16px; color: var(--ink); font-weight: 700; }
  .navpill {
    background: #fff; border-radius: 999px; padding: 4px; min-height: 56px;
    display: flex; align-items: center; gap: 2px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .navpill a, .navpill button {
    border: none; background: none; cursor: pointer; text-decoration: none; color: var(--ink);
    min-width: 52px; height: 48px; border-radius: 999px; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .navpill a:active, .navpill button:active { background: #fff3d6; }
  @media (max-width: 420px) { .logo .name { display: none; } }

  /* ── Title screen ── */
  .title {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 16px 16px 12vh; text-align: center;
    background: linear-gradient(to top, rgba(255,233,179,.9) 0%, rgba(255,233,179,0) 55%);
    transition: opacity .8s;
  }
  .title.hide { opacity: 0; pointer-events: none; }
  .title h1 {
    font-family: 'Bungee', cursive; font-size: clamp(38px, 10vw, 84px); line-height: .95;
    color: var(--orange); text-shadow: 0 5px 0 #fff, 0 9px 0 rgba(0,0,0,.08);
  }
  .title .sub { font-size: 20px; font-weight: 700; }
  .btn {
    min-height: 60px; padding: 0 34px; border: none; border-radius: 999px;
    background: var(--orange); color: #fff; cursor: pointer;
    font-family: inherit; font-size: 22px; font-weight: 700;
    box-shadow: 0 6px 0 #c77c00;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c77c00; }

  .hint {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.92); border-radius: 999px; padding: 10px 20px;
    font-size: 17px; font-weight: 700; white-space: nowrap; z-index: 5; pointer-events: none;
    box-shadow: 0 5px 0 rgba(0,0,0,.08);
  }
  .hint.hidden { display: none; }

  /* ── Info card (white card, stacked shadow, dotted line to the building) ── */
  .card {
    position: fixed; z-index: 6;
    left: 40px; top: 50%; width: 340px;
    transform: translate(-120%, -50%);
    background: var(--card); border-radius: 24px; padding: 28px 28px 24px;
    box-shadow: 0 10px 0 #eee7da, 0 20px 0 #d8cfbf;
    transition: transform .45s cubic-bezier(.2,1.2,.4,1);
  }
  .card.show { transform: translate(0, -50%); }
  .card .dot-anchor {
    position: absolute; right: 18px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink);
  }
  .card .c-en { font-family: 'Bungee', cursive; font-size: 12px; color: #a8957c; letter-spacing: .5px; }
  .card .c-th { font-size: 26px; font-weight: 900; color: var(--orange); margin: 2px 0 8px; display: flex; align-items: center; gap: 8px; }
  .card .c-desc { font-size: 17px; line-height: 1.6; margin-bottom: 18px; }
  .card .c-star { font-size: 15px; color: #a8957c; margin-bottom: 12px; }
  @media (max-width: 720px) {
    .card { left: 16px; right: 16px; top: auto; bottom: 16px; width: auto; padding: 18px 18px 16px; transform: translateY(150%); }
    .card.show { transform: translateY(0); }
    .card .c-th { font-size: 22px; margin-bottom: 4px; }
    .card .c-desc { margin-bottom: 12px; font-size: 16px; }
    .card .c-star { display: none; }
    .card .btn { width: 100%; }
    body.card-open .dpad { display: none; }
  }
  #link { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* ── Speech bubbles (positioned over 3D characters) ── */
  .bubble {
    position: fixed; z-index: 4; pointer-events: none;
    transform: translate(-50%, -100%);
    background: #fff; border-radius: 16px; padding: 6px 14px;
    font-size: 17px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 4px 0 rgba(0,0,0,.1);
    display: none;
  }
  .bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    border: 8px solid transparent; border-bottom: 0; border-top-color: #fff;
  }

  /* ── D-pad (moves relative to where the camera looks) ── */
  .dpad {
    position: fixed; left: 16px; bottom: 16px; z-index: 4;
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px;
  }
  .dpad button {
    border: none; border-radius: 18px; background: rgba(255,255,255,.85);
    box-shadow: 0 4px 0 rgba(0,0,0,.1);
    color: var(--orange); font-size: 22px; cursor: pointer; touch-action: none;
  }
  .dpad button.held { background: #fff3d6; transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.1); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  /* ── Modals ── */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(59,42,26,.45);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 24px; padding: 22px;
    width: min(560px, 100%); max-height: 90vh; overflow-y: auto;
    box-shadow: 0 10px 0 #eee7da, 0 20px 0 #d8cfbf;
  }
  .modal h2 { font-size: 24px; font-weight: 900; color: var(--orange); text-align: center; }
  .modal .sub { text-align: center; color: #8a7760; margin-bottom: 14px; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .stamp {
    border: 3px dashed #e4d8c4; border-radius: 16px; background: #fffaf0;
    padding: 10px 6px; text-align: center; cursor: pointer; min-height: 100px; font-family: inherit;
  }
  .stamp .s-emoji { font-size: 40px; filter: grayscale(1); opacity: .4; }
  .stamp .s-name { font-size: 14px; font-weight: 700; color: #8a7760; }
  .stamp.got { border: 3px solid var(--orange); background: #fff3d6; }
  .stamp.got .s-emoji { filter: none; opacity: 1; }
  .stamp.got .s-name { color: #b45309; }
  .modal .btn { display: flex; margin: 18px auto 0; }
  .celebrate { text-align: center; }
  .celebrate .big { font-size: 80px; }

  .toast {
    position: fixed; top: 84px; left: 50%;
    transform: translate(-50%, -30px); opacity: 0;
    background: var(--orange); color: #fff; border-radius: 999px;
    padding: 12px 24px; font-size: 22px; font-weight: 900;
    box-shadow: 0 5px 0 #c77c00;
    transition: all .3s; z-index: 7; pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* ── Sky buttons (time of day / weather / festival) ── */
  .skybar { position: fixed; right: 14px; top: 84px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
  .skybar button {
    width: 60px; height: 60px; border: none; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,.92); box-shadow: 0 5px 0 rgba(0,0,0,.08); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: inherit;
  }
  .skybar button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .skybar .e { font-size: 26px; line-height: 1; }
  .skybar .t { font-size: 11px; font-weight: 700; margin-top: 3px; }

  /* ── Round mini-map (turns with the camera; tap to walk there) ── */
  .mini {
    position: fixed; right: 16px; bottom: 16px; z-index: 4; width: 132px; height: 132px;
    border-radius: 50%; border: 4px solid #fff; background: #bfe6ff; cursor: pointer; touch-action: none;
    box-shadow: 0 5px 0 rgba(0,0,0,.1);
  }
  @media (max-width: 720px) {
    .mini { width: 112px; height: 112px; }
    body.card-open .mini { display: none; }
  }
  @media (max-width: 520px) {
    .hint, .toast { max-width: calc(100vw - 170px); white-space: normal; text-align: center; }
  }

  /* Page transitions (same as world-theme.css) */
  .w-fade-in, .w-fade-out { position: fixed; inset: 0; z-index: 100; background: var(--sun); pointer-events: none; }
  .w-fade-in { animation: w-fade-in .6s ease-out forwards; }
  @keyframes w-fade-in { from { opacity: 1; } to { opacity: 0; } }
  .w-fade-out { opacity: 0; transition: opacity .45s; }
  .w-fade-out.on { opacity: 1; }

  /* Shown only if the 3D engine can't load (e.g. offline) */
  .fallback {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
    background: var(--sun);
  }
  .fallback.show { display: flex; }
  .fallback .big { font-size: 64px; }
</style>
</head>

<script type="module">
/* =========================================================
   Summer's World — 3D voxel town on a floating island
   - Two big floors: the ground (front: plaza + lake) and a high upper deck (back) with a small hill on top.
     Glass lifts (LIFTS) carry Summer between the ground and the upper deck; stairs go up the hill
   - Each building = one activity page (PLACES below); each has its own look (style → BUILD)
   - Drag = rotate camera, pinch/scroll = zoom. While the island turns, signs swing and Summer turns to wave
   - Walk: tap the ground (path-finding), arrow keys/WASD, d-pad, or tap the round mini-map
   - Sky buttons (right side): time of day, weather (rain → umbrella, snow → snowmen), festival (Christmas, Loy Krathong)
   - Reaching a door for the first time = stamp + ⭐ (saved in localStorage)
   To add a new activity: add one entry to PLACES on a free 3×2 spot (the floor is worked out from x, y).
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const kit = WorldKit(THREE, OrbitControls);   // shared Summer model, voxel helpers, sounds (world-kit.js)

// ── World layout (tile grid; 1 tile = 1 unit in 3D) ──
const MAP_W = 40, MAP_H = 33;
const FLOOR_Y = [0, 4, 5.5];               // height of each floor: ground, upper deck, hill
const PLAZA = { x: 18, y: 17, w: 5, h: 5 };
const FOUNTAIN = { x: 20, y: 19 };
const LAKE = { cx: 9.5, cy: 20.5, rx: 3, ry: 2 };
const SPAWN = { x: 20.5, y: 22.5 };
// Floor of each tile: 0 = ground (front), 1 = upper deck (back), 2 = hill (on top of the upper deck)
function levelOf(x, y) {
  if (x >= 14 && x <= 25 && y <= 6 && !((x === 14 || x === 25) && y === 6)) return 2;
  return y <= (x < 6 || x > 33 ? 10 : 11) ? 1 : 0;
}
// Stair tiles sit on the front edge of the upper floor and go down towards the front (+y) — hill ↔ upper deck
const STAIRS = [[19, 6], [20, 6]];
// Glass lifts between the ground and the upper deck: the bottom tile [x, y]; the top landing is the tile behind it (y - 1)
const LIFTS = [[8, 12], [19, 12], [30, 12]];
// A waterfall pours off the upper deck into a little pool (tiles x..x+1, y 12..13)
const FALLS = { x: 13 };

// Buildings are 3×2 tiles; the door is the tile just below the middle (x+1, y+2)
// style = which builder in BUILD draws it (roof shape, decorations)
const PLACES = [
  { id: 'satit',   href: 'satit_exam.html',  emoji: '📝', th: 'โรงเรียนสาธิต', en: 'EXAM SCHOOL',   desc: 'ลุยโจทย์ฝึกสอบหลายหมวด',       x: 2,  y: 2,  style: 'school',    color: '#8ec5f5', roof: '#3f7cc9' },
  { id: 'library', href: 'knowledge.html',   emoji: '📚', th: 'ห้องสมุด',      en: 'LIBRARY',       desc: 'คำศัพท์ไทย-อังกฤษ เก็บดาว',     x: 8,  y: 2,  style: 'dome',      color: '#d2b4f5', roof: '#8a5cc9' },
  { id: 'sara',    href: 'sa_ra.html',       emoji: '🗣️', th: 'บ้านสระ',       en: 'VOWEL HOUSE',   desc: 'ฝึกอ่าน กา มา ตา',             x: 30, y: 7,  style: 'cottage',   color: '#ffc58f', roof: '#e3793a' },
  { id: 'chinese', href: 'chinese.html',     emoji: '🏮', th: 'ศาลาจีน',       en: 'CHINESE',       desc: 'แตะโคมไฟ ฟังเสียงจีน',     x: 27, y: 2,  style: 'pagoda',    color: '#ffaaa2', roof: '#c9433a' },
  { id: 'gravity', href: 'gravity.html',     emoji: '🚀', th: 'ฐานจรวด',       en: 'ROCKET BASE',   desc: 'จรวด ดูดาว ระบบสุริยะ',    x: 22, y: 2,  style: 'rocket',    color: '#b0b5f5', roof: '#4a4fa8' },
  { id: 'clock',   href: 'clock_game.html',  emoji: '🕐', th: 'หอนาฬิกา',      en: 'CLOCK TOWER',   desc: 'อ่านเวลาจากเข็มนาฬิกา',        x: 15, y: 2,  style: 'tower',     color: '#c5b0f5', roof: '#6d4fc0' },
  { id: 'math',    href: 'math_2digit.html', emoji: '🔢', th: 'บ้านตัวเลข',    en: 'NUMBER HOUSE',  desc: 'บวกลบเลขสองหลัก',             x: 33, y: 14, style: 'blocks',    color: '#ffe080', roof: '#d19a1a' },
  { id: 'talk',    href: '24_question.html', emoji: '🎲', th: 'ลานปิกนิก',     en: 'PICNIC TALK',   desc: 'คุยเล่นกับพ่อแม่ 24 คำถาม',     x: 26, y: 15, style: 'tent',      color: '#ffbfd8', roof: '#d6538a' },
  { id: 'coins',   href: 'thai_money.html',  emoji: '🪙', th: 'ธนาคารเหรียญ',  en: 'COIN BANK',     desc: 'รู้จักเหรียญ 1 2 5 10 บาท',     x: 3,  y: 14, style: 'bank',      color: '#ffdc96', roof: '#b8781a' },
  { id: 'shop',    href: 'pay_money.html',   emoji: '🛒', th: 'ร้านค้า',        en: 'SHOP',          desc: 'จ่ายเงิน รับเงินทอน',           x: 5,  y: 25, style: 'shop',      color: '#9fe8da', roof: '#2a9a86' },
  { id: 'farm',    href: 'farm_kid.html',    emoji: '🌾', th: 'ฟาร์มฝึกคิด',   en: 'FARM',          desc: 'โจทย์ฝึกคิดสนุกๆ',             x: 13, y: 26, style: 'barn',      color: '#f5dea8', roof: '#b5452e' },
  { id: 'robot',   href: 'robot_game.html',  emoji: '🤖', th: 'โรงงานหุ่นยนต์', en: 'ROBOT FACTORY', desc: 'ประกอบหุ่น Noob ถึง God',       x: 24, y: 26, style: 'factory',   color: '#d2dbe6', roof: '#5a6b80' },

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

// Can you step from tile a to the next tile b? Same floor = yes.
// A different floor only through a stair (in at its top end or its bottom end)
// or a lift (in from the ground in front of it, or from the upper-deck landing behind it).
const isStair = (x, y) => grid[y][x] === T.STAIR;
const isLift = (x, y) => grid[y][x] === T.LIFT;
function canStep(ax, ay, bx, by) {
  if (ax === bx && ay === by) return true;
  if (isLift(ax, ay) || isLift(bx, by)) {
    if (isLift(ax, ay) && isLift(bx, by)) return false;
    const [lx, ly, ox, oy] = isLift(ax, ay) ? [ax, ay, bx, by] : [bx, by, ax, ay];
    return ox === lx && ((oy === ly + 1 && lvl[oy][ox] === 0) || (oy === ly - 1 && lvl[oy][ox] === 1));
  }
  const la = lvl[ay][ax], lb = lvl[by][bx], sa = isStair(ax, ay), sb = isStair(bx, by);
  if (!sa && !sb) return la === lb;
  if (sa && sb) return la === lb && ay === by;           // two stair lanes side by side
  const [sx, sy, ls, ox, oy, lo] = sa ? [ax, ay, la, bx, by, lb] : [bx, by, lb, ax, ay, la];
  if (ox !== sx) return false;                           // no stepping off the side of a stair
  return (oy === sy - 1 && lo === ls) || (oy === sy + 1 && lo === ls - 1);
}

// Breadth-first search on the grid; returns list of tiles from start to goal (or null)
function bfs(sx, sy, isGoal, isBlocked) {
  const prev = new Map(), key = (x, y) => y * MAP_W + x;
  const queue = [[sx, sy]];
  prev.set(key(sx, sy), null);
  while (queue.length) {
    const [x, y] = queue.shift();
    if (isGoal(x, y)) {
      const out = [];
      for (let k = key(x, y); k !== null; k = prev.get(k)) out.unshift({ x: k % MAP_W, y: Math.floor(k / MAP_W) });
      return out;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!inMap(nx, ny) || prev.has(key(nx, ny)) || isBlocked(nx, ny, x, y)) continue;
      prev.set(key(nx, ny), key(x, y));
      queue.push([nx, ny]);
    }
  }
  return null;
}

// Dirt paths: from every door to the plaza, going around the lake and buildings and using the stairs

    (x, y, fx, fy) => isBorder(x, y) || grid[y][x] === T.WATER || grid[y][x] === T.BUILDING || !canStep(fx, fy, x, y));
  (route || []).forEach(c => { if (grid[c.y][c.x] === T.GRASS) grid[c.y][c.x] = T.PATH; });
});

    const nx = x + dx, ny = y + dy;
    if (inMap(nx, ny) && [T.PATH, T.PLAZA, T.BUILDING, T.STAIR, T.LIFT].includes(grid[ny][nx])) return true;
  }
  return false;
}
const FLOWER_COLORS = ['#ff8fbf', '#ffffff', '#ffd166', '#b8a4ff', '#ff8a7a'];
for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {

  const r = rand();
  if (isBorder(x, y)) grid[y][x] = T.TREE;
  else if (!nearOpenArea(x, y) && r < 0.2) grid[y][x] = T.TREE;

function groundY(px, py) {
  const x = Math.floor(px), y = Math.floor(py);

{

const liftMoving = l => Math.abs(l.target - l.cabinY) > .001;
function callLift(l, h) {
  if (liftMoving(l) || Math.abs(l.cabinY - h) < .01) return;
  l.target = h; tones([523, 659], .08);
}
function updateLifts(dt) {
  lifts.forEach(l => {
    const d = l.target - l.cabinY;
    if (Math.abs(d) > .001) {
      l.cabinY += Math.sign(d) * Math.min(Math.abs(d), dt * 1.8);
      if (!liftMoving(l)) { l.cabinY = l.target; tones([1047, 1319], .12); }   // ding!
    }
    l.cabin.position.y = l.cabinY;
    l.up.visible = d > .001; l.down.visible = d < -.001;
  });
}

// Christmas fairy lights: one instanced mesh with every bulb; the colours twinkle
const bulbSpots = [];
function lightString(g, y, w = 2.9, d = 1.9) {
  const corners = [[-w / 2, d / 2], [w / 2, d / 2], [w / 2, -d / 2], [-w / 2, -d / 2]];
  corners.forEach(([x1, z1], i) => {
    const [x2, z2] = corners[(i + 1) % 4], n = Math.round(Math.hypot(x2 - x1, z2 - z1) / .34);
    for (let k = 0; k < n; k++) bulbSpots.push(new THREE.Vector3(x1 + (x2 - x1) * k / n, y + .05, z1 + (z2 - z1) * k / n).add(g.position));
  });
}

function makeCritter(kind) {
  const g = new THREE.Group();
  const parts = {
    dog:     [[.42, .26, .26, '#c68a4e', 0, .28, 0], [.26, .26, .24, '#c68a4e', 0, .42, .24], [.08, .14, .06, '#7a4f2a', -.1, .58, .22], [.08, .14, .06, '#7a4f2a', .1, .58, .22], [.07, .07, .05, '#2b2118', 0, .4, .37], [.06, .2, .06, '#c68a4e', 0, .38, -.25]],

    sheep:   [[.5, .34, .36, '#f7f7f7', 0, .32, 0], [.2, .22, .2, '#2b2118', 0, .38, .26]],
    duck:    [[.3, .22, .34, '#ffd23f', 0, .14, 0], [.18, .18, .18, '#ffd23f', 0, .32, .12], [.1, .05, .12, '#ff9f1c', 0, .3, .26]],
    cat:     [[.36, .22, .22, '#f4a259', 0, .24, 0], [.24, .22, .22, '#f4a259', 0, .38, .2], [.07, .1, .06, '#f4a259', -.08, .53, .2], [.07, .1, .06, '#f4a259', .08, .53, .2], [.05, .24, .05, '#f4a259', 0, .38, -.2]],
  }[kind];
  parts.forEach(([w, h, d, c, x, y, z]) => box(g, w, h, d, c, x, y, z));
  if (kind !== 'duck') {
    const legColor = kind === 'sheep' ? '#2b2118' : kind === 'chicken' ? '#ff9f1c' : parts[0][3];
    [[-.1, -.08], [.1, -.08], [-.1, .08], [.1, .08]].slice(0, kind === 'chicken' ? 2 : 4)
      .forEach(([lx, lz]) => box(g, .06, .16, .06, legColor, lx, .08, lz));
  }
  return g;
}

// Critters stay on their own floor (no wandering off a cliff); ducks may swim
function critterCanGo(c, px, py) {
  const x = Math.floor(px), y = Math.floor(py);
  if (!inMap(x, y) || lvl[y][x] !== c.level || isStair(x, y) || isLift(x, y)) return false;
  if (c.kind === 'duck' && grid[y][x] === T.WATER) return true;
  return !BLOCKING.has(grid[y][x]);
}

{

      const nx = x + dx, ny = y + dy;
      if (inMap(nx, ny) && grid[ny][nx] === T.GRASS && !taken.has(ny * MAP_W + nx)) { taken.add(ny * MAP_W + nx); return [nx, ny]; }
    }
    return null;
  };
  const SPOTS = [[16, 16], [24, 16], [16, 23], [24, 23], [12, 9], [27, 9], [19, 2], [37, 20], [2, 21], [29, 30], [10, 29], [36, 7]];
  SPOTS.forEach(([sx, sy], i) => {
    const spot = freeSpot(sx, sy);
    if (!spot) return;
    const [x, y] = spot, g = new THREE.Group();
    g.position.set(WX(x + .5), FLOOR_Y[lvl[y][x]], WZ(y + .5));
    box(g, .7, .6, .7, '#fbfdff', 0, .3, 0);

  burst(WX(player.x), groundY(player.x, player.y) + 1.5, WZ(player.y)); tones([523, 659, 784, 1047]);

function walkTo(tx, ty) {
  const route = bfs(Math.floor(player.x), Math.floor(player.y), (x, y) => x === tx && y === ty,
    (x, y, fx, fy) => blocked(x, y) || !canStep(fx, fy, x, y));
  if (!route) return false;
  hint.classList.add('hidden');
  player.route = route.slice(1).map(c => ({ x: c.x + .5, y: c.y + .5 }));
  targetMarker.visible = true;
  targetMarker.position.set(WX(tx + .5), groundY(tx + .5, ty + .5) + .12, WZ(ty + .5));
  return true;
}
// Walk to a tile; if it's a building go to its door, if it's blocked try a free tile next to it
function walkToward(tx, ty) {
  const place = PLACES.find(pl => tx >= pl.x - 1 && tx < pl.x + pl.w + 1 && ty >= pl.y - 1 && ty < pl.y + pl.h);
  if (place) return walkTo(place.door.x, place.door.y);
  if (!blocked(tx, ty) && walkTo(tx, ty)) return true;
  for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) if (inMap(tx + dx, ty + dy) && !blocked(tx + dx, ty + dy) && walkTo(tx + dx, ty + dy)) return true;
  return false;
}

// A tap is a short press that didn't move (a drag rotates the camera instead)
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

function handleTap(sx, sy) {
  hint.classList.add('hidden');

  raycaster.setFromCamera(ndc, camera);
  const tappable = [summer.g, ...critters.map(c => c.g), ...snowmen.filter(s => s.g.visible).map(s => s.g), ...buildingGroups, ...lifts.map(l => l.g)];
  const hits = raycaster.intersectObjects(tappable, true);
  if (hits.length) {
    const o = hits[0].object.userData;
    if (o.isSummer) { burst(WX(player.x), groundY(player.x, player.y) + 1.6, WZ(player.y), ['#ff8fbf', '#ff5d8f']); sayFor(player, 'ฮิฮิ 😊'); tones([880, 1175], .07); return; }
    if (o.critter) {
      const c = o.critter;
      c.jump = 1; sayFor(c, c.sound, 1500); speak(c.sound); tones([660, 880], .08, 'square');
      return;
    }
    if (o.snowman) {
      o.snowman.jump = 1; sayFor(o.snowman, 'สวัสดี! ฉันตุ๊กตาหิมะ ⛄', 1800); speak('สวัสดี ฉันตุ๊กตาหิมะ'); tones([784, 988, 1175], .08);
      return;
    }
    if (o.place) return walkTo(o.place.door.x, o.place.door.y);
    if (o.lift) return walkTo(o.lift.x, o.lift.y);
  }
  // The ground: step slightly into the surface that was hit, then find the tile under that point
  const hit = raycaster.intersectObjects(groundMeshes, false)[0];
  if (!hit) return;
  const p = hit.point.clone();
  if (hit.face) p.addScaledVector(hit.face.normal, -.05);
  const tx = Math.floor(p.x + MAP_W / 2), ty = Math.floor(p.z + MAP_H / 2);
  if (inMap(tx, ty)) walkToward(tx, ty);
}

{

// ── Sky colours + lights for the time of day and weather ──
const C = hex => new THREE.Color(hex);
const SKY = {
  day: [C('#ffe9b3'), C('#f6cf7a')], night: [C('#27346b'), C('#0e1636')], dusk: [C('#ffc08a'), C('#ee8a86')],
  greyDay: [C('#e3e7ec'), C('#b7c1cc')], greyNight: [C('#2c3346'), C('#151a27')],
};
const skyTop = new THREE.Color(), skyBottom = new THREE.Color(), tmp = new THREE.Color();
let lastBg = '';
function applySky(dt, time) {
  // The clock only runs forwards, so choosing "night" plays the sunset first
  const diff = ((sky.target - sky.hour) % 24 + 24) % 24;
  if (diff > .001) sky.hour = (sky.hour + Math.min(diff, dt * 7)) % 24;
  const goal = weatherGoal();
  for (const k in amt) amt[k] += (goal[k] - amt[k]) * Math.min(1, dt * (k === 'cover' ? .35 : 1.5));

  const a = (sky.hour - 6) / 12 * Math.PI, up = Math.sin(a);
  const day = THREE.MathUtils.smoothstep(up, -.18, .28), night = 1 - day;
  const dusk = Math.exp(-(((up - .05) / .22) ** 2)), cloud = amt.cloud;
  [[skyTop, 0], [skyBottom, 1]].forEach(([c, i]) => {
    c.copy(SKY.night[i]).lerp(SKY.day[i], day).lerp(SKY.dusk[i], dusk * .75 * (1 - cloud * .6));
    c.lerp(tmp.copy(SKY.greyNight[i]).lerp(SKY.greyDay[i], day), cloud * .7);
  });
  scene.fog.color.copy(skyBottom);
  const bg = `radial-gradient(ellipse at 50% 35%, #${skyTop.getHexString()} 0%, #${skyBottom.getHexString()} 100%)`;
  if (bg !== lastBg) { document.body.style.background = bg; lastBg = bg; }

  hemi.intensity = (.4 + .85 * day) * (1 - .25 * cloud);
  hemi.color.set('#8ea2ff').lerp(tmp.set('#fff4d6'), day);
  hemi.groundColor.set('#3a3050').lerp(tmp.set('#c9a46a'), day);
  const sunUp = up > 0, dx = Math.cos(a), dy = Math.sin(a);
  sun.position.set((sunUp ? dx : -dx) * 34, Math.max(8, Math.abs(dy) * 34), 16);
  sun.intensity = sunUp ? (1.55 * day + .15) * (1 - .6 * cloud) : .4 * (1 - .5 * cloud);
  sun.color.set(sunUp ? '#ffffff' : '#a9bcff');
  if (sunUp) sun.color.lerp(tmp.set('#ffab6b'), dusk * .8);
  sunDisc.position.set(dx * 95, dy * 95, 40);
  moonDisc.position.set(-dx * 95, -dy * 95, 40);
  sunDisc.material.opacity = THREE.MathUtils.clamp(up * 5 + .5, 0, 1) * (1 - cloud * .8);
  moonDisc.material.opacity = THREE.MathUtils.clamp(-up * 5 + .5, 0, 1) * (1 - cloud * .7);
  sunDisc.material.color.set('#fff1a8').lerp(tmp.set('#ff9a5a'), dusk);

  glowMats.forEach(m => { m.emissiveIntensity = night * 1.2 + cloud * .15; });
  lampLights.forEach(l => { l.intensity = night * 14; });
  stars.material.opacity = night * (1 - cloud * .85);
  cloudMat.color.set('#ffffff').lerp(tmp.set('#8f99a6'), amt.rain * .8 + cloud * .2).multiplyScalar(.35 + .65 * day);

  // Rain + snow particles
  rain.visible = amt.rain > .02;
  rain.material.opacity = amt.rain * .6;
  if (rain.visible) {
    for (let i = 0; i < RAIN_N; i++) {
      const j = i * 6;
      let y = rainPos[j + 1] - 22 * dt;
      if (y < -.5) y += AREA.h;
      rainPos[j + 1] = y; rainPos[j + 4] = y + .7;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  snowfall.visible = amt.snow > .02;
  snowfall.material.opacity = amt.snow;
  if (snowfall.visible) {
    for (let i = 0; i < SNOW_N; i++) {
      const j = i * 3;
      snowPos[j] += Math.sin(time * .8 + i) * .4 * dt;
      snowPos[j + 1] -= (1.2 + (i % 5) * .15) * dt;
      if (snowPos[j + 1] < -.5) snowPos[j + 1] += AREA.h;
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
  snowMat.opacity = amt.cover * .92;
  snowCover.visible = treeSnow.visible = amt.cover > .01;
  const pop = THREE.MathUtils.clamp((amt.cover - .2) / .5, 0, 1);
  snowmen.forEach(s => { s.g.visible = pop > .02; s.g.scale.setScalar(pop); });

  // Summer's outfits
  const u = THREE.MathUtils.damp(umbrella.scale.x, sky.weather === 'rain' ? 1 : 0, 6, dt);
  umbrella.scale.setScalar(u); umbrella.visible = u > .02;
  scarf.visible = amt.cover > .3 || sky.weather === 'snow';
  santaHat.visible = amt.xmas > .5;

  // Festivals
  fountain.scale.setScalar(Math.max(.001, 1 - amt.xmas)); fountain.visible = amt.xmas < .98;
  xmasTree.scale.setScalar(Math.max(.001, amt.xmas)); xmasTree.visible = amt.xmas > .02;
  bulbs.visible = amt.xmas > .6;
  krathongs.forEach(k => { k.g.visible = amt.krathong > .02; k.g.scale.setScalar(Math.max(.001, amt.krathong)); });
  skyLanterns.forEach(l => { l.g.visible = amt.krathong > .05; });
}

// ── Update ──
const SPEED = 4, R = .3;
// Summer's 4 corners must be on free tiles that can be reached from the tile he stands on (no walking off cliffs)
function canStand(x, y) {
  const cx = Math.floor(player.x), cy = Math.floor(player.y);
  for (const [ox, oy] of [[-R, -R], [R, -R], [-R, R], [R, R]]) {
    const tx = Math.floor(x + ox), ty = Math.floor(y + oy);
    if (blocked(tx, ty) || !canStep(cx, cy, tx, ty)) return false;
    if (tx === cx && ty === cy) continue;
    if (isLift(tx, ty)) {             // stepping into a lift: the cabin must be waiting on this floor (else call it)
      const l = liftAt(tx, ty), h = groundY(player.x, player.y);
      if (liftMoving(l) || Math.abs(l.cabinY - h) > .05) { callLift(l, h); return false; }
    } else if (isLift(cx, cy)) {      // stepping out: only onto the floor the cabin is at
      const l = liftAt(cx, cy);
      if (liftMoving(l) || Math.abs(FLOOR_Y[lvl[ty][tx]] - l.cabinY) > .05) return false;
    }
  }
  return true;
}
const fwd = new THREE.Vector3(), camTarget = new THREE.Vector3();
const lerpAngle = (a, b, t) => a + (((b - a) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI) * t;
const yawToCamera = (x, z) => Math.atan2(camera.position.x - x, camera.position.z - z);
let lastAz = 0, spin = 0, sway = 0;

function update(dt, time) {
  updateLifts(dt);
  // How fast is the island being turned? (used to swing signs and make everyone look at the camera)
  const az = controls.getAzimuthalAngle();
  let dAz = az - lastAz; lastAz = az;
  if (dAz > Math.PI) dAz -= Math.PI * 2; else if (dAz < -Math.PI) dAz += Math.PI * 2;
  spin += (dAz / Math.max(dt, 1e-3) - spin) * Math.min(1, dt * 8);
  const turning = started && Math.abs(spin) > .35;
  sway += (THREE.MathUtils.clamp(-spin * .25, -.45, .45) - sway) * Math.min(1, dt * 4);

  // Lifts: step in → glide to the middle of the cabin → ride to the other floor → step out (keys ignored meanwhile)
  const ptx = Math.floor(player.x), pty = Math.floor(player.y), inLift = isLift(ptx, pty) ? liftAt(ptx, pty) : null;
  if (!inLift) player.rideDone = false;
  if (inLift && !player.rideDone && !player.ride) {
    player.ride = { lift: inLift, stage: 'board' };
    player.route = [{ x: inLift.x + .5, y: inLift.y + .5 }, ...player.route.filter(w => !isLift(Math.floor(w.x), Math.floor(w.y)))];
  }
  const ride = player.ride;
  if (ride) {
    const l = ride.lift;
    if (ride.stage === 'board' && Math.hypot(player.x - l.x - .5, player.y - l.y - .5) < .03) {
      ride.stage = 'ride'; ride.up = l.cabinY < .01; player.rideDone = true;
      player.x = l.x + .5; player.y = l.y + .5;
      player.route = player.route.filter(w => !isLift(Math.floor(w.x), Math.floor(w.y)));
      l.target = ride.up ? l.top : 0;
      sayFor(player, ride.up ? 'ขึ้นลิฟต์ ⬆️' : 'ลงลิฟต์ ⬇️', 2200); tones([659, 784], .1);
    } else if (ride.stage === 'ride' && !liftMoving(l)) {
      ride.stage = 'exit';
      const exit = { x: l.x + .5, y: l.y + (ride.up ? -.5 : 1.5) };
      if (!player.route.length || Math.floor(player.route[0].y) !== Math.floor(exit.y)) player.route.unshift(exit);
    } else if (ride.stage === 'exit' && !inLift) player.ride = null;
  }

  // Keyboard/d-pad move relative to the camera: "up" = away from the camera
  const ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), iy = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  let dx = 0, dy = 0, step = SPEED * dt;
  if (player.ride && player.ride.stage === 'ride') { /* standing still in the moving cabin */ }
  else if ((ix || iy) && !player.ride) {
    hint.classList.add('hidden'); targetMarker.visible = false;
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    dx = fwd.x * iy - fwd.z * ix; dy = fwd.z * iy + fwd.x * ix;
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
  } else if (player.route.length) {
    const wp = player.route[0];
    const ex = wp.x - player.x, ey = wp.y - player.y, d = Math.hypot(ex, ey);
    if (d < .02) { player.x = wp.x; player.y = wp.y; player.route.shift(); if (!player.route.length) targetMarker.visible = false; }
    else { dx = ex / d; dy = ey / d; step = Math.min(step, d); }
  }
  player.moving = !!(dx || dy);
  if (canStand(player.x + dx * step, player.y)) player.x += dx * step;
  if (canStand(player.x, player.y + dy * step)) player.y += dy * step;
  if (player.moving) { player.yaw = lerpAngle(player.yaw, Math.atan2(dx, dy), Math.min(1, dt * 12)); player.idle = 0; }
  else player.idle += dt;
  const sy = groundY(player.x, player.y);

  // Summer: walk animation; standing still he turns to face you, and waves while the island spins
  if (!player.moving && (player.idle > 1.5 || turning))
    player.yaw = lerpAngle(player.yaw, yawToCamera(WX(player.x), WZ(player.y)), Math.min(1, dt * (turning ? 6 : 2)));
  summer.g.position.set(WX(player.x), sy, WZ(player.y));
  summer.g.rotation.y = player.yaw;
  kit.poseSummer(summer, time, player.moving ? 'walk' : 'idle');
  if (turning && !player.moving) { summer.armL.rotation.z = -2.5 + Math.sin(time * 12) * .4; summer.armL.rotation.x = 0; }
  if (umbrella.visible) { summer.armR.rotation.x = -1.3; summer.armR.rotation.z = 0; }

  // Standing at a door?
  const here = PLACES.find(p => Math.hypot(player.x - (p.door.x + .5), player.y - (p.door.y + .5)) < .9);
  if (here && here !== currentPlace) { openCard(here); visit(here); }
  else if (!here && currentPlace) closeCard();

  // Buildings: wiggle the one Summer is visiting, bob + swing signs, pulse door rings
  buildingGroups.forEach(g => {
    const u = g.userData, active = u.place === currentPlace;
    g.scale.y = active ? 1 + Math.sin(time * 7) * .03 : 1;
    u.sign.position.y = u.signBase + Math.sin(time * 2 + g.position.x) * .08;
    u.sign.material.rotation = sway + Math.sin(time * 2 + g.position.z) * .04;
    u.label.material.rotation = sway * .6;
    u.ring.scale.setScalar(1 + Math.sin(time * 4) * .15);
  });
  targetMarker.scale.setScalar(1 + Math.sin(time * 8) * .12);
  const isle = sky.hour % 12;   // clock tower hands follow the island's time
  clockHands.forEach(c => { c.hour.rotation.z = -isle / 12 * Math.PI * 2; c.minute.rotation.z = -(sky.hour % 1) * Math.PI * 2; });
  spinners.forEach(s => { s.o.rotation[s.axis] += dt * s.speed; });
  smokePuffs.forEach(s => {
    const t = (time * .35 + s.ph) % 1;
    s.m.position.set(s.x + t * .4, s.y + t * 1.4, s.z);
    s.m.scale.setScalar(.12 + .3 * Math.sin(t * Math.PI));
  });

  // Waterfall chunks slide down; foam bobs in the pool
  fallBits.forEach(b => {
    const t = (time * (b.kind === 'drop' ? 1.3 : .8) + b.ph) % 1;
    if (b.kind === 'drop') b.m.position.y = b.top - .3 - t * (b.top + .1);
    else { b.m.position.y = -.12 + Math.sin(t * Math.PI * 2) * .05; b.m.scale.setScalar(.8 + Math.sin(t * Math.PI) * .4); }
  });

  // Fountain drops arc from the top bowl into the basin
  drops.forEach((d, i) => {
    const a = i / drops.length * Math.PI * 2, t = (time * .9 + i * .37) % 1;
    d.position.set(Math.cos(a) * .55 * t, 1.15 + 1.9 * t * (1 - t) - .8 * t, Math.sin(a) * .55 * t);
  });

  // Critters wander near home (on their own floor); tapped ones jump; they look up when the island spins
  critters.forEach(c => {
    c.jump = Math.max(0, c.jump - dt * 2.2);
    if (c.wait > 0) {
      c.wait -= dt;
      if (turning) c.yaw = lerpAngle(c.yaw, yawToCamera(WX(c.x), WZ(c.y)), Math.min(1, dt * 5));
    } else {
      const ex = c.tx - c.x, ey = c.ty - c.y, d = Math.hypot(ex, ey);
      if (d < .05) {
        c.wait = 1 + Math.random() * 3;
        const tx = c.home.x + (Math.random() * 4 - 2), ty = c.home.y + (Math.random() * 2 - 1);
        if (critterCanGo(c, tx, ty) && critterCanGo(c, (tx + c.x) / 2, (ty + c.y) / 2)) { c.tx = tx; c.ty = ty; }
      } else {
        const s = Math.min(d, 1.2 * dt);
        c.x += ex / d * s; c.y += ey / d * s;
        c.yaw = lerpAngle(c.yaw, Math.atan2(ex, ey), Math.min(1, dt * 8));
      }
    }
    const swimming = grid[Math.floor(c.y)][Math.floor(c.x)] === T.WATER;
    const hop = (c.wait > 0 || swimming ? 0 : Math.abs(Math.sin(time * 10)) * .05) + Math.sin(c.jump * Math.PI) * .7;
    c.g.position.set(WX(c.x), groundY(c.x, c.y) + (swimming ? -.2 : 0) + hop, WZ(c.y));
    c.g.rotation.y = c.yaw;
  });
  // Snowmen slowly turn to watch the camera; tapped ones hop
  snowmen.forEach(s => {
    if (!s.g.visible) return;
    s.jump = Math.max(0, s.jump - dt * 2.2);
    s.g.rotation.y = lerpAngle(s.g.rotation.y, yawToCamera(WX(s.x), WZ(s.y)), Math.min(1, dt * 2));
    s.g.position.y = groundY(s.x, s.y) + Math.sin(s.jump * Math.PI) * .5;
  });
  // Krathongs drift round the lake; paper lanterns float up and start again
  krathongs.forEach((k, i) => {
    if (!k.g.visible) return;
    k.a += dt * k.sp;
    k.g.position.set(WX(LAKE.cx) + Math.cos(k.a) * LAKE.rx * k.r * 1.6, -.16 + Math.sin(time * 2 + i) * .03, WZ(LAKE.cy) + Math.sin(k.a) * LAKE.ry * k.r * 1.6);
  });
  skyLanterns.forEach(l => {
    if (!l.g.visible) return;
    l.t = (l.t + dt / 28) % 1;
    const r = l.r + l.t * 6;
    l.g.position.set(WX(LAKE.cx) + Math.cos(l.a + l.t * 2) * r, .3 + l.t * 26, WZ(LAKE.cy) + Math.sin(l.a + l.t * 2) * r);
    l.g.scale.setScalar(Math.max(.001, amt.krathong * Math.min(1, l.t * 20)));
  });

  // Floating cubes bob and spin; clouds drift around the island (rain clouds grow bigger)
  floaters.forEach(f => {
    if (f.cloud) {
      const u = f.cloud.userData; u.a += dt * .02;
      f.cloud.position.set(Math.cos(u.a) * u.dist, u.y - amt.cloud * 2, Math.sin(u.a) * u.dist);
      f.cloud.scale.setScalar(1 + amt.cloud * .5);
    } else {
      f.m.position.y = f.base + Math.sin(time * .6 + f.ph) * .6;
      f.m.rotation.x += dt * f.spin; f.m.rotation.y += dt * f.spin * .7;
    }
  });
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.vy -= 12 * dt;
    c.m.position.x += c.vx * dt; c.m.position.y += c.vy * dt; c.m.position.z += c.vz * dt;
    c.m.rotation.x += dt * 6; c.life -= dt;
    if (c.life <= 0) { scene.remove(c.m); confetti.splice(i, 1); }
  }
  applySky(dt, time);
  twinkle(time);

  // Camera gently follows Summer (keeps whatever angle the user rotated to); idle for 30 s → slow auto-spin
  if (started) {
    camTarget.set(WX(player.x), sy + .8, WZ(player.y)).sub(controls.target).multiplyScalar(Math.min(1, dt * 4));
    controls.target.add(camTarget); camera.position.add(camTarget);
    controls.autoRotate = !player.moving && performance.now() - lastInput > 30000;
    controls.autoRotateSpeed = .35;
  }
  controls.update();
  if (time > miniNext || turning) { miniNext = time + .08; drawMini(time); }
}

// ── Screen overlays: speech bubbles + dotted line ──
const v3 = new THREE.Vector3();
function toScreen(x, y, z) {
  v3.set(x, y, z).project(camera);
  return { x: (v3.x + 1) / 2 * innerWidth, y: (1 - v3.y) / 2 * innerHeight };
}
const bubbles = new Map();
function showBubble(who, x, y, z) {
  let el = bubbles.get(who);
  if (!el) { el = document.createElement('div'); el.className = 'bubble'; document.body.appendChild(el); bubbles.set(who, el); }
  const active = who.say && who.say.until > performance.now();
  el.style.display = active ? 'block' : 'none';
  if (!active) return;
  const s = toScreen(x, y, z);
  el.textContent = who.say.text;
  el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
}
const linkLine = document.getElementById('linkLine'), linkDot = document.getElementById('linkDot');
function updateOverlays() {
  showBubble(player, WX(player.x), groundY(player.x, player.y) + (umbrella.visible ? 2.8 : 2.1), WZ(player.y));
  critters.forEach(c => showBubble(c, WX(c.x), groundY(c.x, c.y) + 1.1, WZ(c.y)));
  snowmen.forEach(s => showBubble(s, WX(s.x), groundY(s.x, s.y) + 2.1, WZ(s.y)));
  const show = !!currentPlace;
  linkLine.style.display = linkDot.style.display = show ? '' : 'none';
  if (!show) return;
  const r = card.getBoundingClientRect();
  const wide = innerWidth > 720;
  const ax = wide ? r.right - 24 : r.left + r.width / 2, ay = wide ? r.top + 24 : r.top;
  const s = toScreen(WX(currentPlace.x + 1.5), currentPlace.signY, WZ(currentPlace.y + 1));
  linkLine.setAttribute('x1', ax); linkLine.setAttribute('y1', ay);
  linkLine.setAttribute('x2', s.x); linkLine.setAttribute('y2', s.y);
  linkDot.setAttribute('cx', s.x); linkDot.setAttribute('cy', s.y);
}

// ── Main loop ──
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 45 : 35;   // portrait phones see a bit wider
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
// Start the camera already looking at Summer
controls.target.set(WX(player.x), groundY(player.x, player.y) + .8, WZ(player.y));
camera.position.set(WX(player.x) + 12, 16, WZ(player.y) + 18);
lastAz = controls.getAzimuthalAngle();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(.05, clock.getDelta()), time = clock.elapsedTime;
  update(dt, time);
  renderer.render(scene, camera);
  updateOverlays();
});
addEventListener('pagehide', persist);
window.__worldReady = true;
// Test hook (Playwright): change the sky instantly and read the state
window.__island = {
  setTime: h => { setTime(h); sky.hour = h; }, setWeather, setFestival, walkTo,
  snap: () => { sky.hour = sky.target; Object.assign(amt, weatherGoal()); },
  state: () => ({ hour: sky.hour, weather: sky.weather, festival: sky.festival, amt: { ...amt }, player: { x: player.x, y: player.y, z: groundY(player.x, player.y), ride: player.ride && player.ride.stage, route: player.route.length }, umbrella: umbrella.visible, snowmen: snowmen.length }),
  look: (x, y, dist = 16) => { controls.target.set(WX(x), groundY(x, y) + .8, WZ(y)); camera.position.set(WX(x) + dist * .55, groundY(x, y) + dist * .75, WZ(y) + dist * .8); player.x = x; player.y = y; },
};

// Labels use the Thai web font — redraw them once it has loaded
if (document.fonts) document.fonts.load('700 56px "Noto Sans Thai"').then(() => {
  buildingGroups.forEach(g => {
    const p = g.userData.place, old = g.userData.label;
    const fresh = labelSprite(p.th, small ? .8 : .62);
    fresh.position.copy(old.position); fresh.userData.place = p;
    g.remove(old); g.add(fresh); g.userData.label = fresh;
  });
});
