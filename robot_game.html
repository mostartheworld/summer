<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🤖 สร้างหุ่นยนต์ — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

  .count { font-weight: 900; color: var(--orange-dark); }

<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🤖 สร้างหุ่นยนต์ <span class="en">· ROBOT BUILDER</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="w-caption" id="caption"></div>
<div class="w-banner" id="banner">🤖 หุ่นยนต์ตื่นแล้ว! 🎉</div>

<div class="w-dock">
  <div class="w-controls">
    <div class="w-pill">🔩 <span class="count" id="count">0</span>/5</div>
    <button class="w-btn" id="newBtn">🎲 หุ่นใหม่</button>
  </div>
  <div class="w-controls" id="partBtns"></div>
</div>

<div class="w-modal-bg" id="lesson">
  <div class="w-card">
    <div class="lesson-em" id="lEm">🔋</div>
    <h2 id="lTitle" style="text-align:center">ไฟฟ้า!</h2>
    <div class="en-sub" id="lEn">ELECTRICITY</div>
    <p id="lDesc"></p>
    <div class="fact" id="lFact"></div>
    <button class="w-btn" id="lOk">ต่อเลย ▶</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🤖</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   สร้างหุ่นยนต์ (Robot builder)
   5 parts wait on pedestals. Tap a part (or its button) → it flies onto the robot
   and a short science card explains it. All 5 → the robot wakes up and dances.
   Tap a part already on the robot to swap it for another style.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 36;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.45;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 18, radius: 14, spread: 10, y0: -2 });

// ── Caption (+ speech) ──
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

/* =========================================================
   Parts — each slot has 3 styles
   ========================================================= */
const INK = '#2D3047';
const PARTS = {
  head:   { th: 'หัว',     emoji: '🙂', at: [0, 3.7, 0],   lesson: { em: '🔋', th: 'ไฟฟ้า!',      en: 'ELECTRICITY', desc: 'ในหัวหุ่นยนต์มีสมองกล ใช้ไฟฟ้าในการคิด', fact: '⚡ สมองหุ่นยนต์ใช้ไฟฟ้า · A robot brain runs on electricity' } },
  body:   { th: 'ตัว',     emoji: '👕', at: [0, 1.7, 0],   lesson: { em: '⚙️', th: 'เฟือง!',      en: 'GEARS',       desc: 'ในตัวหุ่นมีเฟืองหมุนช่วยกัน ทำให้หุ่นขยับได้', fact: '⚙️ เฟืองช่วยให้เครื่องจักรขยับ · Gears help machines move' } },
  armL:   { th: 'แขนซ้าย', emoji: '💪', at: [-1.45, 3.4, 0], lesson: { em: '💪', th: 'คาน!',        en: 'LEVERS',      desc: 'แขนหุ่นทำงานเหมือนคาน แบบเดียวกับแขนเราตอนยกของ', fact: '💪 แขนคือคาน เครื่องกลอย่างง่าย · Arms are levers' } },
  armR:   { th: 'แขนขวา',  emoji: '🦾', at: [1.45, 3.4, 0],  lesson: { em: '🦾', th: 'มอเตอร์!',     en: 'MOTORS',      desc: 'มอเตอร์หมุนได้ ช่วยให้แขนหุ่นยนต์โบกมือได้', fact: '🔄 มอเตอร์หมุนแล้วทำให้ของขยับ · Motors spin to make things move' } },
  legs:   { th: 'ขา',      emoji: '🦿', at: [0, 0, 0],     lesson: { em: '🦿', th: 'การเคลื่อนที่!', en: 'MOVEMENT',   desc: 'ขาหรือล้อช่วยให้หุ่นยนต์ไปที่ต่างๆ ได้', fact: '🛞 ล้อช่วยลดแรงเสียดทาน · Wheels reduce friction' } },
};
const ORDER = ['head', 'body', 'armL', 'armR', 'legs'];
const eyeMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });   // eyes light up when the robot wakes

// Every builder returns a group whose origin is where it attaches to the robot
function makeHead(v) {
  const g = new THREE.Group();
  const c = ['#FF6B9D', '#95E06C', '#FF9F1C'][v];
  box(g, .4, .3, .4, '#9aa3b2', 0, .15, 0);                                  // neck
  if (v === 0) {                                                               // square head, two antennas
    box(g, 1.7, 1.4, 1.5, c, 0, 1, 0);
    [-.45, .45].forEach(x => { box(g, .08, .5, .08, INK, x, 1.95, 0); box(g, .22, .22, .22, '#FFD93D', x, 2.25, 0); });
  } else if (v === 1) {                                                        // wide head, one antenna, visor
    box(g, 2, 1.2, 1.4, c, 0, .95, 0);
    box(g, 1.6, .45, .1, INK, 0, 1.05, .71);
    box(g, .08, .6, .08, INK, 0, 1.85, 0); box(g, .26, .26, .26, '#FF6B9D', 0, 2.2, 0);
  } else {                                                                     // round-ish stepped head with ears
    box(g, 1.6, 1.5, 1.5, c, 0, 1.05, 0); box(g, 1.2, .3, 1.2, c, 0, 1.9, 0);
    [-.95, .95].forEach(x => box(g, .3, .5, .5, '#FFD93D', x, 1.05, 0));
  }
  const ex = v === 1 ? .45 : .38, ez = v === 1 ? .77 : .76;
  [-ex, ex].forEach(x => {
    box(g, .36, .36, .06, '#ffffff', x, 1.1, ez - .02, false);
    const pupil = new THREE.Mesh(new THREE.BoxGeometry(.16, .16, .06), eyeMat);
    pupil.position.set(x, 1.1, ez + .02); g.add(pupil);
  });
  box(g, .6, .1, .06, INK, 0, .65, ez, false);                                 // mouth
  return g;
}
function makeBody(v) {
  const g = new THREE.Group();
  const c = ['#4ECDC4', '#A06CD5', '#FFD93D'][v];
  box(g, 2.4, 2, 1.6, c, 0, 1, 0);
  if (v === 0) {                                                               // dial + buttons
    box(g, .8, .8, .08, '#FFD93D', -.45, 1.1, .82, false); box(g, .25, .25, .1, INK, -.45, 1.1, .85, false);
    box(g, .35, .35, .08, '#FF6B9D', .6, 1.35, .82, false); box(g, .3, .3, .08, '#A06CD5', .6, .75, .82, false);
  } else if (v === 1) {                                                        // screen with hearts
    box(g, 1.7, 1, .08, INK, 0, 1.2, .82, false); box(g, 1.5, .8, .08, '#95E06C', 0, 1.2, .85, false);
    [-.4, 0, .4].forEach(x => box(g, .2, .2, .06, '#FF6B9D', x, 1.2, .9, false));
    [-.6, 0, .6].forEach((x, i) => box(g, .2, .2, .06, ['#FFD93D', '#FF6B9D', '#4ECDC4'][i], x, .4, .82, false));
  } else {                                                                     // light strip + star
    box(g, 2, .4, .08, INK, 0, 1.55, .82, false);
    ['#FF6B9D', '#95E06C', '#4ECDC4', '#FF9F1C'].forEach((col, i) => box(g, .16, .16, .06, col, -.6 + i * .4, 1.55, .86, false));
    box(g, .6, .6, .08, '#FF6B9D', -.45, .7, .82, false); box(g, .7, .45, .08, '#4ECDC4', .5, .7, .82, false);
  }
  // a gear on the side (it spins when the robot is awake)
  const gear = new THREE.Group();
  box(gear, .1, .7, .7, '#9aa3b2', 0, 0, 0);
  box(gear, .1, .25, 1, '#9aa3b2', 0, 0, 0); box(gear, .1, 1, .25, '#9aa3b2', 0, 0, 0);
  gear.position.set(1.25, 1, 0);
  g.add(gear); g.userData.gear = gear;
  return g;
}
function makeArm(v, side) {
  const g = new THREE.Group();                                                 // origin = shoulder; the arm hangs down
  const c = ['#A06CD5', '#FF6B9D', '#4ECDC4'][v];
  box(g, .5, .5, .5, '#9aa3b2', 0, 0, 0);
  if (v === 0) {                                                               // two chunky segments
    box(g, .45, .9, .45, c, 0, -.6, 0); box(g, .55, .7, .55, c, 0, -1.35, 0);
    box(g, .4, .4, .4, '#FFD93D', 0, -1.85, 0);
  } else if (v === 1) {                                                        // springy zig-zag arm
    for (let i = 0; i < 5; i++) box(g, .45, .18, .3, i % 2 ? INK : c, (i % 2 ? .08 : -.08), -.35 - i * .22, 0);
    box(g, .6, .6, .6, c, 0, -1.6, 0); box(g, .25, .25, .25, '#FFD93D', 0, -1.6, .3);
  } else {                                                                     // robot claw
    box(g, .45, 1.2, .45, c, 0, -.75, 0);
    box(g, .7, .3, .5, c, 0, -1.45, 0);
    [-.25, .25].forEach(x => box(g, .14, .45, .3, INK, x, -1.8, 0));
  }
  g.scale.x = side;
  return g;
}
function makeLegs(v) {
  const g = new THREE.Group();                                                 // origin = floor; top at y ≈ 1.7
  const c = ['#2D9CDB', '#FF9F1C', '#95E06C'][v];
  box(g, 1.8, .3, 1.2, '#9aa3b2', 0, 1.55, 0);
  g.userData.wheels = [];
  if (v === 0) {                                                               // two legs with boots
    [-.55, .55].forEach(x => { box(g, .45, 1.1, .45, c, x, .85, 0); box(g, .7, .35, .9, INK, x, .18, .1); });
  } else if (v === 1) {                                                        // wheels
    box(g, .4, .8, .4, c, 0, 1.1, 0); box(g, 2, .3, .6, c, 0, .7, 0);
    [-1.05, 1.05].forEach(x => {
      const w = new THREE.Group();
      box(w, .3, .9, .9, INK, 0, 0, 0); box(w, .32, .5, .5, '#FFD93D', 0, 0, 0);
      w.position.set(x, .45, 0); g.add(w); g.userData.wheels.push(w);
    });
  } else {                                                                     // tank tracks
    [-.6, .6].forEach(x => {
      box(g, .55, .7, 1.6, INK, x, .35, 0);
      for (let z = -.6; z <= .61; z += .4) box(g, .6, .14, .14, '#9aa3b2', x, .72, z, false);
    });
    box(g, .9, .8, .6, c, 0, 1, 0);
  }
  return g;
}
function makePart(id, v) {
  if (id === 'head') return makeHead(v);
  if (id === 'body') return makeBody(v);
  if (id === 'armL') return makeArm(v, -1);
  if (id === 'armR') return makeArm(v, 1);
  return makeLegs(v);
}

/* =========================================================
   The workshop
   ========================================================= */
box(scene, 16, .4, 12, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 12, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 10, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 7, '#9b6a3c', 0, -3, 0);
// round-ish turntable the robot stands on
const turntable = new THREE.Group();
scene.add(turntable);
box(turntable, 4, .3, 4, '#c9ced8', 0, .15, 0);
box(turntable, 3.2, .32, 4.4, '#c9ced8', 0, .16, 0); box(turntable, 4.4, .32, 3.2, '#c9ced8', 0, .16, 0);
for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; box(turntable, .2, .34, .2, '#FFD93D', Math.cos(a) * 1.8, .17, Math.sin(a) * 1.8, false); }
const robot = new THREE.Group();
robot.position.y = .32;
turntable.add(robot);
// workshop props: tool wall + Summer
box(scene, 7, 4.5, .4, '#e9dcc4', 0, 2.25, -4.6);
box(scene, 7.4, .3, .6, '#c98a5a', 0, 4.6, -4.6);
[[-2.5, 3, '#e63946'], [-1.2, 3.3, '#2D9CDB'], [1.4, 2.9, '#FF9F1C'], [2.6, 3.2, '#95E06C']].forEach(([x, y, c]) => {
  box(scene, .18, 1.2, .1, '#9aa3b2', x, y, -4.35); box(scene, .5, .35, .14, c, x, y + .7, -4.33);
});
[-1.7, 1.7].forEach(x => { box(scene, .5, .5, .1, '#9aa3b2', x + .3, 1.5, -4.35); box(scene, .2, .7, .12, '#9aa3b2', x + .3, 1.5, -4.33); });
const summer = kit.makeSummer();
summer.g.position.set(-4.6, 0, 1.2); summer.g.rotation.y = .9;
scene.add(summer.g);

// Ghost outlines show where each part goes
const ghostMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .35, depthWrite: false });
const GHOST = { head: [1.7, 1.6, 1.5, 0, 4.6, 0], body: [2.4, 2, 1.6, 0, 2.7, 0], armL: [.55, 2, .55, -1.45, 2.5, 0], armR: [.55, 2, .55, 1.45, 2.5, 0], legs: [1.8, 1.7, 1.2, 0, .85, 0] };
const ghosts = {};
ORDER.forEach(id => {
  const [w, h, d, x, y, z] = GHOST[id];
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), ghostMat);
  m.position.set(x, y, z);
  robot.add(m); ghosts[id] = m;
});

// Pedestals in front of the robot
const PED = { head: [-4.4, 3.2], body: [-2.2, 4.2], armL: [0, 4.6], armR: [2.2, 4.2], legs: [4.4, 3.2] };
const pedestals = {};
ORDER.forEach(id => {
  const [x, z] = PED[id];
  box(scene, 1.4, .7, 1.4, '#f2e6d0', x, .35, z);
  box(scene, 1.5, .12, 1.5, '#e3793a', x, .72, z);
  const l = kit.labelSprite(PARTS[id].th, .45); l.position.set(x, 1.15, z + .9); scene.add(l);
  pedestals[id] = new THREE.Vector3(x, .8, z);
});

/* =========================================================
   Game state
   ========================================================= */
const S = { variant: {}, parts: {}, placed: new Set(), awake: false, flights: [] };
const countEl = document.getElementById('count');
const partBtns = document.getElementById('partBtns');
ORDER.forEach(id => {
  const b = document.createElement('button');
  b.className = 'w-btn white part-btn'; b.dataset.id = id;
  b.innerHTML = `<span class="em">${PARTS[id].emoji}</span>${PARTS[id].th}`;
  b.onclick = () => place(id);
  partBtns.appendChild(b);
});

// Where a part sits when it's on the robot / waiting on its pedestal
function slotPos(id) { return new THREE.Vector3(...PARTS[id].at); }
function partScaleOnPedestal(id) { return id === 'body' || id === 'legs' || id === 'head' ? .45 : .6; }

function newRobot() {
  ORDER.forEach(id => { if (S.parts[id]) S.parts[id].parent.remove(S.parts[id]); });
  S.placed.clear(); S.awake = false; S.flights = []; S.danceT = 0;
  eyeMat.color.set('#ffffff');
  turntable.rotation.y = 0; robot.position.y = .32; robot.rotation.set(0, 0, 0);
  ORDER.forEach(id => {
    S.variant[id] = Math.floor(Math.random() * 3);
    const p = makePart(id, S.variant[id]);
    p.traverse(m => { m.userData.partId = id; });
    p.position.copy(pedestals[id]); p.scale.setScalar(partScaleOnPedestal(id));
    scene.add(p);
    S.parts[id] = p;
    ghosts[id].visible = true;
  });
  document.querySelectorAll('.part-btn').forEach(b => { b.disabled = false; });
  countEl.textContent = 0;
  caption('แตะชิ้นส่วน แล้วมันจะบินไปต่อเป็นหุ่นยนต์! 🤖');
}

function place(id) {
  if (S.placed.has(id) || S.flights.some(f => f.id === id)) return;
  const p = S.parts[id];
  // fly from the pedestal (world space) to the slot on the robot
  const from = p.getWorldPosition(new THREE.Vector3());
  const to = robot.localToWorld(slotPos(id));
  S.flights.push({ id, p, from, to, t: 0, s0: p.scale.x });
  document.querySelector(`.part-btn[data-id="${id}"]`).disabled = true;
  kit.tones([392, 523], .06, 'triangle', .14);
}

function attached(f) {
  const { id, p } = f;
  scene.remove(p); robot.add(p);
  p.position.copy(slotPos(id)); p.scale.setScalar(1); p.rotation.set(0, 0, 0);
  ghosts[id].visible = false;
  S.placed.add(id);
  countEl.textContent = S.placed.size;
  kit.tones([200, 150], .05, 'square', .12);   // clank!
  fx.burst(...robot.localToWorld(slotPos(id)).toArray(), ['#ffffff', '#FFD93D', '#9aa3b2'], 14);
  if (S.placed.size === 5) setTimeout(wakeUp, 500);
  else showLesson(id);
}

const lessonBg = document.getElementById('lesson');
function showLesson(id) {
  const L = PARTS[id].lesson;
  document.getElementById('lEm').textContent = L.em;
  document.getElementById('lTitle').textContent = L.th;
  document.getElementById('lEn').textContent = L.en;
  document.getElementById('lDesc').textContent = L.desc;
  document.getElementById('lFact').textContent = L.fact;
  lessonBg.classList.add('show');
  kit.speak(L.th + ' ' + L.desc);
}
document.getElementById('lOk').onclick = () => lessonBg.classList.remove('show');
lessonBg.addEventListener('click', e => { if (e.target === lessonBg) lessonBg.classList.remove('show'); });

function wakeUp() {
  S.awake = true; S.danceT = 0;
  eyeMat.color.set('#4ef0ff');
  const banner = document.getElementById('banner');
  banner.classList.add('show'); setTimeout(() => banner.classList.remove('show'), 3200);
  fx.burst(0, 5, 0); setTimeout(() => fx.burst(0, 4, 0, ['#4ECDC4', '#FFD93D', '#FF6B9D']), 300);
  kit.cheer();
  caption('หุ่นยนต์ตื่นแล้ว! เก่งมาก Summer! แตะชิ้นส่วนบนตัวหุ่นเพื่อเปลี่ยนแบบได้นะ 🎉', true, 7000);
}

// Swap a part on the finished robot for its next style
function swap(id) {
  const old = S.parts[id];
  S.variant[id] = (S.variant[id] + 1) % 3;
  const p = makePart(id, S.variant[id]);
  p.traverse(m => { m.userData.partId = id; });
  p.position.copy(old.position);
  robot.remove(old); robot.add(p); S.parts[id] = p;
  p.scale.setScalar(.6); S.flights.push({ pop: true, p, t: 0 });
  kit.tones([523, 784], .05, 'triangle', .12);
}

/* =========================================================
   Input + loop
   ========================================================= */
document.getElementById('newBtn').onclick = () => { kit.tones([330, 440, 554, 659], .06); newRobot(); };
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(ORDER.map(id => S.parts[id]), true)[0];
  if (hit) {
    const id = hit.object.userData.partId;
    if (!S.placed.has(id)) place(id);
    else if (S.placed.size === 5) swap(id);
    return;
  }
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); }
});

const portrait = innerWidth < innerHeight;
camera.position.set(0, 9, 20); controls.target.set(0, 2.5, 0);
kit.flyTo(stage, portrait ? new THREE.Vector3(0, 14, 31) : new THREE.Vector3(2, 8.5, 19), new THREE.Vector3(0, portrait ? 1.6 : 2.4, 0), 1200);
newRobot();

stage.start((dt, time) => {
  // parts flying to the robot (or popping after a swap)
  for (let i = S.flights.length - 1; i >= 0; i--) {
    const f = S.flights[i];
    if (f.pop) {
      f.t = Math.min(1, f.t + dt * 3);
      f.p.scale.setScalar(.6 + .4 * f.t + Math.sin(f.t * Math.PI) * .25);
      if (f.t >= 1) S.flights.splice(i, 1);
      continue;
    }
    f.t = Math.min(1, f.t + dt * 1.4);
    const e = 1 - Math.pow(1 - f.t, 3);
    f.to.copy(robot.localToWorld(slotPos(f.id)));   // the turntable may be turning
    f.p.position.lerpVectors(f.from, f.to, e);
    f.p.position.y += Math.sin(f.t * Math.PI) * 2.5;
    f.p.scale.setScalar(f.s0 + (1 - f.s0) * e);
    f.p.rotation.y = (1 - e) * Math.PI * 2;
    if (f.t >= 1) { S.flights.splice(i, 1); attached(f); }
  }
  // parts waiting on pedestals bob and turn
  ORDER.forEach((id, i) => {
    const p = S.parts[id];
    if (p && p.parent === scene && !S.flights.some(f => f.p === p)) {
      p.position.y = pedestals[id].y + Math.sin(time * 2 + i) * .12;
      p.rotation.y = time * .8 + i;
    }
  });
  ghostMat.opacity = .2 + Math.sin(time * 3) * .12;
  // awake robot: turn, bounce, wave, spin gears and wheels
  if (S.awake) {
    S.danceT += dt;
    turntable.rotation.y += dt * .5;
    robot.position.y = .32 + Math.abs(Math.sin(S.danceT * 4)) * .25;
    S.parts.armL.rotation.z = -.4 - Math.abs(Math.sin(S.danceT * 4)) * .9;
    S.parts.armR.rotation.z = .4 + Math.abs(Math.sin(S.danceT * 4 + 1)) * 1.4;
    S.parts.head.rotation.z = Math.sin(S.danceT * 4) * .12;
    S.parts.body.userData.gear.rotation.x += dt * 4;
    (S.parts.legs.userData.wheels || []).forEach(w => { w.rotation.x += dt * 6; });
    eyeMat.color.setHSL(.5, 1, .55 + Math.sin(time * 6) * .15);
  }
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 || S.awake ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
</script>
