<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* part buttons: a grid so 12 parts still fit on a phone (2 rows of 6) */
  #partBtns { display: grid; gap: 6px; }
  .part-btn { min-width: 0; padding: 0 2px; font-size: 13px; flex-direction: column; gap: 0; min-height: 58px; line-height: 1.1; }
  .part-btn .em { font-size: 22px; }
  .part-btn:disabled { opacity: .45; }
  #partBtns.done { display: none; }               /* all parts on → hide the buttons, show the robot */
  .lvl-btn { padding: 0 16px; }
  .lv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px; }
  .lv-grid button { min-height: 96px; height: auto; width: 100%; border-radius: 22px; flex-direction: column; gap: 2px; font-size: 17px; padding: 8px 4px; white-space: nowrap; }
  .lv-grid button .em { font-size: 30px; }
  .lv-grid button small { font-size: 13px; opacity: .75; }
  .lv-grid button.on { outline: 4px solid var(--orange); }
  @media (max-width: 520px) {
    #countPill { display: none; }
    .w-dock .w-controls { gap: 6px; flex-wrap: nowrap; }
    .w-dock .w-controls .w-btn, .lvl-btn { padding: 0 12px; }
    .w-seg button { padding: 0 10px; }
    .w-dock .w-controls button { white-space: nowrap; }
    #newBtn { font-size: 26px; } #newBtn .lbl { display: none; }
  }
  .count { font-weight: 900; color: var(--orange-dark); }
  .w-seg button { min-width: 0; padding: 0 14px; font-size: 16px; }
  .lesson-em { font-size: 64px; text-align: center; line-height: 1.1; }
  .w-card .en-sub { text-align: center; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .w-card .fact { background: #fff8e6; border-radius: 16px; padding: 12px; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🤖 สร้างหุ่นยนต์ <span class="en">· ROBOT BUILDER</span></div>

<div class="w-banner" id="banner">🤖 หุ่นยนต์ตื่นแล้ว! 🎉</div>

    <div class="w-seg" title="แตะชิ้นส่วนบนตัวหุ่นแล้วจะ… / Tapping a part on the robot will…">

<script type="module">
/* =========================================================
   สร้างหุ่นยนต์ (Robot builder)
   Parts wait on pedestals. Tap a part (or its button) → it flies onto the robot
   and a short science card explains it (first time only). All parts → the robot wakes up and dances.
   4 levels add more parts: Noob 5 · Pro 7 · Hacker 9 · God 12.
   Every part gets a random colour; tap a part on the robot for a new random colour
   (or, with 🔀, the next style).
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 44;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.45;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 18, radius: 15, spread: 10, y0: -2 });

// ── Caption (+ speech) ──
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

// A random colour code — bright enough for a toy (any hue, never grey or too dark)
function randomColor() {
  return '#' + new THREE.Color().setHSL(Math.random(), .55 + Math.random() * .4, .5 + Math.random() * .17).getHexString();
}

/* =========================================================
   Parts — each has 3 styles. `at` = where its origin sits on the robot.
   ========================================================= */
const INK = '#2D3047';
const PARTS = {
  head:    { th: 'หัว',     emoji: '🙂', at: [0, 3.7, 0],      ped: .45, lesson: { em: '🔋', th: 'ไฟฟ้า!',      en: 'ELECTRICITY', desc: 'ในหัวหุ่นยนต์มีสมองกล ใช้ไฟฟ้าในการคิด', fact: '⚡ สมองหุ่นยนต์ใช้ไฟฟ้า · A robot brain runs on electricity' } },
  body:    { th: 'ตัว',     emoji: '👕', at: [0, 1.7, 0],      ped: .45, lesson: { em: '⚙️', th: 'เฟือง!',      en: 'GEARS',       desc: 'ในตัวหุ่นมีเฟืองหมุนช่วยกัน ทำให้หุ่นขยับได้', fact: '⚙️ เฟืองช่วยให้เครื่องจักรขยับ · Gears help machines move' } },
  armL:    { th: 'แขนซ้าย', emoji: '💪', at: [-1.45, 3.4, 0],  ped: .6,  lesson: { em: '💪', th: 'คาน!',        en: 'LEVERS',      desc: 'แขนหุ่นทำงานเหมือนคาน แบบเดียวกับแขนเราตอนยกของ', fact: '💪 แขนคือคาน เครื่องกลอย่างง่าย · Arms are levers' } },
  armR:    { th: 'แขนขวา',  emoji: '🦾', at: [1.45, 3.4, 0],   ped: .6,  lesson: { em: '🦾', th: 'มอเตอร์!',     en: 'MOTORS',      desc: 'มอเตอร์หมุนได้ ช่วยให้แขนหุ่นยนต์โบกมือได้', fact: '🔄 มอเตอร์หมุนแล้วทำให้ของขยับ · Motors spin to make things move' } },
  legs:    { th: 'ขา',      emoji: '🦿', at: [0, 0, 0],        ped: .45, lesson: { em: '🦿', th: 'การเคลื่อนที่!', en: 'MOVEMENT',   desc: 'ขาหรือล้อช่วยให้หุ่นยนต์ไปที่ต่างๆ ได้', fact: '🛞 ล้อช่วยลดแรงเสียดทาน · Wheels reduce friction' } },
  // Pro
  hat:     { th: 'หมวก',    emoji: '🎩', at: null,             ped: .6,  lesson: { em: '📡', th: 'คลื่นวิทยุ!',  en: 'RADIO WAVES', desc: 'บนหมวกมีเสาอากาศ รับส่งข้อความผ่านอากาศได้ เหมือนวิทยุและโทรศัพท์', fact: '📻 คลื่นวิทยุมองไม่เห็น แต่เดินทางเร็วมาก · Radio waves are invisible and fast' } },
  jetpack: { th: 'เป้จรวด', emoji: '🚀', at: [0, 2.6, -.8],    ped: .6,  lesson: { em: '🚀', th: 'แรงขับ!',     en: 'THRUST',      desc: 'เป้จรวดพ่นไฟลงข้างล่าง แล้วดันหุ่นยนต์ขึ้นข้างบน', fact: '🔥 พ่นลง ตัวพุ่งขึ้น · Push down, go up' } },
  // Hacker
  wings:   { th: 'ปีก',     emoji: '🦅', at: [0, 3.25, -.85],  ped: .4,  lesson: { em: '✈️', th: 'แรงยก!',      en: 'LIFT',        desc: 'ลมที่ไหลผ่านปีกช่วยยกให้ลอยขึ้น เหมือนเครื่องบินและนก', fact: '🕊️ ปีกช่วยให้ลอยได้ · Wings make lift' } },
  screen:  { th: 'จอโค้ด',  emoji: '💻', at: [-3.1, 3.4, 1.1], ped: .6,  lesson: { em: '💻', th: 'โค้ด!',       en: 'CODING',      desc: 'หุ่นยนต์ทำตามคำสั่งทีละขั้น คำสั่งพวกนี้เรียกว่าโค้ด', fact: '▶ เดินหน้า → เลี้ยว → โบกมือ · Code = steps in order' } },
  // God
  halo:    { th: 'วงแหวน',  emoji: '☀️', at: [0, 7.3, 0],      ped: .55, lesson: { em: '☀️', th: 'พลังแสงอาทิตย์!', en: 'SOLAR POWER', desc: 'วงแหวนนี้เป็นแผงโซลาร์ เปลี่ยนแสงแดดเป็นไฟฟ้าให้หุ่นยนต์', fact: '🔆 แสงแดดกลายเป็นไฟฟ้า · Sunlight becomes electricity' } },
  drone:   { th: 'โดรน',    emoji: '🚁', at: [3.1, 4.7, .9],   ped: .7,  lesson: { em: '🚁', th: 'ใบพัด!',      en: 'PROPELLERS',  desc: 'ใบพัดหมุนเร็วๆ ดันอากาศลงข้างล่าง โดรนเลยลอยได้', fact: '🌀 ใบพัดหมุน โดรนลอย · Spinning blades lift the drone' } },
  orbit:   { th: 'ดาวบริวาร', emoji: '🪐', at: [0, 2.6, 0],    ped: 1,   lesson: { em: '🪐', th: 'วงโคจร!',     en: 'ORBIT',       desc: 'ดาวจิ๋วบินวนรอบหุ่นยนต์ เหมือนดวงจันทร์วนรอบโลก', fact: '🌍 ดวงจันทร์โคจรรอบโลก · The Moon orbits Earth' } },
};
const LEVELS = [
  { id: 'noob',   th: 'มือใหม่',  en: 'Noob',   em: '🐣', parts: ['head', 'body', 'armL', 'armR', 'legs'] },
  { id: 'pro',    th: 'โปร',     en: 'Pro',    em: '😎', parts: ['head', 'body', 'armL', 'armR', 'legs', 'hat', 'jetpack'] },
  { id: 'hacker', th: 'แฮกเกอร์', en: 'Hacker', em: '💻', parts: ['head', 'body', 'armL', 'armR', 'legs', 'hat', 'jetpack', 'wings', 'screen'] },
  { id: 'god',    th: 'เทพ',     en: 'God',    em: '⚡', parts: ['head', 'body', 'armL', 'armR', 'legs', 'hat', 'jetpack', 'wings', 'screen', 'halo', 'drone', 'orbit'] },
];
const HEAD_TOP = [1.7, 1.55, 2.05];   // top of each head style → where the hat sits
const eyeMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });   // eyes light up when the robot wakes

// Every builder returns a group whose origin is where it attaches to the robot. c = its main colour.
function makeHead(v, c) {
  const g = new THREE.Group();
  box(g, .4, .3, .4, '#9aa3b2', 0, .15, 0);                                  // neck
  if (v === 0) {                                                               // square head, two antennas
    box(g, 1.7, 1.4, 1.5, c, 0, 1, 0);
    [-.45, .45].forEach(x => { box(g, .08, .5, .08, INK, x, 1.95, 0); box(g, .22, .22, .22, '#FFD93D', x, 2.25, 0); });
  } else if (v === 1) {                                                        // wide head, one antenna, visor
    box(g, 2, 1.2, 1.4, c, 0, .95, 0);
    box(g, 1.6, .45, .1, INK, 0, 1.05, .71);
    box(g, .08, .6, .08, INK, 0, 1.85, 0); box(g, .26, .26, .26, '#FF6B9D', 0, 2.2, 0);
  } else {                                                                     // round-ish stepped head with ears
    box(g, 1.6, 1.5, 1.5, c, 0, 1.05, 0); box(g, 1.2, .3, 1.2, c, 0, 1.9, 0);
    [-.95, .95].forEach(x => box(g, .3, .5, .5, '#FFD93D', x, 1.05, 0));
  }
  const ex = v === 1 ? .45 : .38, ez = v === 1 ? .77 : .76;
  [-ex, ex].forEach(x => {
    box(g, .36, .36, .06, '#ffffff', x, 1.1, ez - .02, false);
    const pupil = new THREE.Mesh(new THREE.BoxGeometry(.16, .16, .06), eyeMat);
    pupil.position.set(x, 1.1, ez + .02); g.add(pupil);
  });
  box(g, .6, .1, .06, INK, 0, .65, ez, false);                                 // mouth
  return g;
}
function makeBody(v, c) {
  const g = new THREE.Group();
  box(g, 2.4, 2, 1.6, c, 0, 1, 0);
  if (v === 0) {                                                               // dial + buttons
    box(g, .8, .8, .08, '#FFD93D', -.45, 1.1, .82, false); box(g, .25, .25, .1, INK, -.45, 1.1, .85, false);
    box(g, .35, .35, .08, '#FF6B9D', .6, 1.35, .82, false); box(g, .3, .3, .08, '#A06CD5', .6, .75, .82, false);
  } else if (v === 1) {                                                        // screen with hearts
    box(g, 1.7, 1, .08, INK, 0, 1.2, .82, false); box(g, 1.5, .8, .08, '#95E06C', 0, 1.2, .85, false);
    [-.4, 0, .4].forEach(x => box(g, .2, .2, .06, '#FF6B9D', x, 1.2, .9, false));
    [-.6, 0, .6].forEach((x, i) => box(g, .2, .2, .06, ['#FFD93D', '#FF6B9D', '#4ECDC4'][i], x, .4, .82, false));
  } else {                                                                     // light strip + star
    box(g, 2, .4, .08, INK, 0, 1.55, .82, false);
    ['#FF6B9D', '#95E06C', '#4ECDC4', '#FF9F1C'].forEach((col, i) => box(g, .16, .16, .06, col, -.6 + i * .4, 1.55, .86, false));
    box(g, .6, .6, .08, '#FF6B9D', -.45, .7, .82, false); box(g, .7, .45, .08, '#4ECDC4', .5, .7, .82, false);
  }
  // a gear on the side (it spins when the robot is awake)
  const gear = new THREE.Group();
  box(gear, .1, .7, .7, '#9aa3b2', 0, 0, 0);
  box(gear, .1, .25, 1, '#9aa3b2', 0, 0, 0); box(gear, .1, 1, .25, '#9aa3b2', 0, 0, 0);
  gear.position.set(1.25, 1, 0);
  g.add(gear); g.userData.gear = gear;
  return g;
}
function makeArm(v, c, side) {
  const g = new THREE.Group();                                                 // origin = shoulder; the arm hangs down
  box(g, .5, .5, .5, '#9aa3b2', 0, 0, 0);
  if (v === 0) {                                                               // two chunky segments
    box(g, .45, .9, .45, c, 0, -.6, 0); box(g, .55, .7, .55, c, 0, -1.35, 0);
    box(g, .4, .4, .4, '#FFD93D', 0, -1.85, 0);
  } else if (v === 1) {                                                        // springy zig-zag arm
    for (let i = 0; i < 5; i++) box(g, .45, .18, .3, i % 2 ? INK : c, (i % 2 ? .08 : -.08), -.35 - i * .22, 0);
    box(g, .6, .6, .6, c, 0, -1.6, 0); box(g, .25, .25, .25, '#FFD93D', 0, -1.6, .3);
  } else {                                                                     // robot claw
    box(g, .45, 1.2, .45, c, 0, -.75, 0);
    box(g, .7, .3, .5, c, 0, -1.45, 0);
    [-.25, .25].forEach(x => box(g, .14, .45, .3, INK, x, -1.8, 0));
  }
  g.scale.x = side;
  return g;
}
function makeLegs(v, c) {
  const g = new THREE.Group();                                                 // origin = floor; top at y ≈ 1.7
  box(g, 1.8, .3, 1.2, '#9aa3b2', 0, 1.55, 0);
  g.userData.wheels = [];
  if (v === 0) {                                                               // two legs with boots
    [-.55, .55].forEach(x => { box(g, .45, 1.1, .45, c, x, .85, 0); box(g, .7, .35, .9, INK, x, .18, .1); });
  } else if (v === 1) {                                                        // wheels
    box(g, .4, .8, .4, c, 0, 1.1, 0); box(g, 2, .3, .6, c, 0, .7, 0);
    [-1.05, 1.05].forEach(x => {
      const w = new THREE.Group();
      box(w, .3, .9, .9, INK, 0, 0, 0); box(w, .32, .5, .5, '#FFD93D', 0, 0, 0);
      w.position.set(x, .45, 0); g.add(w); g.userData.wheels.push(w);
    });
  } else {                                                                     // tank tracks
    [-.6, .6].forEach(x => {
      box(g, .55, .7, 1.6, INK, x, .35, 0);
      for (let z = -.6; z <= .61; z += .4) box(g, .6, .14, .14, '#9aa3b2', x, .72, z, false);
    });
    box(g, .9, .8, .6, c, 0, 1, 0);
  }
  return g;
}
function makeHat(v, c) {
  const g = new THREE.Group();                                                 // origin = bottom of the hat
  if (v === 0) {                                                               // cap with a little radar dish
    box(g, 1.5, .35, 1.4, c, 0, .17, 0); box(g, 1.5, .1, .55, c, 0, .05, .9);
    box(g, .1, .45, .1, INK, 0, .55, 0); box(g, .75, .12, .75, '#FFD93D', 0, .82, 0); box(g, .12, .2, .12, '#FF6B9D', 0, .95, 0);
  } else if (v === 1) {                                                        // propeller beanie (the propeller spins)
    box(g, 1.4, .45, 1.4, c, 0, .22, 0); box(g, .9, .2, .9, c, 0, .55, 0); box(g, .1, .3, .1, INK, 0, .78, 0);
    const prop = new THREE.Group();
    box(prop, 1.7, .06, .22, '#FFD93D', 0, 0, 0); box(prop, .22, .06, 1.7, '#FF6B9D', 0, 0, 0);
    prop.position.y = .95; g.add(prop); g.userData.spin = prop;
  } else {                                                                     // crown with an antenna gem
    box(g, 1.5, .4, 1.5, c, 0, .2, 0);
    [[-.55, -.55], [.55, -.55], [-.55, .55], [.55, .55], [0, .6]].forEach(([x, z]) => box(g, .28, .45, .28, '#FFD93D', x, .6, z));
    box(g, .3, .3, .1, '#4ECDC4', 0, .22, .78, false);
  }
  return g;
}
function makeJetpack(v, c) {
  const g = new THREE.Group();                                                 // origin = robot's back; it sticks out behind (−z)
  const tanks = v === 0 ? [-.38, .38] : v === 1 ? [0] : [-.55, 0, .55];
  const w = v === 1 ? .9 : v === 0 ? .55 : .42;
  box(g, 1.5, .9, .2, '#9aa3b2', 0, .1, -.1);                                  // straps plate
  const flame = new THREE.Group();
  tanks.forEach(x => {
    box(g, w, 1.3, .6, c, x, 0, -.5);

}
function makeWings(v, c) {
  const g = new THREE.Group();                                                 // origin = robot's back; two wings hinge here
  g.userData.sides = [];

    const w = new THREE.Group();
    w.position.set(side * .35, 0, -.15);
    if (v === 0) {                                                             // feathery bird wing, steps down
      [[.7, 1.1], [1.25, .95], [1.8, .75], [2.3, .5]].forEach(([x, h], i) => box(w, .6, h, .16, i % 2 ? '#ffffff' : c, side * x, .25 - i * .08, 0));
    } else if (v === 1) {                                                      // flat plane wing with a stripe

// The hologram screen shows a tiny program (drawn into a canvas texture)
function codeTexture(c) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 176;
  const x = cv.getContext('2d');
  x.fillStyle = '#10223a'; x.fillRect(0, 0, 256, 176);
  x.font = '700 26px "Fredoka","Noto Sans Thai",sans-serif';
  ['▶ เดินหน้า 3', '↻ เลี้ยวขวา', '👋 โบกมือ', '💃 เต้น!'].forEach((t, i) => {
    x.fillStyle = i % 2 ? '#7CFFB2' : c; x.fillText((i + 1) + ' ' + t, 14, 40 + i * 38);

  return tex;
}
function makeScreen(v, c) {
  const g = new THREE.Group();                                                 // origin = middle of a floating screen
  const [w, h] = [[1.8, 1.25], [2.2, 1.25], [1.5, 1.5]][v];
  box(g, w + .2, h + .2, .12, c, 0, 0, -.04);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: codeTexture(c) }));
  face.position.z = .03; g.add(face);
  box(g, .14, .8, .14, '#9aa3b2', 0, -h / 2 - .5, -.05);                       // little stand
  box(g, .8, .12, .5, c, 0, -h / 2 - .95, 0);
  g.rotation.y = .45;
  return g;
}
function makeHalo(v, c) {
  const g = new THREE.Group();                                                 // origin = centre of the ring (it spins)
  const n = [12, 16, 8][v], r = [1.1, 1.25, 1][v];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const m = box(g, .42, .12, .42, i % 2 ? c : '#2b4c9b', Math.cos(a) * r, 0, Math.sin(a) * r, false);   // dark tiles = solar cells
    m.rotation.y = -a;
  }
  if (v === 2) for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + .4; box(g, .2, .4, .2, '#FFD93D', Math.cos(a) * r, .25, Math.sin(a) * r, false); }

}
function makeDrone(v, c) {
  const g = new THREE.Group();                                                 // origin = centre of the drone
  box(g, .8, .32, .8, c, 0, 0, 0); box(g, .3, .2, .1, INK, 0, -.05, .42, false);
  box(g, .14, .14, .06, v === 1 ? '#FF6B9D' : '#4ef0ff', 0, -.05, .48, false);   // camera light
  g.userData.rotors = [];
  const arms = v === 2 ? 6 : 4;
  for (let i = 0; i < arms; i++) {
    const a = i / arms * Math.PI * 2 + Math.PI / 4;
    const ax = Math.cos(a) * .7, az = Math.sin(a) * .7;
    const arm = box(g, .7, .08, .1, '#9aa3b2', ax / 2, .05, az / 2, false); arm.rotation.y = -a;
    const rotor = new THREE.Group();
    box(rotor, .7, .04, .1, v === 1 ? '#FFD93D' : INK, 0, 0, 0, false); box(rotor, .1, .04, .7, v === 1 ? '#FFD93D' : INK, 0, 0, 0, false);
    rotor.position.set(ax, .14, az); g.add(rotor); g.userData.rotors.push(rotor);
  }
  return g;
}
function makeOrbit(v, c) {
  const g = new THREE.Group();                                                 // origin = robot's middle; little planets circle it
  const ring = new THREE.Group(); g.add(ring);
  const cols = [c, '#FFD93D', '#ffffff', '#FF9F1C'];
  const sizes = [[.6, .45, .35], [.5, .5, .5, .5], [.8, .35]][v];
  ring.userData.planets = sizes.map((s, i) => {
    const p = new THREE.Group();
    box(p, s, s, s, cols[i % cols.length], 0, 0, 0);
    if (v === 2 && i === 0) box(p, s * 1.8, .08, s * 1.8, '#FFD93D', 0, 0, 0, false);   // a ringed planet
    p.userData.a = i / sizes.length * Math.PI * 2;
    ring.add(p); return p;
  });
  g.userData.ring = ring;
  setOrbitRadius(g, .6);
  return g;
}
function setOrbitRadius(g, r) {
  g.userData.r = r;
  g.userData.ring.userData.planets.forEach((p, i) => p.position.set(Math.cos(p.userData.a) * r, Math.sin(p.userData.a * 2) * r * .15, Math.sin(p.userData.a) * r));
}
function makePart(id, v, c) {
  switch (id) {
    case 'head': return makeHead(v, c);
    case 'body': return makeBody(v, c);
    case 'armL': return makeArm(v, c, -1);
    case 'armR': return makeArm(v, c, 1);
    case 'legs': return makeLegs(v, c);
    case 'hat': return makeHat(v, c);
    case 'jetpack': return makeJetpack(v, c);
    case 'wings': return makeWings(v, c);
    case 'screen': return makeScreen(v, c);
    case 'halo': return makeHalo(v, c);
    case 'drone': return makeDrone(v, c);
    default: return makeOrbit(v, c);
  }
}

function buildPedestals() {

  const ids = S.level.parts, n = ids.length;
  const R = n <= 5 ? 4.6 : 5.6, span = (n <= 5 ? 140 : 200) * Math.PI / 180;
  const size = n <= 7 ? 1.4 : 1.15;
  ids.forEach((id, i) => {

    const x = Math.sin(a) * R, z = Math.cos(a) * R + .3;
    box(pedGroup, size, .7, size, '#f2e6d0', x, .35, z);
    box(pedGroup, size + .1, .12, size + .1, '#e3793a', x, .72, z);

    l.position.set(x + Math.sin(a) * .9, 1.1, z + Math.cos(a) * .9); pedGroup.add(l);

function place(id) {
  if (S.placed.has(id) || S.flights.some(f => f.id === id)) return;
  const p = S.parts[id];
  // fly from the pedestal (world space) to the slot on the robot
  const from = p.getWorldPosition(new THREE.Vector3());
  const to = robot.localToWorld(slotPos(id));
  S.flights.push({ id, p, from, to, t: 0, s0: p.scale.x });
  document.querySelector(`.part-btn[data-id="${id}"]`).disabled = true;
  kit.tones([392, 523], .06, 'triangle', .14);

function attached(f) {

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

let press = null, cheerT = 0;

    if (!S.placed.has(id)) place(id);

// More parts → the camera steps back a little so every pedestal fits
const portrait = innerWidth < innerHeight;
function frameCamera() {
  const k = { noob: 0, pro: 1, hacker: 1.6, god: 2.4 }[S.level.id];
  // the target sits below the robot so the scene shows above the button dock
  const pos = portrait ? new THREE.Vector3(0, 15 + k * 1.2, 30 + k * 2.4) : new THREE.Vector3(1.5, 11 + k, 25 + k * 2);
  kit.flyTo(stage, pos, new THREE.Vector3(0, portrait ? -.2 : 1.6, 1), 1200);

stage.start((dt, time) => {
  // parts flying to the robot (or popping after a restyle)
  for (let i = S.flights.length - 1; i >= 0; i--) {
    const f = S.flights[i];
    if (f.pop) {
      f.t = Math.min(1, f.t + dt * 3);
      f.p.scale.setScalar(.6 + .4 * f.t + Math.sin(f.t * Math.PI) * .25);
      if (f.t >= 1) S.flights.splice(i, 1);
      continue;
    }
    f.t = Math.min(1, f.t + dt * 1.4);
    const e = 1 - Math.pow(1 - f.t, 3);
    f.to.copy(robot.localToWorld(slotPos(f.id)));   // the turntable may be turning
    f.p.position.lerpVectors(f.from, f.to, e);
    f.p.position.y += Math.sin(f.t * Math.PI) * 2.5;
    f.p.scale.setScalar(f.s0 + (1 - f.s0) * e);
    f.p.rotation.y = (1 - e) * Math.PI * 2;
    if (f.t >= 1) { S.flights.splice(i, 1); attached(f); }
  }
  // parts waiting on pedestals bob and turn
  S.level.parts.forEach((id, i) => {
    const p = S.parts[id];
    if (p && p.parent === scene && !S.flights.some(f => f.p === p)) {
      p.position.y = pedestals[id].y + (id === 'orbit' || id === 'halo' || id === 'drone' ? .5 : 0) + Math.sin(time * 2 + i) * .12;
      p.rotation.y = time * .8 + i;
    }
  });
  ghostMat.opacity = .2 + Math.sin(time * 3) * .12;
  // the extra parts are always a little alive: spinning, hovering, orbiting
  const P = S.parts, speed = S.awake ? 2.5 : 1;
  if (P.hat && P.hat.userData.spin) P.hat.userData.spin.rotation.y += dt * 8 * speed;
  if (P.halo) P.halo.rotation.y += dt * .8 * speed;
  if (P.drone) { P.drone.userData.rotors.forEach(r => { r.rotation.y += dt * 25; }); if (S.placed.has('drone')) P.drone.position.y = PARTS.drone.at[1] + Math.sin(time * 2) * .2; }
  if (P.orbit) P.orbit.userData.ring.rotation.y += dt * .6 * speed;
  if (P.screen && S.placed.has('screen')) P.screen.position.y = PARTS.screen.at[1] + Math.sin(time * 1.6 + 1) * .12;
  if (P.wings) P.wings.userData.sides.forEach(({ w, side }) => { w.rotation.y = side * (S.awake ? Math.sin(time * 8) * .5 : Math.sin(time * 1.5) * .08); });
  if (P.jetpack && P.jetpack.userData.flame.visible) P.jetpack.userData.flame.scale.y = .8 + Math.random() * .5;
  // awake robot: turn, bounce, wave, spin gears and wheels (a jetpack lifts it off the turntable)
  if (S.awake) {
    S.danceT += dt;
    turntable.rotation.y += dt * .5;
    const lift = S.placed.has('jetpack') ? .8 + Math.sin(S.danceT * 2) * .3 : 0;
    robot.position.y = .32 + lift + Math.abs(Math.sin(S.danceT * 4)) * .25;
    P.armL.rotation.z = -.4 - Math.abs(Math.sin(S.danceT * 4)) * .9;
    P.armR.rotation.z = .4 + Math.abs(Math.sin(S.danceT * 4 + 1)) * 1.4;
    P.head.rotation.z = Math.sin(S.danceT * 4) * .12;
    if (P.hat) P.hat.rotation.z = P.head.rotation.z;
    P.body.userData.gear.rotation.x += dt * 4;
    (P.legs.userData.wheels || []).forEach(w => { w.rotation.x += dt * 6; });
    eyeMat.color.setHSL(.5, 1, .55 + Math.sin(time * 6) * .15);
  }
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 || S.awake ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});

// test hooks
window.__robot = { S, place, restyle, setTapMode, newRobot, pickLevel: id => levelsEl.querySelector(`[data-id="${id}"]`).click() };
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
