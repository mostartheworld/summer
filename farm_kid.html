<style>
  /* Question card under the title */
  .qbox {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 5;
    width: min(620px, calc(100vw - 24px)); background: #fff; border-radius: 22px; padding: 10px 18px 12px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08); text-align: center; display: none;
  }
  .qbox.show { display: block; }
  .qbox .prog { font-size: 14px; font-weight: 800; color: var(--orange-dark); }
  .qbox .q { font-size: 22px; font-weight: 900; line-height: 1.35; color: var(--ink); }
  .qbox .en { font-size: 14px; font-weight: 600; color: var(--muted); }
  .w-caption { top: auto; bottom: 330px; }
  /* Station picker (home view) */
  .cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #fff; border-radius: 26px; padding: 8px; box-shadow: 0 8px 0 #eee7da, 0 16px 0 #d8cfbf; }
  .cats button {
    min-height: 84px; border: none; border-radius: 20px; background: #fff8ec; cursor: pointer; padding: 6px 2px;
    font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .cats button:active { transform: translateY(3px); }
  .cats .em { font-size: 30px; line-height: 1; }
  .cats .nm { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.15; }
  .cats .st { font-size: 11px; letter-spacing: -1px; }
  /* Answers */
  #choices { flex-direction: column; align-items: stretch; }
  .choice { justify-content: flex-start; gap: 12px; min-height: 64px; font-size: 20px; text-align: left; padding: 6px 18px; line-height: 1.25; }
  .choice .e { font-size: 32px; flex: none; }
  .choice.right { background: #22c55e; color: #fff; box-shadow: 0 6px 0 #15803d; }
  .choice.wrong { background: #ef4444; color: #fff; box-shadow: 0 6px 0 #b91c1c; }
  #quizDock, #nextBtn { display: none; }
  .stars-big { font-size: 46px; text-align: center; }
  .row2 { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .row2 .w-btn { margin: 14px 0 0 !important; display: inline-flex !important; }
  @media (max-width: 480px) {
    .cats { grid-template-columns: repeat(3, 1fr); }
    .qbox .q { font-size: 18px; }
    .choice { font-size: 17px; min-height: 58px; }
    .choice .e { font-size: 26px; }
  }
</style>
</head>

<script type="module">
/* =========================================================
   ฟาร์มฝึกคิด (Farm quiz) — 5 farm stations, one per topic
   Tap a station → Summer walks there → 5 questions.
   Every right answer grows a crop in the station's plot

   Best scores are saved in summerWorld.v1 → farm: [5 numbers or null].
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);

const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 6; controls.maxDistance = 40;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.35;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 20, spread: 12, y0: -2 });
const $ = id => document.getElementById(id);
const portrait = innerWidth < innerHeight;

const PRAISE = ['เก่งมาก! 🎉', 'ถูกต้องเลย! ⭐', 'ใช่เลย! 🌟', 'ดีมากเลย! 🎊', 'เยี่ยมมาก! 🏆', 'สุดยอด! 🥳'];
const SCORE_TBL = [
  ['ไม่เป็นไรนะ! 😊', 'ลองใหม่อีกครั้งได้เลย'], ['พยายามดีมาก! 💪', 'ฝึกอีกนิดนะ'], ['ผ่านได้แล้ว! 😄', 'ใกล้ถึงแล้ว!'],
  ['เก่งมาก! 🎉', 'แทบเต็มแล้วเลย!'], ['เก่งมากเลย! 🌟', 'เหลืออีกแค่ข้อเดียว!'], ['เยี่ยมที่สุดเลย! 🏆', 'คะแนนเต็ม 5/5 !!!'],
];
const best = (kit.loadSave().farm || [null, null, null, null, null]).slice(0, 5);
const captionEl = $('caption');
let captionTimer = null;
function caption(text, ms = 2600) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
}
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* =========================================================
   The farm: ground + 5 stations in a row
   ========================================================= */
box(scene, 26, .4, 22, '#8fd16a', 0, -.2, -1);
box(scene, 26, 1.2, 22, '#d39a5c', 0, -1, -1);
box(scene, 23, 1, 19, '#b87e47', 0, -2.1, -1);
box(scene, 17, .8, 14, '#9b6a3c', 0, -3, -1);
box(scene, 24, .06, 1.6, '#e8cf9a', 0, .03, 5.4, false);    // dirt paths in front of each row of stations
box(scene, 14, .06, 1.6, '#e8cf9a', 0, .03, -1.2, false);
box(scene, 1.6, .06, 6, '#e8cf9a', 0, .03, 2.1, false);
for (let i = 0; i < 30; i++) box(scene, .14, .14, .14, ['#ff8fbf', '#ffd166', '#ffffff', '#9ad7ff'][i % 4], -12 + (i * 3.7) % 24, .07, -11 + (i * 2.3) % 20, false);
// fence along the back
for (let x = -12; x <= 12; x += 1.6) box(scene, .18, 1, .18, '#c98a5a', x, .5, -10.6);
box(scene, 24.4, .14, .1, '#c98a5a', 0, .75, -10.6); box(scene, 24.4, .14, .1, '#c98a5a', 0, .4, -10.6);
// a few trees and a windmill for the farm feel
function tree(x, z, s = 1) {
  box(scene, .4 * s, 1.4 * s, .4 * s, '#8b5a3c', x, .7 * s, z);
  box(scene, 1.6 * s, 1.3 * s, 1.6 * s, '#3fa34d', x, 1.9 * s, z);
  box(scene, 1.1 * s, .8 * s, 1.1 * s, '#4cbc5b', x, 2.9 * s, z);
}
[[-11, -8.5], [11, -8.5], [-11.2, 7], [11, 7.2], [-8.5, -3.5], [8.5, -3.6]].forEach(([x, z], i) => tree(x, z, .8 + (i % 3) * .15));
const mill = new THREE.Group(); mill.position.set(0, 0, -9); scene.add(mill);
box(mill, 1.4, 5, 1.4, '#f2e6d0', 0, 2.5, 0); box(mill, 1.8, .6, 1.8, '#d9534f', 0, 5.2, 0);
const blades = new THREE.Group(); blades.position.set(0, 4.6, .85); mill.add(blades);
for (let i = 0; i < 4; i++) { const b = box(blades, .35, 2.6, .08, '#ffffff', 0, 1.3, 0); const p = new THREE.Group(); p.rotation.z = i * Math.PI / 2; p.add(b); blades.add(p); }

// station looks: roof colour + what grows in its plot
const LOOK = [
  { roof: '#22c55e', crop: 'sunflower' },   // 🔬 nature
  { roof: '#ef4444', crop: 'carrot' },      // 💪 body
  { roof: '#3b82f6', crop: 'cabbage' },     // 👨‍👩‍👧 home
  { roof: '#a855f7', crop: 'tulip' },       // 🎨 colours
  { roof: '#f59e0b', crop: 'pumpkin' },     // 🌍 around the farm
];
// 3 stations in front, 2 behind (gaps between the front barns so the back ones stay visible)
const POS = [[-6.6, 2.4], [0, 2.4], [6.6, 2.4], [-3.3, -4.2], [3.3, -4.2]];
const stations = CATS.map((cat, i) => {
  const g = new THREE.Group();
  g.position.set(POS[i][0], 0, POS[i][1]);
  scene.add(g);
  const L = LOOK[i];
  // little barn
  box(g, 3, 2, 2.2, '#fff4e0', 0, 1, -1.6);
  box(g, 3.3, .4, 2.5, L.roof, 0, 2.2, -1.6);
  box(g, 2.5, .4, 2.1, L.roof, 0, 2.6, -1.6);
  box(g, 1.6, .4, 1.7, L.roof, 0, 3, -1.6);
  box(g, .9, 1.3, .1, '#8b5a3c', 0, .65, -.47);
  const sign = kit.emojiSprite(cat.em, L.roof, 1.5); sign.position.set(0, 4.2, -1.4); g.add(sign);
  const name = kit.labelSprite(cat.name, portrait ? .62 : .5); name.position.set(0, 5.25, -1.4); g.add(name);
  // plot: 5 soil squares in front of the barn
  const plots = [];
  for (let k = 0; k < 5; k++) {
    const x = (k - 2) * .62;
    box(g, .56, .12, .9, '#7a4a2a', x, .06, 1.2);
    plots.push({ x, crop: null });
  }
  g.traverse(o => { o.userData.station = i; });
  return { g, plots, i };
});
let starSprites = [];
function refreshStars() {
  starSprites.forEach(s => s.parent.remove(s));
  starSprites = stations.map(st => {
    const b = best[st.i];
    const s = kit.labelSprite(b === null ? '✨ ใหม่' : '⭐'.repeat(b) + '☆'.repeat(5 - b), .42);
    s.position.set(0, 6, -1.4); st.g.add(s);
    return s;
  });
  // dock buttons mirror the signs
  const dock = $('homeDock'); dock.innerHTML = '';
  CATS.forEach((cat, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="em">${cat.em}</span><span class="nm">${cat.name}</span><span class="st">${best[i] === null ? '✨' : '⭐'.repeat(best[i]) + '☆'.repeat(5 - best[i])}</span>`;
    b.onclick = () => goStation(i);
    dock.appendChild(b);
  });
}

/* ── Crops (voxel) ── */
function makeCrop(kind, k, good) {
  const g = new THREE.Group();
  const green = '#3fa34d';
  if (!good) {   // little sprout for a wrong answer
    box(g, .08, .3, .08, green, 0, .15, 0); box(g, .22, .08, .1, '#57c85e', .07, .3, 0);
    return g;
  }
  if (kind === 'sunflower') {
    box(g, .1, 1.1, .1, green, 0, .55, 0); box(g, .3, .08, .12, green, .14, .5, 0);
    box(g, .5, .5, .1, '#fbbf24', 0, 1.2, .02); box(g, .22, .22, .12, '#7c4a1e', 0, 1.2, .04);
  } else if (kind === 'carrot') {
    box(g, .22, .3, .22, '#f97316', 0, .1, 0);
    [-.07, 0, .07].forEach(x => box(g, .06, .35, .06, green, x, .4, 0));
  } else if (kind === 'cabbage') {
    box(g, .42, .34, .42, '#86efac', 0, .2, 0); box(g, .28, .2, .28, '#4ade80', 0, .42, 0);
  } else if (kind === 'tulip') {
    box(g, .07, .7, .07, green, 0, .35, 0); box(g, .2, .1, .08, green, .08, .25, 0);
    box(g, .26, .3, .26, ['#ef4444', '#f472b6', '#facc15', '#a855f7', '#fb923c'][k], 0, .82, 0);
  } else {
    box(g, .46, .36, .46, '#f97316', 0, .2, 0); box(g, .08, .16, .08, '#65a30d', 0, .45, 0);
  }
  return g;
}
function grow(st, k, good) {
  const p = st.plots[k];
  if (p.crop) st.g.remove(p.crop);
  p.crop = makeCrop(LOOK[st.i].crop, k, good);
  p.crop.position.set(p.x, .12, 1.2);
  p.crop.scale.setScalar(.01); p.crop.userData.grow = 0;
  st.g.add(p.crop);
  growing.push(p.crop);
}
const growing = [];

const summer = kit.makeSummer();
summer.g.position.set(0, 0, 6.4);
scene.add(summer.g);
let walkTo = null, cheerT = 0;

/* =========================================================
   Camera views
   ========================================================= */
const HOME_POS = portrait ? new THREE.Vector3(0, 30, 33) : new THREE.Vector3(0, 15, 22);
const HOME_TGT = new THREE.Vector3(0, portrait ? -4 : -.5, -1);
function stationView(i) {
  const [x, z] = POS[i], back = z < 0;   // back-row stations: look down from higher, over the front barns
  return portrait
    ? [new THREE.Vector3(x - .5, back ? 14 : 9, z + (back ? 12 : 15)), new THREE.Vector3(x, -1.2, z)]
    : [new THREE.Vector3(x - .5, back ? 10 : 7, z + (back ? 9 : 11)), new THREE.Vector3(x, -2, z + 1)];   // aim low: the plot shows above the answer buttons
}

/* =========================================================
   Quiz flow
   ========================================================= */
let cur = -1, qs = [], qi = 0, score = 0, answered = false, qSprite = null;

function goStation(i) {
  cur = i;
  $('homeDock').style.display = 'none';
  walkTo = new THREE.Vector3(POS[i][0] + 2.3, 0, POS[i][1] + 1.4);   // beside the plot, not in front of it
  const [p, t] = stationView(i);
  kit.flyTo(stage, p, t, 1100);
  kit.speak(CATS[i].name);
  // a fresh plot for this round
  stations[i].plots.forEach(pl => { if (pl.crop) { stations[i].g.remove(pl.crop); pl.crop = null; } });
  qs = shuffle(CATS[i].qs).slice(0, 5); qi = 0; score = 0;
  setTimeout(showQ, 900);
}
function showQ() {
  const q = qs[qi];
  answered = false;
  $('prog').textContent = `${CATS[cur].em} ${CATS[cur].name} · ข้อ ${qi + 1} / 5`;
  $('qText').textContent = q.q; $('qEn').textContent = q.en || '';
  $('qbox').classList.add('show');
  $('quizDock').style.display = 'block';
  $('nextBtn').style.display = 'none';
  // picture over the plot (❓ when the picture would give the answer away)
  if (qSprite) qSprite.parent.remove(qSprite);
  qSprite = kit.emojiSprite(q.showImg ? q.img : '❓', LOOK[cur].roof, 1.4);
  qSprite.position.set(-2.2, 1.9, 1.4); stations[cur].g.add(qSprite);
  const row = $('choices'); row.innerHTML = '';
  shuffle(q.ch).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'w-btn white choice';
    b.innerHTML = `<span class="e">${ch.em}</span><span>${ch.l}</span>`;
    b._ok = ch.ok;
    b.onclick = () => pick(b, ch.ok);
    row.appendChild(b);
  });
  kit.speak(q.q);
}
function pick(btn, ok) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('#choices .choice').forEach(b => { b.disabled = true; if (b._ok) b.classList.add('right'); });
  grow(stations[cur], qi, ok);
  if (ok) {
    score++;
    caption(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    kit.tones([523, 659, 784], .07); cheerT = 1.4;
    const w = stations[cur].g.localToWorld(new THREE.Vector3(stations[cur].plots[qi].x, 1, 1.2));
    fx.burst(w.x, w.y, w.z, ['#fbbf24', '#22c55e', '#f472b6'], 16);
  } else {
    btn.classList.add('wrong');
    const right = qs[qi].ch.find(c => c.ok);
    caption(`คำตอบคือ "${right.l}" 💚`, 3200);
    kit.tones([330, 262], .1, 'sine', .14);
  }
  if (qs[qi].showImg !== true && qSprite) {   // reveal the real picture now
    qSprite.parent.remove(qSprite);
    qSprite = kit.emojiSprite(qs[qi].img, LOOK[cur].roof, 1.4);
    qSprite.position.set(-2.2, 1.9, 1.4); stations[cur].g.add(qSprite);
  }
  const nb = $('nextBtn');
  nb.textContent = qi === 4 ? '🎉 ดูคะแนน!' : 'ข้อต่อไป ▶';
  nb.style.display = 'inline-flex';
}

  if (qi === 4) { finish(); return; }
  qi++; showQ();
}

  best[cur] = Math.max(best[cur] ?? 0, score);

  $('result').classList.add('show');
  kit.speak(`ได้ ${score} คะแนน จาก 5 ข้อ`);
  if (score >= 4) { const p = stations[cur].g.position; fx.burst(p.x, 4, p.z); kit.cheer(); cheerT = 3; }
  refreshStars();
}
function goHome() {
  cur = -1;
  $('result').classList.remove('show');

}
$('nextBtn').onclick = next;

/* =========================================================
   Taps + loop
   ========================================================= */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); return; }
  if (cur >= 0) return;   // during a quiz, stations don't react to taps
  const hit = raycaster.intersectObjects(stations.map(s => s.g), true)[0];
  if (hit) goStation(hit.object.userData.station);
});

camera.position.set(0, 18, 30); controls.target.copy(HOME_TGT);
stage.start((dt, time) => {
  if (walkTo) {
    const d = walkTo.clone().sub(summer.g.position); d.y = 0;
    if (d.length() > .05) {
      summer.g.rotation.y = Math.atan2(d.x, d.z);
      summer.g.position.add(d.clampLength(0, dt * 7));
    } else { walkTo = null; summer.g.rotation.y = -.4; }
  }
  cheerT -= dt;
  kit.poseSummer(summer, time, walkTo ? 'walk' : cheerT > 0 ? 'cheer' : 'idle');
  for (let i = growing.length - 1; i >= 0; i--) {
    const c = growing[i]; c.userData.grow = Math.min(1, c.userData.grow + dt * 2);
    const g = c.userData.grow; c.scale.setScalar(.01 + g * (1 + Math.sin(g * Math.PI) * .35));
    if (g >= 1) growing.splice(i, 1);
  }
  if (qSprite) qSprite.position.y = 1.9 + Math.sin(time * 2.5) * .1;
  blades.rotation.z += dt * .8;
  floaters.update(dt, time);
  fx.update(dt);
});

// sign text is drawn into textures, so wait for the Thai font first
document.fonts.load('700 56px "Noto Sans Thai"').catch(() => {}).finally(() => {
  refreshStars();
  goHome();
  window.__worldReady = true;
  document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
});
window.__farm = { goStation, pick: i => document.querySelectorAll('#choices .choice')[i].click(), okIndex: () => [...document.querySelectorAll('#choices .choice')].findIndex(b => b._ok) };
</script>
