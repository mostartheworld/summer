    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;

<script type="module">
/* =========================================================
   สระ (Thai vowels) — a word workshop on the island
   A consonant block and a vowel block stand on the platform.
   "ต่อคำ!" sends the vowel to where it is really written
   (after → right, before → left, above → on top, below → underneath),
   then the two blocks merge into one word block and Summer reads it.
   Game mode: 10 questions, pick the word the two blocks make.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 32;
controls.minPolarAngle = .5; controls.maxPolarAngle = 1.4;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 14, spread: 10, y0: -2 });

/* ── Vowels and words ──
   where = where the vowel is written next to the consonant (the block flies there)
   read  = how Summer spells it out loud */
const VOWELS = [
  { id: 'aa', label: 'อา', name: 'สระอา', mark: 'า', where: 'right',
    tip: 'สระอา ออกเสียง "อา" ยาว ๆ เขียนไว้ข้างหลังพยัญชนะ',
    items: [['ก','กา','กอ อา กา'], ['ม','มา','มอ อา มา'], ['ต','ตา','ตอ อา ตา'], ['ป','ปา','ปอ อา ปา'], ['น','นา','นอ อา นา'], ['ร','รา','รอ อา รา'], ['ล','ลา','ลอ อา ลา']] },
  { id: 'i', label: 'อิ', name: 'สระอิ', mark: 'ิ', where: 'top',
    tip: 'สระอิ ออกเสียง "อิ" สั้น ๆ เขียนไว้ข้างบนพยัญชนะ',
    items: [['ก','กิ','กอ อิ กิ'], ['ม','มิ','มอ อิ มิ'], ['ต','ติ','ตอ อิ ติ'], ['ป','ปิ','ปอ อิ ปิ'], ['น','นิ','นอ อิ นิ'], ['ล','ลิ','ลอ อิ ลิ']] },
  { id: 'ii', label: 'อี', name: 'สระอี', mark: 'ี', where: 'top',
    tip: 'สระอี ออกเสียง "อี" ยาวกว่าอิ เขียนไว้ข้างบนพยัญชนะ',
    items: [['ก','กี','กอ อี กี'], ['ม','มี','มอ อี มี'], ['ต','ตี','ตอ อี ตี'], ['ป','ปี','ปอ อี ปี'], ['น','นี','นอ อี นี'], ['ล','ลี','ลอ อี ลี']] },
  { id: 'u', label: 'อุ', name: 'สระอุ', mark: 'ุ', where: 'bottom',
    tip: 'สระอุ ออกเสียง "อุ" สั้น ๆ เขียนไว้ข้างล่างพยัญชนะ',
    items: [['ก','กุ','กอ อุ กุ'], ['ม','มุ','มอ อุ มุ'], ['ต','ตุ','ตอ อุ ตุ'], ['ป','ปุ','ปอ อุ ปุ'], ['น','นุ','นอ อุ นุ'], ['ล','ลุ','ลอ อุ ลุ']] },
  { id: 'uu', label: 'อู', name: 'สระอู', mark: 'ู', where: 'bottom',
    tip: 'สระอู ออกเสียง "อู" ยาวกว่าอุ เขียนไว้ข้างล่างพยัญชนะ',
    items: [['ด','ดู','ดอ อู ดู'], ['ม','มู','มอ อู มู'], ['ต','ตู','ตอ อู ตู'], ['ป','ปู','ปอ อู ปู'], ['น','นู','นอ อู นู'], ['ล','ลู','ลอ อู ลู']] },
  { id: 'e', label: 'เอ', name: 'สระเอ', mark: 'เ', where: 'left',
    tip: 'สระเอ ออกเสียง "เอ" เขียนไว้ข้างหน้าพยัญชนะ',
    items: [['ก','เก','กอ เอ เก'], ['ม','เม','มอ เอ เม'], ['ต','เต','ตอ เอ เต'], ['ป','เป','ปอ เอ เป'], ['น','เน','นอ เอ เน'], ['ล','เล','ลอ เอ เล']] },
  { id: 'ae', label: 'แอ', name: 'สระแอ', mark: 'แ', where: 'left',
    tip: 'สระแอ ออกเสียง "แอ" เขียนไว้ข้างหน้าพยัญชนะ',
    items: [['ก','แก','กอ แอ แก'], ['ม','แม','มอ แอ แม'], ['ต','แต','ตอ แอ แต'], ['พ','แพ','พอ แอ แพ'], ['น','แน','นอ แอ แน'], ['ล','แล','ลอ แอ แล']] },
  { id: 'o', label: 'โอ', name: 'สระโอ', mark: 'โ', where: 'left',
    tip: 'สระโอ ออกเสียง "โอ" เขียนไว้ข้างหน้าพยัญชนะ',
    items: [['ก','โก','กอ โอ โก'], ['ม','โม','มอ โอ โม'], ['ต','โต','ตอ โอ โต'], ['ป','โป','ปอ โอ โป'], ['น','โน','นอ โอ โน'], ['ล','โล','ลอ โอ โล']] },
  { id: 'ai', label: 'ไอ', name: 'สระไอ', mark: 'ไ', where: 'left',
    tip: 'สระไอ ออกเสียง "ไอ" เขียนไว้ข้างหน้าพยัญชนะ',
    items: [['ป','ไป','ปอ ไอ ไป'], ['อ','ไอ','ออ ไอ ไอ'], ['ม','ไม','มอ ไอ ไม'], ['ต','ไต','ตอ ไอ ไต']] },
].map(v => ({ ...v, items: v.items.map(([c, word, read]) => ({ c, word, read })) }));
// marks that sit on top/underneath are shown on a dotted circle, the way books print them
const markText = v => (v.where === 'top' || v.where === 'bottom') ? '◌' + v.mark : v.mark;

// Spelling is read slower than normal speech
function spell(text) {
  if (!kit.soundOn() || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH'; u.rate = .7; u.pitch = 1.15;
  speechSynthesis.speak(u);
}
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, ms = 5000) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
}

/* =========================================================
   Letter blocks — a cube with the letter on its front
   ========================================================= */
function letterTexture(text, bg, fg, wide) {
  const c = document.createElement('canvas'); c.width = wide ? 512 : 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, c.width, 18);   // light top edge
  let size = 190;
  g.font = `900 ${size}px "Noto Sans Thai Looped", "Noto Sans Thai", sans-serif`;
  while (g.measureText(text).width > c.width - 40 && size > 60) { size -= 10; g.font = `900 ${size}px "Noto Sans Thai Looped", "Noto Sans Thai", sans-serif`; }
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height / 2 + 6);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function letterBlock(text, color, w = 2, h = 2) {
  const side = new THREE.MeshLambertMaterial({ color });
  const face = new THREE.MeshBasicMaterial({ map: letterTexture(text, color, '#ffffff', w > h * 1.3) });
  // face order: +x, -x, +y, -y, +z (front), -z
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w > h ? 1.6 : w), [side, side, side, side, face, side]);
  m.castShadow = true;
  const g = new THREE.Group(); g.add(m);
  return g;
}

/* =========================================================
   The workshop
   ========================================================= */
box(scene, 16, .4, 11, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 11, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 9, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
for (let i = 0; i < 14; i++) box(scene, .14, .14, .14, ['#ff8fbf', '#ffd166', '#ffffff', '#9ad7ff'][i % 4], -7 + (i * 2.9) % 14, .07, -4.6 + (i * 1.7) % 9.2, false);
// platform where the blocks stand
box(scene, 9, .3, 3.6, '#f2e6d0', 0, .15, .6);
box(scene, 9.4, .14, 4, '#c98a5a', 0, .05, .6);
// "+" sign between the blocks (hidden once they join)
const plus = kit.labelSprite('+', .9, { fg: '#f59e0b' }); plus.position.set(0, 1.9, 1.2); scene.add(plus);

// Shelf of example words at the back (tap one to practise it)
const SHELF = { z: -3.6, y: 1.25, w: 11 };
box(scene, SHELF.w, .2, 1, '#c98a5a', 0, SHELF.y - .1, SHELF.z);
box(scene, .25, 2.4, .8, '#8b5a3c', -SHELF.w / 2 + .1, 1.2, SHELF.z);
box(scene, .25, 2.4, .8, '#8b5a3c', SHELF.w / 2 - .1, 1.2, SHELF.z);
const shelfSign = kit.labelSprite('ตัวอย่างคำ', .5); shelfSign.position.set(0, 3.3, SHELF.z); scene.add(shelfSign);
let shelfBlocks = [];

const summer = kit.makeSummer();
summer.g.position.set(5.2, .3, 1.6); summer.g.rotation.y = -.7;
scene.add(summer.g);

/* =========================================================
   One question = consonant block + vowel block (+ word block when joined)
   ========================================================= */
const CON_COLOR = '#3b82f6', VOW_COLOR = '#ec4899', WORD_COLOR = '#22c55e';
const BLOCK_Y = 1.3, GAP = 3;
let vowel = VOWELS[0], item = vowel.items[0];
let conB = null, vowB = null, wordB = null, join = null, wordPop = 0, cheerT = 0;

function clearBlocks() {
  [conB, vowB, wordB].forEach(b => b && scene.remove(b));
  conB = vowB = wordB = null; join = null;
}
function showQuestion(it) {
  clearBlocks();
  item = it;
  conB = letterBlock(it.c, CON_COLOR);
  vowB = letterBlock(markText(vowel), VOW_COLOR, 1.7, 1.7);
  // left-to-right like the written sum: before-vowels come first (เ + ก), others after (ก + า)
  const vowelFirst = vowel.where === 'left';
  conB.position.set(vowelFirst ? GAP / 2 : -GAP / 2, BLOCK_Y, .8);
  vowB.position.set(vowelFirst ? -GAP / 2 : GAP / 2, BLOCK_Y - .15, .8);
  conB.userData.tap = () => spell(it.c + 'อ');            // "กอ"
  vowB.userData.tap = () => spell(vowel.name);           // "สระอา"
  [conB, vowB].forEach(b => { b.scale.setScalar(.01); b.userData.grow = 0; scene.add(b); });
  plus.visible = true;
  document.getElementById('eA').textContent = vowelFirst ? vowel.mark : it.c;
  document.getElementById('eB').textContent = vowelFirst ? it.c : markText(vowel);
  document.getElementById('eA').className = vowelFirst ? 'v' : '';
  document.getElementById('eB').className = vowelFirst ? '' : 'v';
  const ans = document.getElementById('ans'); ans.textContent = '?'; ans.className = '';
  highlightShelf();
}

// ต่อคำ: the vowel flies to its real place, then both blocks become one word block
const SPOT = { right: [1.85, 0], left: [-1.85, 0], top: [0, 1.85], bottom: [0, -1.85] };
function joinBlocks(say = true) {
  if (!conB || join || wordB) return;
  const [dx, dy] = SPOT[vowel.where];
  // for "underneath" vowels the consonant hops up so the vowel can slide in below
  const conTo = new THREE.Vector3(0, BLOCK_Y + (vowel.where === 'bottom' ? 1.9 : 0), .8);
  join = {
    t: 0, say,
    con: { from: conB.position.clone(), to: conTo },
    vow: { from: vowB.position.clone(), mid: conTo.clone().add(new THREE.Vector3(dx * 1.6, dy * 1.6 + (dy ? 0 : 1.6), 0)), to: conTo.clone().add(new THREE.Vector3(dx, dy, 0)) },
  };
  plus.visible = false;
  kit.tones([392, 523], .08, 'triangle', .14);
}
function finishJoin() {
  const it = item, s = join.say;
  join = null;
  scene.remove(conB); scene.remove(vowB);
  wordB = letterBlock(it.word, WORD_COLOR, 3.6, 2.2);
  wordB.position.set(0, 1.4, .8);
  wordB.userData.tap = () => spell(it.read);
  wordB.scale.setScalar(.01); wordPop = 0;
  scene.add(wordB);
  fx.burst(0, 2.6, .8, ['#22c55e', '#ec4899', '#3b82f6', '#fbbf24'], 30);
  const ans = document.getElementById('ans'); ans.textContent = it.word; ans.className = 'ok';
  if (s) spell(it.read);
  cheerT = 1.6;
}

function highlightShelf() {
  shelfBlocks.forEach(b => b.children[0].position.y = b.userData.item === item ? .25 : 0);
}
function buildShelf() {
  shelfBlocks.forEach(b => scene.remove(b));
  const n = vowel.items.length, step = Math.min(1.5, (SHELF.w - 1.4) / n);
  shelfBlocks = vowel.items.map((it, i) => {
    const b = letterBlock(it.word, '#a78bfa', 1.3, .9);
    b.position.set((i - (n - 1) / 2) * step, SHELF.y + .45, SHELF.z);
    b.userData.item = it;
    b.userData.tap = () => { if (mode === 'practice') { showQuestion(it); setTimeout(() => joinBlocks(), 450); } else spell(it.word); };
    scene.add(b);
    return b;
  });
}

/* =========================================================
   Modes
   ========================================================= */
let mode = 'practice', gScore = 0, gNum = 0, gAnswered = false;
const $ = id => document.getElementById(id);
const pickRandom = () => {
  const pool = vowel.items.filter(x => x !== item);
  return pool[Math.floor(Math.random() * pool.length)] || vowel.items[0];
};

function setVowel(v) {
  vowel = v;
  $('vowelNow').textContent = v.label;
  buildShelf();
  if (mode === 'game') startGame(); else showQuestion(pickRandom());
  caption(v.tip, 6000);
  spell(v.name);
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.w-mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('practiceRow').style.display = m === 'practice' ? '' : 'none';
  $('gameRow').style.display = m === 'game' ? 'flex' : 'none';
  $('gameInfo').style.display = m === 'game' ? '' : 'none';
  $('nextBtn').style.display = 'none';
  if (m === 'game') startGame(); else showQuestion(pickRandom());
}

function startGame() { gScore = 0; gNum = 0; nextGameQ(); }
function nextGameQ() {
  gNum++; gAnswered = false;
  $('score').textContent = gScore; $('qnum').textContent = gNum;
  $('nextBtn').style.display = 'none';
  showQuestion(pickRandom());
  // 4 word choices from the same vowel (all look alike, so Summer must read the consonant)
  const others = vowel.items.filter(x => x !== item).sort(() => Math.random() - .5).slice(0, 3);
  const row = $('gameRow'); row.innerHTML = '';
  [item, ...others].sort(() => Math.random() - .5).forEach(it => {
    const b = document.createElement('button');
    b.className = 'w-btn white choice'; b.textContent = it.word;
    b.onclick = () => answer(it, b);
    row.appendChild(b);
  });
  caption('ก้อนนี้ต่อกันแล้วได้คำว่าอะไร? 🤔', 3500);
}
function answer(it, btn) {
  if (gAnswered) return;
  gAnswered = true;
  const ok = it === item;
  document.querySelectorAll('#gameRow .choice').forEach(b => {
    b.disabled = true;
    if (b.textContent === item.word) b.classList.add('right');
  });
  if (ok) { gScore++; $('score').textContent = gScore; caption('ถูกต้อง! เก่งมาก 👏', 3000); }
  else { btn.classList.add('wrong'); caption(`คำที่ถูกคือ "${item.word}" ดูก้อนต่อกันนะ`, 4000); kit.tones([300, 220], .1, 'sine', .14); }
  joinBlocks();
  if (gNum >= 10) setTimeout(finishGame, 2600);
  else $('nextBtn').style.display = 'inline-flex';
}
function finishGame() {
  $('rScore').textContent = `${gScore}/10`;
  $('rStars').textContent = gScore >= 9 ? '⭐⭐⭐' : gScore >= 6 ? '⭐⭐' : '⭐';
  $('result').classList.add('show');
  kit.speak(`จบเกม ได้ ${gScore} คะแนน จาก 10 ข้อ`);
  if (gScore >= 6) { fx.burst(0, 4, 0); kit.cheer(); cheerT = 3; }
}

// vowel picker
const vgrid = $('vgrid');
VOWELS.forEach(v => {
  const b = document.createElement('button');
  b.innerHTML = `${v.label}<small>${v.name}</small>`;
  b.onclick = () => { $('picker').classList.remove('show'); setVowel(v); };
  vgrid.appendChild(b);
});
$('vowelBtn').onclick = () => {
  vgrid.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', VOWELS[i] === vowel));
  $('picker').classList.add('show');
};
$('picker').addEventListener('click', e => { if (e.target.id === 'picker') $('picker').classList.remove('show'); });
$('joinBtn').onclick = () => { if (wordB) spell(item.read); else joinBlocks(); };
$('newBtn').onclick = () => showQuestion(pickRandom());
$('nextBtn').onclick = nextGameQ;
$('retryBtn').onclick = () => { $('result').classList.remove('show'); startGame(); };
document.querySelectorAll('.w-mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));

/* =========================================================
   Taps on blocks, loop
   ========================================================= */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [conB, vowB, wordB, ...shelfBlocks].filter(Boolean);
  const hit = raycaster.intersectObjects(targets, true)[0];
  if (hit) {
    let o = hit.object; while (o && !o.userData.tap) o = o.parent;
    if (o) { o.userData.tap(); o.userData.bump = 1; }
    return;
  }
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); }
});

camera.position.set(0, 8, 16); controls.target.set(0, 2, 0);
const portrait = innerWidth < innerHeight;   // phones stand further back so the blocks + shelf fit
kit.flyTo(stage, portrait ? new THREE.Vector3(1, 9.5, 27) : new THREE.Vector3(1, 6.5, 17), new THREE.Vector3(0, portrait ? -.6 : .4, -.4), 1200);   // aim low so the blocks sit above the dock

const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
stage.start((dt, time) => {
  // new blocks pop in
  [conB, vowB].forEach(b => { if (b && b.userData.grow < 1) { b.userData.grow = Math.min(1, b.userData.grow + dt * 3); const g = b.userData.grow; b.scale.setScalar(.01 + g * (1 + Math.sin(g * Math.PI) * .25)); } });
  // joining: consonant moves to the middle, vowel arcs over to its spot
  if (join) {
    join.t = Math.min(1, join.t + dt * .9);
    const e = ease(join.t);
    conB.position.lerpVectors(join.con.from, join.con.to, e);
    const v = join.vow, a = Math.min(1, e * 2), b = Math.max(0, e * 2 - 1);
    if (e < .5) vowB.position.lerpVectors(v.from, v.mid, ease(a));
    else vowB.position.lerpVectors(v.mid, v.to, ease(b));
    if (join.t >= 1) finishJoin();
  }
  if (wordB && wordPop < 1) { wordPop = Math.min(1, wordPop + dt * 2.5); wordB.scale.setScalar(.01 + wordPop * (1 + Math.sin(wordPop * Math.PI) * .3)); }
  // tapped blocks give a little hop
  [conB, vowB, wordB, ...shelfBlocks].forEach(b => {
    if (b && b.userData.bump > 0) { b.userData.bump = Math.max(0, b.userData.bump - dt * 4); b.children[0].position.y = Math.sin(b.userData.bump * Math.PI) * .4 + (shelfBlocks.includes(b) && b.userData.item === item ? .25 : 0); }
  });
  plus.position.y = 1.9 + Math.sin(time * 3) * .08;
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});

// letters are drawn into textures, so wait for the looped Thai font (the style kids learn at school) first
document.fonts.load('900 100px "Noto Sans Thai Looped"').catch(() => {}).finally(() => {
  buildShelf();
  setMode('practice');
  setTimeout(() => caption('แตะ "ต่อคำ" ดูสระวิ่งไปต่อกับพยัญชนะ! 🧩'), 900);
  window.__worldReady = true;
  document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
});
// for automated tests
window.__sara = { joinBlocks, answer: w => { const b = [...document.querySelectorAll('#gameRow .choice')].find(x => x.textContent === w); b && b.click(); }, get item() { return item; }, setVowel: id => setVowel(VOWELS.find(v => v.id === id)) };
</script>
