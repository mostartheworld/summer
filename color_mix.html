<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 ผสมสี — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  /* Equation pill: 🔴 + 🔵 = 🟣 */
  .eq {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: #fff; border-radius: 999px; padding: 8px 16px; display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 900; color: #cbbda4; box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .eq .dot {
    width: 48px; height: 48px; border-radius: 50%; border: 3px dashed #e5d9c4;
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: #cbbda4; transition: all .3s;
  }
  .eq .dot.on { border: 3px solid rgba(0,0,0,.12); color: transparent; transform: scale(1.08); }
  .w-caption { top: 158px; }
  /* Paint buttons — each one is the colour itself */
  .paint {
    width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    background: var(--c); box-shadow: 0 6px 0 rgba(0,0,0,.22);
    font-family: inherit; font-size: 16px; font-weight: 800; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; line-height: 1.1;
  }
  .paint:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .paint.small { width: 62px; height: 62px; font-size: 13px; }
  #extras { display: none; }
  #extras.show { display: flex; }
  @media (max-width: 480px) { .paint { width: 68px; height: 68px; } .paint.small { width: 54px; height: 54px; } .eq .dot { width: 40px; height: 40px; } }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🎨 ผสมสี <span class="en">· COLOR MIXING</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="eq"><span class="dot" id="d1">?</span>+<span class="dot" id="d2">?</span>=<span class="dot" id="d3">?</span></div>
<div class="w-caption" id="caption"></div>
<div class="w-banner" id="banner">🌈 ค้นพบสีใหม่ครบแล้ว!</div>

<div class="w-dock">
  <div class="w-controls" id="extras"></div>
  <div class="w-controls" id="primaries">
    <button class="w-btn white" id="moreBtn" title="สีเพิ่ม More colors">➕ สีเพิ่ม</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🎨</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   ผสมสี (Color mixing) — a paint workshop on the island
   Tap 2 colours → paint drops into the pot → Summer stirs →
   the new colour splashes onto the easel and goes into a jar on the shelf.
   Tap a jar to use that colour again.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 30;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.4;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 18, radius: 14, spread: 10, y0: -2 });

// ── Colours ──
// th = Thai name (spoken), en = English label
const C = {
  red:    { th: 'แดง',     en: 'Red',    hex: '#FF2A2A' },
  blue:   { th: 'น้ำเงิน',  en: 'Blue',   hex: '#1A40FF' },
  yellow: { th: 'เหลือง',   en: 'Yellow', hex: '#F5C400' },
  orange: { th: 'ส้ม',      en: 'Orange', hex: '#FF8000' },
  green:  { th: 'เขียว',    en: 'Green',  hex: '#1AB84F' },
  purple: { th: 'ม่วง',     en: 'Purple', hex: '#8B2FCC' },
  pink:   { th: 'ชมพู',     en: 'Pink',   hex: '#FF5BA8' },
  teal:   { th: 'เขียวอมฟ้า', en: 'Teal',  hex: '#0FA7B5' },
  brown:  { th: 'น้ำตาล',   en: 'Brown',  hex: '#8B5A2B' },
};
const PRIMARY = ['red', 'blue', 'yellow'];
const EXTRA = ['orange', 'green', 'purple', 'pink', 'teal', 'brown'];
// The 3 "magic" mixes Summer should discover (primary + primary = secondary)
const MIXES = {
  'blue+red':    'purple',
  'red+yellow':  'orange',
  'blue+yellow': 'green',
};
const SECONDARY = new Set(Object.values(MIXES));

function mixOf(a, b) {
  const key = [a, b].sort().join('+');
  if (MIXES[key]) return { id: MIXES[key], ...C[MIXES[key]], magic: true };
  if (a === b) {   // same colour → a deeper shade
    return { id: a + '-deep', th: C[a].th + 'เข้ม', en: 'Deep ' + C[a].en, hex: kit.shade(C[a].hex, .72), same: true };
  }
  const hex = '#' + new THREE.Color(C[a].hex).lerp(new THREE.Color(C[b].hex), .5).getHexString();
  return { id: key, th: 'สีใหม่', en: 'New shade', hex };
}

// ── Caption (+ speech) ──
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 +=]/g, ' ').replace(/\+/g, ' บวก ').replace(/=/g, ' ได้ '));
}

/* =========================================================
   The workshop
   ========================================================= */
box(scene, 16, .4, 11, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 11, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 9, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
for (let i = 0; i < 14; i++) box(scene, .14, .14, .14, ['#ff8fbf', '#ffd166', '#ffffff', '#9ad7ff'][i % 4], -7 + (i * 2.9) % 14, .07, -4.6 + (i * 1.7) % 9.2, false);

// Cauldron (a stepped voxel pot) with the paint inside
const POT_Y = 1.7;
const pot = new THREE.Group();
scene.add(pot);
box(pot, 2.6, .4, 2.6, '#4b5160', 0, .5, 0);
[[0, 1.45], [0, -1.45], [1.45, 0], [-1.45, 0]].forEach(([x, z]) => box(pot, x ? .35 : 3.25, 1.5, z ? .35 : 3.25, '#5b6272', x, 1.25, z));
[[0, 1.62], [0, -1.62], [1.62, 0], [-1.62, 0]].forEach(([x, z]) => box(pot, x ? .2 : 3.6, .25, z ? .2 : 3.6, '#7b8394', x, 2.05, z));
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, z]) => box(pot, .35, .35, .35, '#3b404c', x * 1.1, .15, z * 1.1));
const liquidMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });
const liquid = new THREE.Mesh(new THREE.BoxGeometry(2.55, .2, 2.55), liquidMat);
liquid.position.y = .8; liquid.visible = false;
pot.add(liquid);
// stirring stick (spins around the pot centre)
const stirrer = new THREE.Group();
const stick = box(stirrer, .16, 2.6, .16, '#c98a5a', .6, 1.6, 0);
stick.rotation.z = -.35;
stirrer.position.y = .2;
pot.add(stirrer);
// colour dispenser arm above the pot
box(scene, .3, 6.4, .3, '#8b5a3c', -2.6, 3.2, -1.6);
box(scene, 3.2, .3, .3, '#8b5a3c', -1.15, 6.3, -1.6);
box(scene, .7, .7, .7, '#f2e6d0', 0, 6, -1.6);
box(scene, .3, .4, .3, '#9aa3b2', 0, 5.5, -1.2);

// Summer stands beside the pot
const summer = kit.makeSummer();
summer.g.position.set(-2.9, 0, 1.3); summer.g.rotation.y = .9;
scene.add(summer.g);

// Easel: every mix leaves a splat, so the painting grows
const EASEL = { x: 4.6, y: 3, z: -.4, w: 3.2, h: 2.6 };
const easel = new THREE.Group();
easel.position.set(EASEL.x, 0, EASEL.z); easel.rotation.y = -.45;
scene.add(easel);
[[-1.1, .25], [1.1, .25]].forEach(([x, z]) => { const l = box(easel, .18, 4.6, .18, '#8b5a3c', x, 2.2, z); l.rotation.x = -.12; });
box(easel, .18, 4.4, .18, '#8b5a3c', 0, 2.1, -.7).rotation.x = .3;
box(easel, EASEL.w + .3, EASEL.h + .3, .12, '#c98a5a', 0, EASEL.y, .32);
box(easel, EASEL.w, EASEL.h, .1, '#ffffff', 0, EASEL.y, .4);
box(easel, 3.2, .16, .4, '#8b5a3c', 0, 1.55, .5);

// Shelf of discovered colours (jars you can tap)
const SHELF = { x: -1, z: -3.8, rows: [1.1, 2.5], perRow: 6 };
box(scene, .25, 3.3, .6, '#8b5a3c', SHELF.x - 4.2, 1.65, SHELF.z);
box(scene, .25, 3.3, .6, '#8b5a3c', SHELF.x + 4.2, 1.65, SHELF.z);
SHELF.rows.forEach(y => box(scene, 8.6, .2, .8, '#c98a5a', SHELF.x, y - .1, SHELF.z));
const shelfSign = kit.labelSprite('สีที่ค้นพบ', .5); shelfSign.position.set(SHELF.x, 3.75, SHELF.z); scene.add(shelfSign);
const jars = [];
function addJar(res) {
  if (jars.some(j => j.res.id === res.id) || jars.length >= SHELF.rows.length * SHELF.perRow) return false;
  const i = jars.length, row = Math.floor(i / SHELF.perRow), col = i % SHELF.perRow;
  const g = new THREE.Group();
  box(g, .8, .9, .8, res.hex, 0, .45, 0);
  box(g, .86, .25, .86, '#ffffff', 0, .3, 0);
  box(g, .6, .2, .6, '#e5e7eb', 0, 1, 0);
  g.position.set(SHELF.x - 3.4 + col * 1.36, SHELF.rows[row], SHELF.z + .05);
  g.scale.setScalar(.01);
  g.traverse(m => { m.userData.jar = res; });
  scene.add(g);
  jars.push({ g, res, grow: 0 });
  // jars hold their colour so they can be reused in the next mix
  if (!C[res.id]) C[res.id] = { th: res.th, en: res.en, hex: res.hex };
  return true;
}

/* =========================================================
   Mixing
   ========================================================= */
const eqDots = ['d1', 'd2', 'd3'].map(id => document.getElementById(id));
function setDot(i, hex) {
  eqDots[i].classList.toggle('on', !!hex);
  eqDots[i].style.background = hex || '';
}
let picks = [], busy = false, stirT = 0, splats = 0;
const drops = [];
const liquidFrom = new THREE.Color(), liquidTo = new THREE.Color();

function pick(key) {
  if (busy) return;
  if (picks.length === 2) {   // previous mix finished → start fresh
    picks = []; liquid.visible = false; [0, 1, 2].forEach(i => setDot(i, null));
  }
  picks.push(key);
  busy = true;
  setDot(picks.length - 1, C[key].hex);
  kit.speak(C[key].th);
  // a blob of paint falls from the dispenser into the pot
  const m = new THREE.Mesh(new THREE.SphereGeometry(.32, 14, 10), new THREE.MeshLambertMaterial({ color: C[key].hex }));
  m.position.set(0, 5.2, -1.2);
  scene.add(m);
  drops.push({ m, vy: 0, key });
}

function dropLanded(d) {
  scene.remove(d.m);
  splash(0, POT_Y + .2, 0, d.key ? C[d.key].hex : '#fff', 8);
  kit.tones([520, 330], .06, 'sine', .14);
  if (picks.length === 1) {
    liquid.visible = true;
    liquidMat.color.set(C[d.key].hex);
    liquid.position.y = .85;
    busy = false;
    caption(`${C[d.key].th}! เลือกสีที่ 2 เลย 👇`, false);
  } else {
    stirT = 1.8;   // stir, then reveal (see the loop)
    liquid.position.y = 1.35;
    liquidFrom.set(C[picks[0]].hex); liquidTo.set(C[picks[1]].hex);
  }
}

function reveal() {
  const [a, b] = picks;
  const res = mixOf(a, b);
  liquidMat.color.set(res.hex);
  setDot(2, res.hex);
  // paint ball flies from the pot onto the easel
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.3, 14, 10), new THREE.MeshLambertMaterial({ color: res.hex }));
  ball.position.set(0, POT_Y + .4, 0);
  scene.add(ball);
  const target = easel.localToWorld(new THREE.Vector3((Math.random() - .5) * (EASEL.w - .8), EASEL.y + (Math.random() - .5) * (EASEL.h - .8), .46));
  flights.push({ m: ball, from: ball.position.clone(), to: target, t: 0, res });

  const isNew = addJar(res);
  if (res.magic) {
    caption(`${C[a].th} + ${C[b].th} = ${res.th}! เก่งมาก 🎉`, true, 6000);
    if (isNew) { fx.burst(0, 3.5, 0); kit.cheer(); cheerT = 2.5; }
    const found = jars.filter(j => SECONDARY.has(j.res.id)).length;
    if (isNew && found === SECONDARY.size) setTimeout(celebrateAll, 1500);
  } else if (res.same) {
    caption(`${C[a].th} + ${C[b].th} = ${res.th} ลองคู่อื่นนะ 😊`, true, 5500);
  } else {
    caption(`${C[a].th} + ${C[b].th} = ได้สีใหม่! ✨`, true, 5500);
    if (isNew) kit.tones([523, 659, 784], .08);
  }
  busy = false;
}

function celebrateAll() {
  const banner = document.getElementById('banner');
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 3500);
  [[-3, 4, 0], [0, 5, 0], [3, 4, 0]].forEach(([x, y, z], i) => setTimeout(() => fx.burst(x, y, z), i * 250));
  kit.cheer(); cheerT = 4;
  caption('ค้นพบครบ 3 สีแล้ว ส้ม เขียว ม่วง! 🌈', true, 6000);
}

// Little paint cubes that pop out of the pot or off the easel
const bits = [];
function splash(x, y, z, hex, n) {
  for (let i = 0; i < n; i++) {
    const m = box(scene, .14, .14, .14, hex, x, y, z, false);
    bits.push({ m, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 3, vz: (Math.random() - .5) * 4, life: .9 });
  }
}
const flights = [];
function splat(pos, hex) {
  // a blocky splat: one big square + a few small ones around it, flat on the canvas
  const local = easel.worldToLocal(pos.clone());
  const s = .5 + Math.random() * .3, z = .46 + (splats++) * .0015;   // each new splat sits a hair in front
  const add = (w, h, dx, dy) => box(easel, w, h, .02, hex, local.x + dx, local.y + dy, z, false);
  add(s, s, 0, 0);
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2, r = s * .6 + Math.random() * .2;
    add(s * .3, s * .3, Math.cos(a) * r, Math.sin(a) * r);
  }
}

/* =========================================================
   Buttons, taps, loop
   ========================================================= */
function paintButton(key, small) {
  const b = document.createElement('button');
  b.className = 'paint' + (small ? ' small' : '');
  b.style.setProperty('--c', C[key].hex);
  b.innerHTML = C[key].th;
  b.title = C[key].en;
  b.addEventListener('click', () => pick(key));
  return b;
}
const primaries = document.getElementById('primaries'), extras = document.getElementById('extras');
const moreBtn = document.getElementById('moreBtn');
PRIMARY.forEach(k => primaries.insertBefore(paintButton(k), moreBtn));
EXTRA.forEach(k => extras.appendChild(paintButton(k, true)));
moreBtn.onclick = () => {
  const on = extras.classList.toggle('show');
  moreBtn.textContent = on ? '➖ ซ่อน' : '➕ สีเพิ่ม';
};

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(jars.map(j => j.g), true)[0];
  if (hit) { pick(hit.object.userData.jar.id); return; }
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); }
});

camera.position.set(0, 8, 15); controls.target.set(0, 2, 0);
const portrait = innerWidth < innerHeight;   // phones need to stand further back to see pot + shelf + easel
kit.flyTo(stage, portrait ? new THREE.Vector3(2, 12, 22) : new THREE.Vector3(1, 7.5, 13.5), new THREE.Vector3(0, portrait ? 1.6 : 2.2, -.5), 1200);
setTimeout(() => caption('แตะสี 2 สี แล้วดูว่าได้สีอะไร! 🎨'), 700);

stage.start((dt, time) => {
  // falling paint drops
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy -= 14 * dt; d.m.position.y += d.vy * dt;
    if (d.m.position.y <= POT_Y + .1) { drops.splice(i, 1); dropLanded(d); }
  }
  // stirring
  if (stirT > 0) {
    stirT -= dt;
    stirrer.rotation.y += dt * 9;
    const k = (Math.sin(time * 14) + 1) / 2;   // swirl between the two colours
    liquidMat.color.copy(liquidFrom).lerp(liquidTo, k);
    if (Math.random() < .3) splash((Math.random() - .5) * 2, POT_Y + .3, (Math.random() - .5) * 2, '#ffffff', 1);
    if (stirT <= 0) reveal();
  } else stirrer.rotation.y += dt * .4;
  // paint balls flying to the easel
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i];
    f.t = Math.min(1, f.t + dt * 1.6);
    f.m.position.lerpVectors(f.from, f.to, f.t);
    f.m.position.y += Math.sin(f.t * Math.PI) * 2.2;
    if (f.t >= 1) {
      scene.remove(f.m); flights.splice(i, 1);
      splat(f.to, f.res.hex); splash(f.to.x, f.to.y, f.to.z, f.res.hex, 6);
      kit.tones([220], .05, 'square', .1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.vy -= 12 * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); bits.splice(i, 1); }
  }
  // new jars pop onto the shelf
  jars.forEach(j => { if (j.grow < 1) { j.grow = Math.min(1, j.grow + dt * 2.5); j.g.scale.setScalar(.01 + j.grow * (1 + Math.sin(j.grow * Math.PI) * .4)); } });
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  if (stirT > 0) summer.armR.rotation.x = Math.sin(time * 12) * .8;   // Summer stirs along
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
</script>
</body>
</html>
