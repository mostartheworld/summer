<script type="module">
/* =========================================================
   ผสมสี (Color mixing) — a paint workshop on the island
   Tap colours → paint drops into the pot → Summer stirs →
   the new colour splashes onto the easel and goes into a jar on the shelf.
   Tap a jar to use that colour again.
   4 modes:
     🎨 แม่สี     2 colours — discover orange, green, purple (the original game)
     ⚪ อ่อน/เข้ม  a colour + white = lighter, + black = darker
     🌈 หลายสี    2–4 drops, then stir (red+yellow+blue = brown, red+red+yellow = red-orange…)
     🎯 ทายสี     make the target colour with 2 drops
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 32;
controls.minPolarAngle = .4; controls.maxPolarAngle = 1.4;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 18, radius: 14, spread: 10, y0: -2 });

// ── Colours ──
// th = Thai name (spoken), en = English label. Every named colour can be the answer of a mix.
const C = {
  red:        { th: 'แดง',        en: 'Red',          hex: '#FF2A2A' },
  blue:       { th: 'น้ำเงิน',     en: 'Blue',         hex: '#1A40FF' },
  yellow:     { th: 'เหลือง',      en: 'Yellow',       hex: '#F5C400' },
  white:      { th: 'ขาว',        en: 'White',        hex: '#FFFFFF', light: true },
  black:      { th: 'ดำ',         en: 'Black',        hex: '#222222' },
  orange:     { th: 'ส้ม',         en: 'Orange',       hex: '#FF8000' },
  green:      { th: 'เขียว',       en: 'Green',        hex: '#1AB84F' },
  purple:     { th: 'ม่วง',        en: 'Purple',       hex: '#8B2FCC' },
  pink:       { th: 'ชมพู',        en: 'Pink',         hex: '#FF8DB4' },
  lightpink:  { th: 'ชมพูอ่อน',     en: 'Light pink',   hex: '#FFC4D6', light: true },
  teal:       { th: 'เขียวอมฟ้า',   en: 'Teal',         hex: '#0FA7B5' },
  brown:      { th: 'น้ำตาล',      en: 'Brown',        hex: '#8B5A2B' },
  // lighter (+ white)
  lightblue:  { th: 'ฟ้า',         en: 'Light blue',   hex: '#86C8FF', light: true },
  cream:      { th: 'ครีม',        en: 'Cream',        hex: '#FFEB9C', light: true },
  lightgreen: { th: 'เขียวอ่อน',    en: 'Light green',  hex: '#93E3A4', light: true },
  peach:      { th: 'ส้มอ่อน',      en: 'Peach',        hex: '#FFC08F', light: true },
  lavender:   { th: 'ม่วงอ่อน',     en: 'Lavender',     hex: '#C9A6F0', light: true },
  gray:       { th: 'เทา',         en: 'Gray',         hex: '#9A9A9A' },
  // darker (+ black)
  darkred:    { th: 'แดงเข้ม',      en: 'Dark red',     hex: '#8A1616' },
  navy:       { th: 'น้ำเงินเข้ม',   en: 'Navy',         hex: '#17236E' },
  olive:      { th: 'เขียวขี้ม้า',    en: 'Olive',        hex: '#7A7614' },
  darkgreen:  { th: 'เขียวเข้ม',     en: 'Dark green',   hex: '#105A2B' },
  darkpurple: { th: 'ม่วงเข้ม',      en: 'Dark purple',  hex: '#4A1670' },
  // in-between colours (3 drops: 2 of one + 1 of another)
  redorange:  { th: 'ส้มอมแดง',     en: 'Red-orange',   hex: '#FF5A1A' },
  amber:      { th: 'ส้มอมเหลือง',   en: 'Yellow-orange', hex: '#FFAA00' },
  lime:       { th: 'เขียวอมเหลือง',  en: 'Yellow-green', hex: '#A3CF2A' },
  indigo:     { th: 'ม่วงอมน้ำเงิน',  en: 'Blue-purple',  hex: '#4B30C8' },
  magenta:    { th: 'ม่วงอมแดง',     en: 'Red-purple',   hex: '#B5207A' },
};
// Mixes we know the answer to (keys sorted alphabetically). Everything else is worked out from its recipe (see MAKE).
const KNOWN = {
  'blue+red': 'purple', 'red+yellow': 'orange', 'blue+yellow': 'green',
  'red+white': 'pink', 'blue+white': 'lightblue', 'white+yellow': 'cream', 'green+white': 'lightgreen',
  'orange+white': 'peach', 'purple+white': 'lavender', 'black+white': 'gray',
  'black+red': 'darkred', 'black+blue': 'navy', 'black+yellow': 'olive', 'black+green': 'darkgreen',
  'black+orange': 'brown', 'black+purple': 'darkpurple',
  'blue+red+yellow': 'brown',
  'red+red+yellow': 'redorange', 'red+yellow+yellow': 'amber', 'blue+yellow+yellow': 'lime',
  'blue+blue+yellow': 'teal', 'blue+blue+red': 'indigo', 'blue+red+red': 'magenta',
};
const SECONDARY = ['orange', 'green', 'purple'];   // the 3 "magic" colours of the first mode

// Every colour remembers what it is made of: parts of red/yellow/blue/white/black (adding up to 1).
// Mixing just averages those parts — so a jar of orange + white really is the same as red + yellow + white + white.
const MAKE = {
  red: { r: 1 }, yellow: { y: 1 }, blue: { b: 1 }, white: { w: 1 }, black: { k: 1 },
  orange: { r: .5, y: .5 }, green: { y: .5, b: .5 }, purple: { r: .5, b: .5 }, brown: { r: 1 / 3, y: 1 / 3, b: 1 / 3 },
  pink: { r: .5, w: .5 }, lightpink: { r: 1 / 3, w: 2 / 3 }, teal: { y: 1 / 3, b: 2 / 3 },
  lightblue: { b: .5, w: .5 }, cream: { y: .5, w: .5 }, lightgreen: { y: .25, b: .25, w: .5 }, peach: { r: .25, y: .25, w: .5 },
  lavender: { r: .25, b: .25, w: .5 }, gray: { w: .5, k: .5 },
  darkred: { r: .5, k: .5 }, navy: { b: .5, k: .5 }, olive: { y: .5, k: .5 }, darkgreen: { y: .25, b: .25, k: .5 }, darkpurple: { r: .25, b: .25, k: .5 },
  redorange: { r: 2 / 3, y: 1 / 3 }, amber: { r: 1 / 3, y: 2 / 3 }, lime: { y: 2 / 3, b: 1 / 3 }, indigo: { r: 1 / 3, b: 2 / 3 }, magenta: { r: 2 / 3, b: 1 / 3 },
};
const vec = o => ['r', 'y', 'b', 'w', 'k'].map(k => o[k] || 0);
Object.entries(MAKE).forEach(([id, o]) => { C[id].mix = vec(o); C[id].named = true; });

// Painters' colour wheel as a cube: the 8 corners are white, the 3 primaries, the 3 secondaries and brown.
// A colour's red/yellow/blue amounts pick a point inside the cube (trilinear blend of the corners).
const CORNER = {};
[['000', '#ffffff'], ['100', C.red.hex], ['010', C.yellow.hex], ['001', C.blue.hex], ['110', C.orange.hex],
 ['101', C.purple.hex], ['011', C.green.hex], ['111', C.brown.hex]].forEach(([k, h]) => { CORNER[k] = new THREE.Color(h); });
function hexOf(v) {
  const [r, y, b, w, k] = v, chroma = r + y + b, out = new THREE.Color(0, 0, 0);
  // equal parts of red + yellow + blue make brown, so that share is brown (opposite colours turn muddy, like real paint)
  const mud = Math.min(r, y, b) * 3;
  out.add(new THREE.Color(C.brown.hex).multiplyScalar(mud));
  if (chroma - mud > 1e-6) {
    const rest = [r, y, b].map(c => c - mud / 3), m = Math.max(...rest), x = rest.map(c => c / m);
    const hue = new THREE.Color(0, 0, 0);
    for (const key in CORNER) {
      const wt = [0, 1, 2].reduce((a, i) => a * (key[i] === '1' ? x[i] : 1 - x[i]), 1);
      hue.r += CORNER[key].r * wt; hue.g += CORNER[key].g * wt; hue.b += CORNER[key].b * wt;
    }
    out.add(hue.multiplyScalar(chroma - mud));
  }
  out.add(new THREE.Color(1, 1, 1).multiplyScalar(w)).add(new THREE.Color(C.black.hex).multiplyScalar(k));
  return '#' + out.getHexString();
}
// Nearest named colour (compared in Lab, which matches how eyes see differences)
function lab(hex) {
  const c = new THREE.Color(hex).convertSRGBToLinear();
  const f = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const x = f((c.r * .4124 + c.g * .3576 + c.b * .1805) / .9505), y = f(c.r * .2126 + c.g * .7152 + c.b * .0722), z = f((c.r * .0193 + c.g * .1192 + c.b * .9505) / 1.089);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
function nearest(hex) {
  const L = lab(hex);
  let best = null, bestD = 1e9;
  Object.keys(C).forEach(id => {
    if (!C[id].named) return;
    const M = lab(C[id].hex), d = Math.hypot(L[0] - M[0], L[1] - M[1], L[2] - M[2]);
    if (d < bestD) { bestD = d; best = id; }
  });
  return best;
}

function mixOf(keys) {
  const key = keys.slice().sort().join('+');
  if (KNOWN[key]) { const id = KNOWN[key]; return { id, ...C[id], magic: SECONDARY.includes(id) }; }
  if (keys.every(k => k === keys[0])) return { id: keys[0], ...C[keys[0]], same: true };   // red + red = still red
  const v = [0, 0, 0, 0, 0];
  keys.forEach(k => C[k].mix.forEach((x, i) => { v[i] += x / keys.length; }));
  // same recipe as a named colour? then it IS that colour
  const exact = Object.keys(C).find(id => C[id].named && C[id].mix.every((x, i) => Math.abs(x - v[i]) < .01));
  if (exact) return { id: exact, ...C[exact] };
  const hex = hexOf(v);
  return { id: 'mix' + hex, th: 'สีใหม่', en: 'New shade', hex, mix: v, like: C[nearest(hex)].th };
}

// ── Caption (+ speech) ──
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 +=]/g, ' ').replace(/\+/g, ' บวก ').replace(/=/g, ' ได้ '));
}

/* =========================================================
   The workshop
   ========================================================= */
box(scene, 16, .4, 11, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 11, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 9, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
for (let i = 0; i < 14; i++) box(scene, .14, .14, .14, ['#ff8fbf', '#ffd166', '#ffffff', '#9ad7ff'][i % 4], -7 + (i * 2.9) % 14, .07, -4.6 + (i * 1.7) % 9.2, false);

// Cauldron (a stepped voxel pot) with the paint inside
const POT_Y = 1.7;
const pot = new THREE.Group();
scene.add(pot);
box(pot, 2.6, .4, 2.6, '#4b5160', 0, .5, 0);
[[0, 1.45], [0, -1.45], [1.45, 0], [-1.45, 0]].forEach(([x, z]) => box(pot, x ? .35 : 3.25, 1.5, z ? .35 : 3.25, '#5b6272', x, 1.25, z));
[[0, 1.62], [0, -1.62], [1.62, 0], [-1.62, 0]].forEach(([x, z]) => box(pot, x ? .2 : 3.6, .25, z ? .2 : 3.6, '#7b8394', x, 2.05, z));
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, z]) => box(pot, .35, .35, .35, '#3b404c', x * 1.1, .15, z * 1.1));
const liquidMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });
const liquid = new THREE.Mesh(new THREE.BoxGeometry(2.55, .2, 2.55), liquidMat);
liquid.position.y = .8; liquid.visible = false;
pot.add(liquid);
// stirring stick (spins around the pot centre)
const stirrer = new THREE.Group();
const stick = box(stirrer, .16, 2.6, .16, '#c98a5a', .6, 1.6, 0);
stick.rotation.z = -.35;
stirrer.position.y = .2;
pot.add(stirrer);
// colour dispenser arm above the pot
box(scene, .3, 6.4, .3, '#8b5a3c', -2.6, 3.2, -1.6);
box(scene, 3.2, .3, .3, '#8b5a3c', -1.15, 6.3, -1.6);
box(scene, .7, .7, .7, '#f2e6d0', 0, 6, -1.6);
box(scene, .3, .4, .3, '#9aa3b2', 0, 5.5, -1.2);

// Summer stands beside the pot
const summer = kit.makeSummer();
summer.g.position.set(-2.9, 0, 1.3); summer.g.rotation.y = .9;
scene.add(summer.g);

// Easel: every mix leaves a splat, so the painting grows
const EASEL = { x: 4.6, y: 3, z: -.4, w: 3.2, h: 2.6 };
const easel = new THREE.Group();
easel.position.set(EASEL.x, 0, EASEL.z); easel.rotation.y = -.45;
scene.add(easel);
[[-1.1, .25], [1.1, .25]].forEach(([x, z]) => { const l = box(easel, .18, 4.6, .18, '#8b5a3c', x, 2.2, z); l.rotation.x = -.12; });
box(easel, .18, 4.4, .18, '#8b5a3c', 0, 2.1, -.7).rotation.x = .3;
box(easel, EASEL.w + .3, EASEL.h + .3, .12, '#c98a5a', 0, EASEL.y, .32);
box(easel, EASEL.w, EASEL.h, .1, '#ffffff', 0, EASEL.y, .4);
box(easel, 3.2, .16, .4, '#8b5a3c', 0, 1.55, .5);

// Shelf of discovered colours (jars you can tap) — 3 rows of 6
const SHELF = { x: -1, z: -3.8, rows: [1.1, 2.5, 3.9], perRow: 6 };
box(scene, .25, 4.7, .6, '#8b5a3c', SHELF.x - 4.2, 2.35, SHELF.z);
box(scene, .25, 4.7, .6, '#8b5a3c', SHELF.x + 4.2, 2.35, SHELF.z);
SHELF.rows.forEach(y => box(scene, 8.6, .2, .8, '#c98a5a', SHELF.x, y - .1, SHELF.z));
const shelfSign = kit.labelSprite('สีที่ค้นพบ', .5); shelfSign.position.set(SHELF.x, 5.15, SHELF.z); scene.add(shelfSign);
const jars = [];
function addJar(res) {
  if (jars.some(j => j.res.id === res.id) || jars.length >= SHELF.rows.length * SHELF.perRow) return false;
  const i = jars.length, row = Math.floor(i / SHELF.perRow), col = i % SHELF.perRow;
  const g = new THREE.Group();
  box(g, .8, .9, .8, res.hex, 0, .45, 0);
  box(g, .86, .25, .86, '#ffffff', 0, .3, 0);
  box(g, .6, .2, .6, '#e5e7eb', 0, 1, 0);
  g.position.set(SHELF.x - 3.4 + col * 1.36, SHELF.rows[row], SHELF.z + .05);
  g.scale.setScalar(.01);
  g.traverse(m => { m.userData.jar = res; });
  scene.add(g);
  jars.push({ g, res, grow: 0 });
  // jars hold their colour so they can be reused in the next mix
  if (!C[res.id]) C[res.id] = { th: res.th, en: res.en, hex: res.hex, mix: res.mix };
  return true;
}

/* =========================================================
   Modes
   ========================================================= */
const MODES = {
  primary: { em: '🎨', th: 'แม่สี',     need: 2, paints: ['red', 'blue', 'yellow'], more: ['orange', 'green', 'purple', 'pink', 'teal', 'brown'],
             hello: 'แตะสี 2 สี แล้วดูว่าได้สีอะไร! 🎨' },
  tint:    { em: '🌗', th: 'อ่อน/เข้ม',  need: 2, paints: ['red', 'yellow', 'blue', 'green', 'orange', 'purple'], small: true, extra: ['white', 'black'],
             hello: 'เลือกสี 1 สี แล้วใส่ขาวให้อ่อนลง หรือใส่ดำให้เข้มขึ้น ⚪⚫' },
  multi:   { em: '🌈', th: 'หลายสี',    need: 4, paints: ['red', 'yellow', 'blue', 'white', 'black'], stir: true,
             hello: 'ใส่สีได้ถึง 4 หยด แล้วกดคน! ลองแดง เหลือง น้ำเงิน รวมกันดูสิ 🌈' },
  quiz:    { em: '🎯', th: 'ทายสี',     need: 2, paints: ['red', 'yellow', 'blue', 'white', 'black'], quiz: true },
};
// Targets for 🎯 — every one can be made with 2 drops
const TARGETS = ['orange', 'green', 'purple', 'pink', 'lightblue', 'gray', 'darkred', 'navy', 'cream', 'olive'];
const RECIPE = {};
Object.entries(KNOWN).forEach(([k, id]) => { if (k.split('+').length === 2 && !RECIPE[id]) RECIPE[id] = k.split('+'); });

let mode = 'primary', picks = [], busy = false, done = false, stirT = 0, splats = 0;
let target = null, tries = 0, stars = 0;
const drops = [];

const eqEl = document.getElementById('eq');
// The equation shows one dot per drop (+ empty dots still to fill) and the result (or the 🎯 target)
function drawEq(res) {
  const M = MODES[mode];
  const slots = Math.max(M.stir ? Math.max(picks.length, 2) : M.need, picks.length);
  let html = '';
  for (let i = 0; i < slots; i++) {
    const k = picks[i];
    html += (i ? '+' : '') + `<span class="dot${k ? ' on' : ''}" style="${k ? 'background:' + C[k].hex : ''}">?</span>`;
  }
  if (res) html += `=<span class="dot on" style="background:${res.hex}">?</span>`;
  else if (target) html += `=<span class="dot target" style="background:${C[target].hex}">🎯</span>`;
  else html += '=<span class="dot">?</span>';
  if (M.quiz) html += `<span class="score">⭐${stars}</span>`;
  eqEl.innerHTML = html;
}

function newTarget() {
  let t;
  do t = TARGETS[Math.floor(Math.random() * TARGETS.length)]; while (t === target);
  target = t; tries = 0;
  caption(`ทำสี${C[t].th}ให้ได้! 🎯 ใช้ 2 สี`, true, 6000);
}

function resetPot() {
  picks = []; done = false; liquid.visible = false;
}

function setMode(m) {
  mode = m; resetPot(); target = null;
  document.querySelectorAll('.w-mode').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  buildDock();
  if (MODES[m].quiz) newTarget(); else caption(MODES[m].hello, true, 6000);
  drawEq();
}

function pick(key) {
  if (busy) return;
  const M = MODES[mode];
  if (done || picks.length >= M.need) resetPot();   // previous mix finished → start fresh
  picks.push(key);
  busy = true;
  drawEq();
  kit.speak(C[key].th);
  // a blob of paint falls from the dispenser into the pot
  const m = new THREE.Mesh(new THREE.SphereGeometry(.32, 14, 10), new THREE.MeshLambertMaterial({ color: C[key].hex }));
  m.position.set(0, 5.2, -1.2);
  scene.add(m);
  drops.push({ m, vy: 0, key });
  updateActions();
}

function dropLanded(d) {
  scene.remove(d.m);
  splash(0, POT_Y + .2, 0, C[d.key].hex, 8);
  kit.tones([520, 330], .06, 'sine', .14);
  const M = MODES[mode];
  liquid.visible = true;
  liquid.position.y = .85 + picks.length * .14;
  if (picks.length < M.need) {
    liquidMat.color.set(C[d.key].hex);   // the drops sit on top until we stir
    busy = false;
    if (M.stir) caption(picks.length < 2 ? 'ใส่อีกสีนะ 👇' : `ใส่แล้ว ${picks.length} หยด กดคนได้เลย หรือใส่เพิ่มอีก 🥄`, false, 3500);
    else caption(picks.length === 1 && mode === 'tint' && !['white', 'black'].includes(d.key) ? `${C[d.key].th}! ใส่ขาว ⚪ หรือ ดำ ⚫ ดีนะ?` : `${C[d.key].th}! เลือกสีที่ 2 เลย 👇`, false);
    updateActions();
  } else stir();
}

// Swirl through all the drops, then reveal
let swirl = [];
function stir() {
  if (picks.length < 2) return;
  busy = true; stirT = 1.8;
  swirl = picks.map(k => new THREE.Color(C[k].hex));
  updateActions();
}

function reveal() {
  const res = mixOf(picks);
  done = true;
  liquidMat.color.set(res.hex);
  drawEq(res);
  // paint ball flies from the pot onto the easel
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.3, 14, 10), new THREE.MeshLambertMaterial({ color: res.hex }));
  ball.position.set(0, POT_Y + .4, 0);
  scene.add(ball);
  const tgt = easel.localToWorld(new THREE.Vector3((Math.random() - .5) * (EASEL.w - .8), EASEL.y + (Math.random() - .5) * (EASEL.h - .8), .46));
  flights.push({ m: ball, from: ball.position.clone(), to: tgt, t: 0, res });

  const sum = picks.map(k => C[k].th).join(' + ');
  const name = res.like ? `สีใหม่! คล้ายสี${res.like}` : `${res.th}`;
  const isNew = res.same ? false : addJar(res);
  busy = false;
  updateActions();

  if (MODES[mode].quiz) {
    if (res.id === target) {
      stars++; drawEq(res);
      caption(`${sum} = ${name}! ถูกต้อง เก่งมาก ⭐`, true, 4500);
      fx.burst(0, 3.5, 0); kit.cheer(); cheerT = 2.5;
      setTimeout(() => { if (mode === 'quiz') { resetPot(); newTarget(); drawEq(); } }, 3600);
    } else {
      tries++;
      const hint = tries >= 2 && RECIPE[target] ? ` ลอง ${RECIPE[target].map(k => C[k].th).join(' + ')} นะ` : ' ลองใหม่นะ';
      caption(`${sum} = ${name} ยังไม่ใช่สี${C[target].th}${hint} 😊`, true, 6000);
    }
    return;
  }
  if (res.same) { caption(`${sum} = ก็ยังเป็นสี${res.th}! ลองคู่อื่นนะ 😊`, true, 5500); return; }
  if (res.magic) {
    caption(`${sum} = ${name}! เก่งมาก 🎉`, true, 6000);
    if (isNew) { fx.burst(0, 3.5, 0); kit.cheer(); cheerT = 2.5; }
    const found = jars.filter(j => SECONDARY.includes(j.res.id)).length;
    if (isNew && found === SECONDARY.length) setTimeout(celebrateAll, 1500);
    return;
  }
  let why = '';
  if (picks.includes('white') && !picks.includes('black')) why = ' ใส่ขาวแล้วสีอ่อนลง';
  else if (picks.includes('black') && !picks.includes('white')) why = ' ใส่ดำแล้วสีเข้มขึ้น';
  caption(`${sum} = ${name}!${why} ✨`, true, 6000);
  if (isNew) { kit.tones([523, 659, 784], .08); cheerT = 1.2; }
}

function celebrateAll() {
  const banner = document.getElementById('banner');
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 3500);
  [[-3, 4, 0], [0, 5, 0], [3, 4, 0]].forEach(([x, y, z], i) => setTimeout(() => fx.burst(x, y, z), i * 250));
  kit.cheer(); cheerT = 4;
  caption('ค้นพบครบ 3 สีแล้ว ส้ม เขียว ม่วง! 🌈', true, 6000);
}

// Little paint cubes that pop out of the pot or off the easel
const bits = [];
function splash(x, y, z, hex, n) {
  for (let i = 0; i < n; i++) {
    const m = box(scene, .14, .14, .14, hex, x, y, z, false);
    bits.push({ m, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 3, vz: (Math.random() - .5) * 4, life: .9 });
  }
}
const flights = [];
function splat(pos, hex) {
  // a blocky splat: one big square + a few small ones around it, flat on the canvas
  const local = easel.worldToLocal(pos.clone());
  const s = .5 + Math.random() * .3, z = .46 + (splats++) * .0015;   // each new splat sits a hair in front
  const add = (w, h, dx, dy) => box(easel, w, h, .02, hex, local.x + dx, local.y + dy, z, false);
  add(s, s, 0, 0);
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2, r = s * .6 + Math.random() * .2;
    add(s * .3, s * .3, Math.cos(a) * r, Math.sin(a) * r);
  }
}

/* =========================================================
   Dock: mode buttons + the paints for the current mode
   ========================================================= */
function paintButton(key, small) {
  const b = document.createElement('button');
  b.className = 'paint' + (small ? ' small' : '') + (C[key].light ? ' light' : '');
  b.style.setProperty('--c', C[key].hex);
  b.innerHTML = C[key].th;
  b.title = C[key].en;
  b.addEventListener('click', () => pick(key));
  return b;
}
const modesEl = document.getElementById('modes');
Object.entries(MODES).forEach(([id, M]) => {
  const b = document.createElement('button');
  b.className = 'w-mode'; b.dataset.m = id;
  b.innerHTML = `<span class="em">${M.em}</span>${M.th}`;
  b.onclick = () => { if (mode !== id && !busy) { kit.tones([440, 660], .06); setMode(id); } };
  modesEl.appendChild(b);
});
const paintsEl = document.getElementById('paints'), extrasEl = document.getElementById('extras'), actionsEl = document.getElementById('actions');
let stirBtn = null;
function buildDock() {
  const M = MODES[mode];
  paintsEl.innerHTML = ''; extrasEl.innerHTML = ''; actionsEl.innerHTML = ''; stirBtn = null;
  extrasEl.classList.remove('show');
  M.paints.forEach(k => paintsEl.appendChild(paintButton(k, M.small)));
  if (M.more) {                                    // 🎨 mode keeps its "more colours" drawer
    M.more.forEach(k => extrasEl.appendChild(paintButton(k, true)));
    const more = document.createElement('button');
    more.className = 'w-btn white'; more.textContent = '➕ สีเพิ่ม'; more.title = 'More colors';
    more.onclick = () => { const on = extrasEl.classList.toggle('show'); more.textContent = on ? '➖ ซ่อน' : '➕ สีเพิ่ม'; };
    paintsEl.appendChild(more);
  }
  if (M.extra) M.extra.forEach(k => actionsEl.appendChild(paintButton(k)));   // ⚪ ⚫
  if (M.stir) {
    stirBtn = document.createElement('button');
    stirBtn.className = 'w-btn'; stirBtn.textContent = '🥄 คน! Stir';
    stirBtn.onclick = () => { if (!busy && !done) stir(); };
    const again = document.createElement('button');
    again.className = 'w-btn white'; again.textContent = '↺ เทใหม่';
    again.onclick = () => { if (!busy) { resetPot(); drawEq(); updateActions(); caption('หม้อว่างแล้ว ใส่สีใหม่ได้เลย', false, 2500); } };
    actionsEl.append(stirBtn, again);
  }
  updateActions();
}
function updateActions() {
  if (stirBtn) stirBtn.disabled = busy || done || picks.length < 2;
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(jars.map(j => j.g), true)[0];
  if (hit) { pick(hit.object.userData.jar.id); return; }
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); }
});

camera.position.set(0, 8, 15); controls.target.set(0, 2, 0);
const portrait = innerWidth < innerHeight;   // phones need to stand further back to see pot + shelf + easel
kit.flyTo(stage, portrait ? new THREE.Vector3(2, 14, 25) : new THREE.Vector3(1, 10, 19), new THREE.Vector3(0, portrait ? .8 : 1.4, -.8), 1200);
setMode('primary');

stage.start((dt, time) => {
  // falling paint drops
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy -= 14 * dt; d.m.position.y += d.vy * dt;
    if (d.m.position.y <= POT_Y + .1) { drops.splice(i, 1); dropLanded(d); }
  }
  // stirring: the liquid swirls through every colour that went in
  if (stirT > 0) {
    stirT -= dt;
    stirrer.rotation.y += dt * 9;
    const k = (time * 7) % swirl.length, a = Math.floor(k);
    liquidMat.color.copy(swirl[a]).lerp(swirl[(a + 1) % swirl.length], k - a);
    if (Math.random() < .3) splash((Math.random() - .5) * 2, POT_Y + .3, (Math.random() - .5) * 2, '#ffffff', 1);
    if (stirT <= 0) reveal();
  } else stirrer.rotation.y += dt * .4;
  // paint balls flying to the easel
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i];
    f.t = Math.min(1, f.t + dt * 1.6);
    f.m.position.lerpVectors(f.from, f.to, f.t);
    f.m.position.y += Math.sin(f.t * Math.PI) * 2.2;
    if (f.t >= 1) {
      scene.remove(f.m); flights.splice(i, 1);
      splat(f.to, f.res.hex); splash(f.to.x, f.to.y, f.to.z, f.res.hex, 6);
      kit.tones([220], .05, 'square', .1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.vy -= 12 * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); bits.splice(i, 1); }
  }
  // new jars pop onto the shelf
  jars.forEach(j => { if (j.grow < 1) { j.grow = Math.min(1, j.grow + dt * 2.5); j.g.scale.setScalar(.01 + j.grow * (1 + Math.sin(j.grow * Math.PI) * .4)); } });
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  if (stirT > 0) summer.armR.rotation.x = Math.sin(time * 12) * .8;   // Summer stirs along
  floaters.update(dt, time);
  fx.update(dt);
});

// test hooks
window.__mix = { pick, stir, setMode, mixOf, hexOf, get target() { return target; }, get stars() { return stars; }, get busy() { return busy; }, jars };
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
