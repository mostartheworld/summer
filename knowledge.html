<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 รู้อะไรบ้างนะ? — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  /* 7 topics + reset → a 4 × 2 grid so it fits a phone */
  .w-modes { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); }
  .w-mode { min-height: 56px; font-size: 12px; line-height: 1.1; }
  .w-mode .em { font-size: 22px; }
  .w-mode .cnt { font-size: 11px; opacity: .7; }
  .prog { font-weight: 800; }
  #mathBar { display: none; }
  #mathBar.show { display: flex; }
  #mathBar .w-btn.ans { flex: 1 1 0; min-width: 0; font-size: 28px; min-height: 64px; padding: 0 6px; }
  #mathBar .w-btn.ans.ok { background: #2fb36a; box-shadow: 0 6px 0 #1f8a4f; }
  #mathBar .w-btn.ans.no { background: #e5d9c4; box-shadow: 0 6px 0 #cbbda4; }
  .eqn { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 5; background: #fff; border-radius: 999px;
    padding: 6px 22px; font-size: 34px; font-weight: 900; box-shadow: 0 6px 0 rgba(0,0,0,.08); display: none; white-space: nowrap; }
  .eqn.show { display: block; }
  .eqn .a { color: #e0453a; } .eqn .b { color: #2d7be0; } .eqn .q { color: var(--orange-dark); }
  body.math .w-caption { top: 150px; }
  @media (max-width: 520px) { #prog { display: none; } }   /* the topic buttons show the counts on phones */
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🧠 รู้อะไรบ้างนะ? <span class="en">· WHAT DO YOU KNOW?</span></div>
  <div class="w-icons">
    <div class="w-pill prog" id="prog" title="คำที่รู้แล้ว Learned">⭐ 0/60</div>
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="eqn" id="eqn"></div>
<div class="w-caption" id="caption"></div>

<div class="w-dock">
  <div class="w-controls" id="mathBar">
    <div class="w-seg" id="opSeg">
      <button data-op="add" class="on">➕</button><button data-op="sub">➖</button><button data-op="both">🎲</button>
    </div>
  </div>
  <div class="w-controls" id="answers" style="display:none"></div>
  <div class="w-modes" id="modes"></div>
</div>

<div class="w-modal-bg" id="resetModal">
  <div class="w-card">
    <h2 style="text-align:center">เริ่มใหม่ไหม?</h2>
    <p style="text-align:center">ดาวที่ได้ทุกคำจะหายไป · Clear all progress?</p>
    <div class="w-controls"><button class="w-btn white" id="resetNo">ไม่ดีกว่า</button><button class="w-btn" id="resetYes">เริ่มใหม่ 🔄</button></div>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🧠</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
/* =========================================================
   รู้อะไรบ้างนะ? (Knowledge playground) — a little museum of words
   6 topics × 10 words. Each word floats over a pedestal. Tap it → it jumps,
   says the Thai word then the English word, and earns a ⭐ (the pedestal turns gold).
   Progress is kept in localStorage "summer_knowledge_v2" (same key as the old page).
   🔢 math: two piles of blocks, pick the answer from 3 big buttons.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 8; controls.maxDistance = 40;
controls.minPolarAngle = .5; controls.maxPolarAngle = 1.45;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 16, spread: 10, y0: -2 });

const DATA = [
  { id: 1, icon: '🌍', color: '#3aa0e0', th: 'ประเทศ', en: 'Countries', cards: [
    { emoji: '🇹🇭', th: 'ไทย', en: 'Thailand' }, { emoji: '🇯🇵', th: 'ญี่ปุ่น', en: 'Japan' }, { emoji: '🇺🇸', th: 'อเมริกา', en: 'USA' },
    { emoji: '🇬🇧', th: 'อังกฤษ', en: 'England' }, { emoji: '🇫🇷', th: 'ฝรั่งเศส', en: 'France' }, { emoji: '🇨🇳', th: 'จีน', en: 'China' },
    { emoji: '🇰🇷', th: 'เกาหลี', en: 'Korea' }, { emoji: '🇦🇺', th: 'ออสเตรเลีย', en: 'Australia' }, { emoji: '🇧🇷', th: 'บราซิล', en: 'Brazil' }, { emoji: '🇮🇳', th: 'อินเดีย', en: 'India' }] },
  { id: 2, icon: '🚗', color: '#f08a24', th: 'ยานพาหนะ', en: 'Transport', cards: [
    { emoji: '🚗', th: 'รถยนต์', en: 'Car' }, { emoji: '🚌', th: 'รถบัส', en: 'Bus' }, { emoji: '🚂', th: 'รถไฟ', en: 'Train' },
    { emoji: '✈️', th: 'เครื่องบิน', en: 'Airplane' }, { emoji: '🚢', th: 'เรือ', en: 'Ship' }, { emoji: '🚲', th: 'จักรยาน', en: 'Bicycle' },
    { emoji: '🏍️', th: 'มอเตอร์ไซค์', en: 'Motorcycle' }, { emoji: '🚁', th: 'เฮลิคอปเตอร์', en: 'Helicopter' }, { emoji: '🚀', th: 'จรวด', en: 'Rocket' }, { emoji: '🚕', th: 'แท็กซี่', en: 'Taxi' }] },
  { id: 3, icon: '👔', color: '#7c5ce0', th: 'อาชีพ', en: 'Jobs', cards: [
    { emoji: '👨‍⚕️', th: 'หมอ', en: 'Doctor' }, { emoji: '👩‍🏫', th: 'ครู', en: 'Teacher' }, { emoji: '👮', th: 'ตำรวจ', en: 'Police' },
    { emoji: '👨‍🍳', th: 'พ่อครัว', en: 'Chef' }, { emoji: '👨‍🌾', th: 'ชาวนา', en: 'Farmer' }, { emoji: '👨‍✈️', th: 'นักบิน', en: 'Pilot' },
    { emoji: '👷', th: 'วิศวกร', en: 'Engineer' }, { emoji: '🧑‍🎨', th: 'ศิลปิน', en: 'Artist' }, { emoji: '🧑‍🚒', th: 'นักดับเพลิง', en: 'Firefighter' }, { emoji: '🎤', th: 'นักร้อง', en: 'Singer' }] },
  { id: 4, icon: '🔷', color: '#2fb3a0', th: 'รูปทรง', en: 'Shapes', cards: [
    { emoji: '⭕', th: 'วงกลม', en: 'Circle' }, { emoji: '🟥', th: 'สี่เหลี่ยม', en: 'Square' }, { emoji: '🔺', th: 'สามเหลี่ยม', en: 'Triangle' },
    { emoji: '▬', th: 'สี่เหลี่ยมผืนผ้า', en: 'Rectangle' }, { emoji: '⭐', th: 'ดาว', en: 'Star' }, { emoji: '❤️', th: 'หัวใจ', en: 'Heart' },
    { emoji: '💎', th: 'เพชร', en: 'Diamond' }, { emoji: '🥚', th: 'วงรี', en: 'Oval' }, { emoji: '⬠', th: 'ห้าเหลี่ยม', en: 'Pentagon' }, { emoji: '⬡', th: 'หกเหลี่ยม', en: 'Hexagon' }] },
  { id: 5, icon: '💭', color: '#e0457a', th: 'คำตรงข้าม', en: 'Opposites', type: 'opposite', cards: [
    { emoji: '↔️', th: 'ใหญ่', th2: 'เล็ก', en: 'Big', en2: 'Small' }, { emoji: '🌡️', th: 'ร้อน', th2: 'เย็น', en: 'Hot', en2: 'Cold' },
    { emoji: '⚡', th: 'เร็ว', th2: 'ช้า', en: 'Fast', en2: 'Slow' }, { emoji: '😊', th: 'มีความสุข', th2: 'เศร้า', en: 'Happy', en2: 'Sad' },
    { emoji: '✨', th: 'ใหม่', th2: 'เก่า', en: 'New', en2: 'Old' }, { emoji: '💡', th: 'สว่าง', th2: 'มืด', en: 'Light', en2: 'Dark' },
    { emoji: '📏', th: 'ยาว', th2: 'สั้น', en: 'Long', en2: 'Short' }, { emoji: '🔊', th: 'ดัง', th2: 'เบา', en: 'Loud', en2: 'Quiet' },
    { emoji: '🧹', th: 'สะอาด', th2: 'สกปรก', en: 'Clean', en2: 'Dirty' }, { emoji: '📖', th: 'เปิด', th2: 'ปิด', en: 'Open', en2: 'Closed' }] },
  { id: 6, icon: '😊', color: '#f2b705', th: 'ความรู้สึก', en: 'Feelings', cards: [
    { emoji: '😄', th: 'มีความสุข', en: 'Happy' }, { emoji: '😢', th: 'เศร้า', en: 'Sad' }, { emoji: '😠', th: 'โกรธ', en: 'Angry' },
    { emoji: '😨', th: 'กลัว', en: 'Scared' }, { emoji: '😲', th: 'ประหลาดใจ', en: 'Surprised' }, { emoji: '🤩', th: 'ตื่นเต้น', en: 'Excited' },
    { emoji: '😴', th: 'ง่วงนอน', en: 'Sleepy' }, { emoji: '🤢', th: 'คลื่นไส้', en: 'Sick' }, { emoji: '😑', th: 'เบื่อ', en: 'Bored' }, { emoji: '🥹', th: 'ภูมิใจ', en: 'Proud' }] },
];
const TOTAL = DATA.reduce((s, c) => s + c.cards.length, 0);

// ── Progress (same storage key as the old page, so stars carry over) ──
const KEY = 'summer_knowledge_v2';
let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
function saveLearned() { try { localStorage.setItem(KEY, JSON.stringify([...learned])); } catch (e) {} }
const progEl = document.getElementById('prog');
function showProgress() {
  progEl.textContent = `⭐ ${learned.size}/${TOTAL}`;
  document.querySelectorAll('.w-mode[data-cat]').forEach(b => {
    const cat = DATA.find(c => c.id == b.dataset.cat);
    b.querySelector('.cnt').textContent = `${cat.cards.filter((_, i) => learned.has(`${cat.id}-${i}`)).length}/10`;
  });
}

// ── Speech: Thai first, then the English word in an English voice ──
function sayEn(text) {
  if (!kit.soundOn() || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = .85;
  speechSynthesis.speak(u);   // queued after the Thai word (kit.speak cancels, this doesn't)
}
const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

/* =========================================================
   The museum
   ========================================================= */
box(scene, 22, .4, 14, '#8fd16a', 0, -.2, 0);
box(scene, 22, 1.2, 14, '#d39a5c', 0, -1, 0);
box(scene, 20, 1, 12, '#b87e47', 0, -2.1, 0);
box(scene, 14, .8, 8, '#9b6a3c', 0, -3, 0);
// back wall with a big sign
box(scene, 18, 6, .5, '#f6ead2', 0, 3, -5.6);
box(scene, 18.6, .5, 1, '#c98a5a', 0, 6.2, -5.6);
for (let x = -8; x <= 8; x += 4) box(scene, .5, 6, .7, '#e3d2b0', x, 3, -5.4);
const sign = kit.labelSprite('🧠 พิพิธภัณฑ์คำศัพท์ · WORD MUSEUM', .9, { bg: '#ff8a3d', fg: '#ffffff' });
sign.position.set(0, 5.2, -5.1); scene.add(sign);
const summer = kit.makeSummer();
summer.g.position.set(-7.2, 0, 4.2); summer.g.rotation.y = .7; summer.g.scale.setScalar(1.5);
scene.add(summer.g);

const hall = new THREE.Group(); scene.add(hall);
let exhibits = [], fitBox = { w: 12, h: 6 };
function rowsOf() { return innerWidth < innerHeight ? 4 : 5; }   // exhibits per row

// One exhibit: pedestal (category colour → gold when learned) + floating emoji + Thai/English label
function makeExhibit(cat, card, i) {
  const g = new THREE.Group();
  const id = `${cat.id}-${i}`;
  const topMat = new THREE.MeshLambertMaterial({ color: cat.color });
  box(g, 1.7, .9, 1.7, '#fffaf0', 0, .45, 0);
  const top = new THREE.Mesh(kit.UNIT, topMat); top.scale.set(1.85, .2, 1.85); top.position.y = 1; top.castShadow = true; g.add(top);
  const em = kit.emojiSprite(card.emoji, '#ffffff', 1.6); em.position.y = 2.1; g.add(em);
  const text = cat.type === 'opposite' ? `${card.th} ↔ ${card.th2}` : card.th;
  const lab = kit.labelSprite(text, .5); lab.position.set(0, -.15, 1.05); g.add(lab);
  const en = kit.labelSprite(cat.type === 'opposite' ? `${card.en} · ${card.en2}` : card.en, .38, { bg: cat.color, fg: '#ffffff' }); en.position.set(0, -.65, 1.05); g.add(en);
  const star = kit.emojiSprite('⭐', null, .7); star.position.set(.85, 3.2, 0); g.add(star);
  g.userData = { id, cat, card, em, star, topMat, jump: 0, spin: 0 };
  g.traverse(m => { m.userData.exhibit = g; });
  paintLearned(g);
  return g;
}
function paintLearned(g) {
  const on = learned.has(g.userData.id);
  g.userData.topMat.color.set(on ? '#ffd23f' : g.userData.cat.color);
  g.userData.star.visible = on;
}
function showCategory(cat) {
  hall.clear(); exhibits = [];
  // rows stand on steps (back rows higher) so nothing hides behind the row in front
  const per = rowsOf(), rows = Math.ceil(cat.cards.length / per), gx = innerWidth < innerHeight ? 2.8 : 3.1, gz = 4.4, step = 2.1;
  for (let r = 0; r < rows - 1; r++) {
    const h = (rows - 1 - r) * step;
    box(hall, per * gx + .6, h, gz, '#eadbbd', 0, h / 2, (r - (rows - 1) / 2) * gz + .6);
  }
  cat.cards.forEach((card, i) => {
    const r = Math.floor(i / per), c = i % per, inRow = Math.min(per, cat.cards.length - r * per);
    const g = makeExhibit(cat, card, i);
    g.userData.base = (rows - 1 - r) * step;
    g.position.set((c - (inRow - 1) / 2) * gx, g.userData.base, (r - (rows - 1) / 2) * gz + .6);
    g.userData.drop = .4 + i * .06;
    hall.add(g); exhibits.push(g);
  });
  fitBox = { w: per * gx, h: rows * gz, top: (rows - 1) * step + 3.4 };
}

function tapExhibit(g) {
  const { id, cat, card } = g.userData;
  g.userData.jump = 1; g.userData.spin = 1;
  const isOpp = cat.type === 'opposite';
  caption(isOpp ? `${card.th} ↔ ${card.th2} · ${card.en} ↔ ${card.en2}` : `${card.th} · ${card.en}`, false, 3500);
  kit.speak(isOpp ? `${card.th} ตรงข้ามกับ ${card.th2}` : card.th);
  sayEn(isOpp ? `${card.en}, ${card.en2}` : card.en);
  if (!learned.has(id)) {
    learned.add(id); saveLearned(); paintLearned(g); showProgress();
    kit.tones([523, 659, 784], .06, 'triangle', .12);
    fx.burst(...g.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 2.6, 0)).toArray(), ['#ffd23f', '#ffffff', cat.color], 14);
    if (cat.cards.every((_, i) => learned.has(`${cat.id}-${i}`))) setTimeout(() => { kit.cheer(); fx.burst(0, 5, 0); caption(`รู้ครบ 10 คำ หมวด${cat.th} แล้ว! 🎉`, true, 4500); cheerT = 3; }, 1600);
    if (learned.size === TOTAL) setTimeout(() => { const b = document.getElementById('banner'); b.classList.add('show'); setTimeout(() => b.classList.remove('show'), 3500); }, 2600);
  } else kit.tones([660], .05, 'sine', .1);
  cheerT = Math.max(cheerT, .8);
}

/* =========================================================
   🔢 Math: a red pile + a blue pile (or a pile with some blocks flying away)
   ========================================================= */
const mathArea = new THREE.Group(); scene.add(mathArea);
const answersEl = document.getElementById('answers'), eqnEl = document.getElementById('eqn');
const M = { op: 'add', a: 0, b: 0, ans: 0, locked: false, blocks: [], score: 0, total: 0 };
function pileBlocks(n, color, x0, delay) {
  // groups of 5 in a row (like a ten-frame), rows stack backwards
  for (let k = 0; k < n; k++) {
    const m = box(mathArea, .8, .8, .8, color, x0 + (k % 5) * .95, .4, -Math.floor(k / 5) * .95);
    m.userData.home = m.position.clone(); m.userData.t = -delay - k * .05; m.position.y = 8;
    M.blocks.push(m);
  }
}
function newMath() {
  mathArea.clear(); M.blocks = []; M.locked = false;
  const add = M.op === 'add' || (M.op === 'both' && Math.random() < .5);
  if (add) { M.a = 1 + Math.floor(Math.random() * 12); M.b = 1 + Math.floor(Math.random() * 12); M.ans = M.a + M.b; M.sign = '+'; }
  else { M.a = 3 + Math.floor(Math.random() * 13); M.b = 1 + Math.floor(Math.random() * M.a); M.ans = M.a - M.b; M.sign = '−'; }
  if (add) { pileBlocks(M.a, '#e0453a', -5.6, 0); pileBlocks(M.b, '#2d7be0', 1, .4); }
  else { pileBlocks(M.a, '#e0453a', -2.3, 0); M.blocks.slice(M.a - M.b).forEach(m => { m.userData.away = true; }); }
  eqnEl.innerHTML = `<span class="a">${M.a}</span> ${M.sign} <span class="b">${M.b}</span> = <span class="q">?</span>`;
  // 3 choices: the answer and two near misses, shuffled
  const opts = new Set([M.ans]);
  while (opts.size < 3) { const d = M.ans + [-2, -1, 1, 2, 3][Math.floor(Math.random() * 5)]; if (d >= 0) opts.add(d); }
  answersEl.innerHTML = '';
  [...opts].sort(() => Math.random() - .5).forEach(v => {
    const b = document.createElement('button');
    b.className = 'w-btn white ans'; b.textContent = v;
    b.onclick = () => mathAnswer(v, b);
    answersEl.appendChild(b);
  });
  caption(add ? `${M.a} บวก ${M.b} ได้เท่าไร? นับก้อนทั้งหมดเลย` : `มี ${M.a} ก้อน เอาออก ${M.b} ก้อน เหลือเท่าไร?`, true, 6000);
  if (!add) setTimeout(() => { M.blocks.filter(m => m.userData.away).forEach(m => { m.userData.fly = 0; }); }, 1600);
  if (mode === 'math') frame();
}
function mathAnswer(v, btn) {
  if (M.locked) return;
  M.locked = true; M.total++;
  const btns = [...answersEl.children];
  btns.find(b => +b.textContent === M.ans).classList.add('ok');
  eqnEl.querySelector('.q').textContent = M.ans;
  if (v === M.ans) {
    M.score++;
    caption(['ถูกต้อง! 🎉', 'เก่งมาก! ✨', 'เยี่ยมไปเลย! 🌟'][M.total % 3] + ` ได้ ${M.ans}`, true, 2500);
    kit.cheer(); cheerT = 1.5; fx.burst(0, 3, 0);
    M.blocks.forEach((m, i) => { m.userData.hop = -i * .04; });
  } else {
    btn.classList.add('no');
    caption(`ยังไม่ใช่ คำตอบคือ ${M.ans} นะ ลองนับดูอีกที 😊`, true, 3500);
  }
  setTimeout(newMath, v === M.ans ? 2400 : 3600);
}
document.querySelectorAll('#opSeg button').forEach(b => b.onclick = () => {
  M.op = b.dataset.op;
  document.querySelectorAll('#opSeg button').forEach(x => x.classList.toggle('on', x === b));
  newMath();
});

/* =========================================================
   Modes
   ========================================================= */
let mode = null;
const modesEl = document.getElementById('modes');
DATA.forEach(cat => {
  const b = document.createElement('button');
  b.className = 'w-mode'; b.dataset.cat = cat.id; b.dataset.m = 'cat' + cat.id;
  b.innerHTML = `<span class="em">${cat.icon}</span>${cat.th}<span class="cnt">0/10</span>`;
  b.onclick = () => setMode('cat' + cat.id);
  modesEl.appendChild(b);
});
[['math', '🔢', 'บวก ลบ'], ['reset', '🔄', 'เริ่มใหม่']].forEach(([m, em, th]) => {
  const b = document.createElement('button');
  b.className = 'w-mode'; b.dataset.m = m;
  b.innerHTML = `<span class="em">${em}</span>${th}`;
  b.onclick = () => m === 'reset' ? resetModal.classList.add('show') : setMode('math');
  modesEl.appendChild(b);
});
const resetModal = document.getElementById('resetModal');
document.getElementById('resetNo').onclick = () => resetModal.classList.remove('show');
document.getElementById('resetYes').onclick = () => {
  learned.clear(); saveLearned(); showProgress(); exhibits.forEach(paintLearned);
  resetModal.classList.remove('show'); caption('เริ่มใหม่แล้ว! แตะคำต่างๆ เพื่อเก็บดาวนะ ⭐', true, 3500);
};

function setMode(m) {
  if (m === mode) return;
  mode = m;
  kit.tones([440, 660], .06);
  document.querySelectorAll('.w-mode').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  const isMath = m === 'math';
  document.body.classList.toggle('math', isMath);
  document.getElementById('mathBar').classList.toggle('show', isMath);
  answersEl.style.display = isMath ? 'flex' : 'none';
  eqnEl.classList.toggle('show', isMath);
  hall.visible = !isMath; mathArea.visible = isMath;
  if (isMath) { exhibits = []; hall.clear(); newMath(); }
  else {
    const cat = DATA.find(c => 'cat' + c.id === m);
    showCategory(cat);
    caption(`หมวด${cat.th} · ${cat.en} — แตะของแต่ละชิ้น เพื่อฟังและเก็บดาว ⭐`, true, 5000);
  }
  frame();
}
// Fit everything between the caption (top) and the dock (bottom)
function frame() {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, h = Math.atan(Math.tan(v) * camera.aspect);
  const math = mode === 'math', W = math ? (M.sign === '+' ? 13.5 : 7) : fitBox.w + 1.2;
  const H = math ? 5 : fitBox.top + 2.5;
  const dist = Math.max(W / 2 / Math.tan(h), H * (math ? .85 : 1.12) / Math.tan(v), 11);
  const ty = math ? (innerWidth < innerHeight ? -1.6 : -.2) : fitBox.top * .3;
  kit.flyTo(stage, new THREE.Vector3(.5, ty + dist * (math ? .4 : .5), dist * (math ? .92 : .87)), new THREE.Vector3(0, ty, 0), 1100);
}

/* =========================================================
   Taps + loop
   ========================================================= */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const canvas = stage.renderer.domElement;
let press = null, cheerT = 0;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!press) return;
  const tap = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 10 && performance.now() - press.t < 500;
  press = null;
  if (!tap) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(exhibits, true)[0];
  if (hit) { tapExhibit(hit.object.userData.exhibit); return; }
  if (raycaster.intersectObject(summer.g, true).length) { cheerT = 1.2; kit.tones([660, 880], .07); }
});

camera.position.set(0, 12, 26); controls.target.set(0, 1, 0);
showProgress();
setMode('cat1');

stage.start((dt, time) => {
  exhibits.forEach((g, i) => {
    const u = g.userData;
    if (u.drop > 0) u.drop = Math.max(0, u.drop - dt * 1.5);
    g.position.y = u.base + u.drop * u.drop * 10;
    u.jump = Math.max(0, u.jump - dt * 1.6);
    u.spin = Math.max(0, u.spin - dt * 1.2);
    u.em.position.y = 2.1 + Math.sin(time * 2 + i) * .1 + Math.sin(u.jump * Math.PI) * 1.2;
    const s = 1.6 * (1 + Math.sin(u.jump * Math.PI) * .25);
    u.em.scale.set(s, s, 1);
    u.em.material.rotation = Math.sin(u.spin * Math.PI * 2) * .4;
    u.star.position.y = 3.2 + Math.sin(time * 3 + i) * .1;
  });
  // math blocks: drop in, hop when right, the "taken away" ones fly off
  M.blocks.forEach(m => {
    const u = m.userData;
    if (u.t < 1) { u.t += dt * 1.8; const k = Math.max(0, Math.min(1, u.t)); m.position.y = u.home.y + (1 - k * k) * 8; }
    if (u.fly !== undefined) { u.fly += dt; m.position.x += dt * 7; m.position.y += dt * 4; m.rotation.z -= dt * 5; m.visible = u.fly < 1.2; }
    if (u.hop !== undefined && u.fly === undefined) { u.hop += dt * 3; if (u.hop > 0 && u.hop < 1) m.position.y = u.home.y + Math.sin(u.hop * Math.PI) * .9; }
  });
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});

// test hooks
window.__know = { setMode, tap: i => tapExhibit(exhibits[i]), mathAnswer: ok => { const b = [...answersEl.children].find(x => (+x.textContent === M.ans) === ok); mathAnswer(+b.textContent, b); }, M, get learned() { return learned.size; } };
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
