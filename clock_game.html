<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🕐 นาฬิกา — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="world-theme.css">
<style>
  .info { font-weight: 800; }
  .info b { color: var(--orange-dark); }
  .choice { min-width: 0; flex: 1 1 40%; font-size: 22px; min-height: 64px; }
  .choice.right { background: #22c55e; box-shadow: 0 6px 0 #15803d; color: #fff; }
  .choice.wrong { background: #ef4444; box-shadow: 0 6px 0 #b91c1c; color: #fff; }
  #nextBtn { display: none; }
  .big-em { font-size: 56px; text-align: center; }
</style>
</head>
<body>
<div class="w-fade-in"></div>
<canvas class="w-canvas" id="world"></canvas>

<div class="w-top">
  <a class="w-pill w-back" href="index.html" data-fade title="กลับเกาะ Back to island">🏝️ <span>กลับเกาะ</span></a>
  <div class="w-pill w-title">🕐 นาฬิกา <span class="en">· CLOCK</span></div>
  <div class="w-icons">
    <button class="w-pill w-icon" id="soundBtn" title="เปิด/ปิดเสียง Sound">🔊</button>
  </div>
</div>

<div class="w-caption" id="caption"></div>

<div class="w-dock">
  <div class="w-controls">
    <div class="w-pill info">⭐ <b id="score">0</b> · ข้อ <b id="qnum">1</b>/10</div>
  </div>
  <div class="w-controls" id="choices"></div>
  <div class="w-controls"><button class="w-btn big" id="nextBtn">ข้อต่อไป ▶</button></div>
  <div class="w-modes">
    <button class="w-mode on" data-mode="full"><span class="em">🕒</span>เต็มชั่วโมง</button>
    <button class="w-mode" data-mode="half"><span class="em">🕞</span>ครึ่งชั่วโมง</button>
    <button class="w-mode" data-mode="mix"><span class="em">🎲</span>ผสม</button>
  </div>
</div>

<div class="w-modal-bg" id="result">
  <div class="w-card" style="text-align:center">
    <div class="big-em" id="rEm">🏆</div>
    <h2 id="rTitle">เก่งมากเลย!</h2>
    <p>คะแนนของหนู <b id="rScore" style="font-size:28px">0 / 10</b></p>
    <button class="w-btn" id="retryBtn">เล่นอีกครั้ง 🔄</button>
  </div>
</div>

<div class="w-fallback" id="fallback">
  <div class="big">🕐</div>
  <h2>โหลดฉาก 3D ไม่ได้</h2>
  <div>ต้องต่ออินเทอร์เน็ตนะ / This page needs internet</div>
  <a class="w-btn" href="menu.html">ไปหน้าเมนู ▶</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="world-kit.js"></script>
<script>
  setTimeout(function () { if (!window.__worldReady) document.getElementById('fallback').classList.add('show'); }, 10000);
</script>

<script type="module">
/* =========================================================
   นาฬิกา (Clock) — read the clock tower, tap the right time
   Modes: full hours / half hours / mixed. 10 questions per round.
   Right answer → the tower chimes the hour and the cuckoo pops out.
   ========================================================= */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const kit = WorldKit(THREE, OrbitControls);
const { box } = kit;
const stage = kit.createStage({ canvas: document.getElementById('world') });
const { scene, camera, controls } = stage;
controls.minDistance = 9; controls.maxDistance = 36;
controls.minPolarAngle = .5; controls.maxPolarAngle = 1.5;
kit.bindSoundButton(document.getElementById('soundBtn'));
kit.bindFadeLinks();
const fx = kit.createConfetti(scene);
const floaters = kit.createFloaters(scene, { count: 16, radius: 15, spread: 12, y0: -2 });

const captionEl = document.getElementById('caption');
let captionTimer = null;
function caption(text, say = true, ms = 4500) {
  captionEl.textContent = text; captionEl.classList.add('show');
  clearTimeout(captionTimer); captionTimer = setTimeout(() => captionEl.classList.remove('show'), ms);
  if (say) kit.speak(text.replace(/[^฀-๿0-9 ]/g, ' '));
}

/* =========================================================
   The clock tower
   ========================================================= */
box(scene, 16, .4, 11, '#8fd16a', 0, -.2, 0);
box(scene, 16, 1.2, 11, '#d39a5c', 0, -1, 0);
box(scene, 14, 1, 9, '#b87e47', 0, -2.1, 0);
box(scene, 10, .8, 6, '#9b6a3c', 0, -3, 0);
const FACE_Y = 6.4, FACE_Z = 1.62, R = 2.6;
box(scene, 7, 9.5, 3, '#f2e6d0', 0, 4.75, 0);                                    // tower
for (let y = 1; y < 9.5; y += 2.2) box(scene, 7.1, .25, 3.1, '#e3d2b4', 0, y, 0); // brick bands
box(scene, 7.6, .5, 3.6, '#c0392b', 0, 9.75, 0);                                   // stepped roof
box(scene, 6.4, .6, 3, '#c0392b', 0, 10.3, 0);
box(scene, 4.8, .6, 2.4, '#c0392b', 0, 10.9, 0);
box(scene, 3, .6, 1.8, '#a93226', 0, 11.5, 0);
box(scene, .3, 1, .3, '#ffd23f', 0, 12.3, 0);
box(scene, 1.6, 2.2, .2, '#8b5a3c', 0, 1.1, 1.52);                                 // door
// clock face: a round dial + numbers + ticks
const dial = new THREE.Mesh(new THREE.CylinderGeometry(R + .25, R + .25, .2, 48), kit.mat('#1e293b'));
dial.rotation.x = Math.PI / 2; dial.position.set(0, FACE_Y, FACE_Z - .05); scene.add(dial);
const faceDisc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, .22, 48), new THREE.MeshBasicMaterial({ color: '#fffdf5' }));   // unlit so the face stays bright and easy to read
faceDisc.rotation.x = Math.PI / 2; faceDisc.position.set(0, FACE_Y, FACE_Z); scene.add(faceDisc);
for (let i = 0; i < 60; i++) {
  const a = i / 60 * Math.PI * 2, big = i % 5 === 0, r = R - (big ? .28 : .18);
  const t = box(scene, big ? .1 : .05, big ? .32 : .16, .05, big ? '#64748b' : '#cbd5e1', Math.sin(a) * r, FACE_Y + Math.cos(a) * r, FACE_Z + .12, false);
  t.rotation.z = -a;
}
for (let n = 1; n <= 12; n++) {
  const a = n / 12 * Math.PI * 2;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#1e293b'; g.font = '700 84px Fredoka, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(n), 64, 70);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(.62, .62), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.position.set(Math.sin(a) * (R - .78), FACE_Y + Math.cos(a) * (R - .78), FACE_Z + .13);
  scene.add(m);
}
// hands rotate around the dial centre (rotation.z = −angle, clockwise)
function hand(len, w, color, z) {
  const g = new THREE.Group();
  g.position.set(0, FACE_Y, FACE_Z + z);
  const m = box(g, w, len, .08, color, 0, len / 2 - .2, 0, false);
  box(g, w * 1.6, w * 1.6, .08, color, 0, len - .2, 0, false);
  scene.add(g);
  return g;
}
const hourHand = hand(1.5, .22, '#1e293b', .16);
const minHand = hand(2.2, .13, '#6366f1', .22);
box(scene, .32, .32, .1, '#ef4444', 0, FACE_Y, FACE_Z + .3, false);
// cuckoo bird hides behind a little door under the roof
const cuckoo = new THREE.Group();
box(cuckoo, .7, .6, .7, '#ffd23f', 0, 0, 0);
box(cuckoo, .45, .45, .45, '#ffd23f', 0, .45, .15);
box(cuckoo, .2, .12, .3, '#f59e0b', 0, .42, .5);
[-.12, .12].forEach(x => box(cuckoo, .08, .08, .05, '#2b2118', x, .52, .38, false));
box(cuckoo, .5, .1, .8, '#e8b417', 0, .1, -.3);
cuckoo.position.set(0, 8.9, .6);
scene.add(cuckoo);
box(scene, 1.3, 1.2, .12, '#8b5a3c', 0, 8.9, 1.53);
const cuckooDoor = box(scene, 1.1, 1, .1, '#c98a5a', 0, 8.9, 1.6);

const summer = kit.makeSummer();
summer.g.position.set(-2.6, 0, 3.4); summer.g.rotation.y = .3;
scene.add(summer.g);
// a few voxel trees
[[-6, -2.5, '#5fb36a'], [6.2, -2, '#ff9eb8'], [6, 3, '#3f9a5a'], [-6.4, 3.2, '#f2a65a']].forEach(([x, z, c]) => {
  box(scene, .35, 1.2, .35, '#8b5a3c', x, .6, z);
  box(scene, 1.8, 1.4, 1.8, c, x, 1.9, z); box(scene, 1.1, .8, 1.1, kit.shade(c, 1.12), x, 3, z);
});

// Shown time animates toward the target time (in minutes, always moving forward)
let shownMin = 12 * 60, fromMin = shownMin, targetMin = shownMin, sweepT = 1;
function setTime(h, m) {
  const t = (h % 12) * 60 + m;
  fromMin = shownMin;
  targetMin = shownMin + ((t - shownMin % 720) + 720) % 720;
  if (targetMin - fromMin < 60) targetMin += 720;   // always give the hands a good spin
  sweepT = 0;
  kit.tones([880, 660], .08, 'sine', .08);
}

/* =========================================================
   Questions
   ========================================================= */
const TOTAL = 10;
const label = (h, m) => m === 0 ? `${h} โมงตรง` : `${h} โมงครึ่ง`;
function makePool(mode) {
  const pool = [];
  for (let h = 1; h <= 12; h++) {
    if (mode !== 'half') pool.push({ h, m: 0 });
    if (mode !== 'full') pool.push({ h, m: 30 });
  }
  return pool;
}
const shuffle = a => [...a].sort(() => Math.random() - .5);
let mode = 'full', pool = makePool(mode), score = 0, qIndex = 0, answered = false, current = null, last = null;
const choicesEl = document.getElementById('choices'), nextBtn = document.getElementById('nextBtn');

function newQuestion() {
  answered = false;
  nextBtn.style.display = 'none';
  do current = pool[Math.floor(Math.random() * pool.length)]; while (pool.length > 1 && current === last);
  last = current;
  setTime(current.h, current.m);
  document.getElementById('qnum').textContent = qIndex + 1;
  const wrong = shuffle(pool.filter(t => t !== current)).slice(0, 3);
  choicesEl.innerHTML = '';
  shuffle([current, ...wrong]).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'w-btn white choice'; b.textContent = label(opt.h, opt.m);
    b.onclick = () => pick(b, opt);
    choicesEl.appendChild(b);
  });
  setTimeout(() => caption('นาฬิกาชี้กี่โมง? 🕐'), 900);
}

function pick(btn, opt) {
  if (answered) return;
  answered = true;
  const ok = opt === current;
  [...choicesEl.children].forEach(b => { b.disabled = true; if (b.textContent === label(current.h, current.m)) b.classList.add('right'); });
  if (ok) {
    score++; document.getElementById('score').textContent = score;
    caption(`ถูกต้อง! ${label(current.h, current.m)} 🎉`);
    chime(current.h);
    fx.burst(0, 9, 2);
    cheerT = 2.5;
  } else {
    btn.classList.add('wrong');
    caption(`นี่คือ ${label(current.h, current.m)} นะ เข็มสั้นชี้ ${current.h}${current.m ? ' เข็มยาวชี้ 6' : ' เข็มยาวชี้ 12'} 💪`, true, 6500);
  }
  qIndex++;
  if (qIndex >= TOTAL) setTimeout(showResult, 2200);
  else nextBtn.style.display = 'inline-flex';
}

// Bong the hour (fast) and pop the cuckoo out
let cuckooT = 0;
function chime(h) {
  for (let i = 0; i < h; i++) setTimeout(() => kit.tones([392, 196], .04, 'sine', .16), 600 + i * 260);
  cuckooT = 1.2 + h * .26;
}

function showResult() {
  const pct = score / TOTAL;
  const [em, title] = pct === 1 ? ['🏆', 'เพอร์เฟกต์!'] : pct >= .8 ? ['⭐', 'เก่งมากเลย!'] : pct >= .6 ? ['😊', 'ดีนะ!'] : pct >= .4 ? ['💪', 'ฝึกอีกนิดนะ!'] : ['🌱', 'เดี๋ยวก็เก่งเอง!'];
  document.getElementById('rEm').textContent = em;
  document.getElementById('rTitle').textContent = title;
  document.getElementById('rScore').textContent = `${score} / ${TOTAL}`;
  document.getElementById('result').classList.add('show');
  kit.speak(`${title} ได้ ${score} คะแนน`);
  if (pct >= .6) kit.cheer();
}
function resetGame() {
  score = 0; qIndex = 0; pool = makePool(mode);
  document.getElementById('score').textContent = 0;
  document.getElementById('result').classList.remove('show');
  newQuestion();
}
nextBtn.onclick = newQuestion;
document.getElementById('retryBtn').onclick = resetGame;
document.querySelectorAll('.w-mode').forEach(b => b.onclick = () => {
  document.querySelectorAll('.w-mode').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.mode; resetGame();
});

/* =========================================================
   Loop
   ========================================================= */
const portrait = innerWidth < innerHeight;
camera.position.set(0, 9, 26); controls.target.set(0, 5.5, 0);
kit.flyTo(stage, portrait ? new THREE.Vector3(0, 7, 27) : new THREE.Vector3(3, 5.5, 25), new THREE.Vector3(0, portrait ? 5.2 : 3.6, 0), 1100);
let cheerT = 0;
newQuestion();

stage.start((dt, time) => {
  if (sweepT < 1) {
    sweepT = Math.min(1, sweepT + dt / 1.6);
    const e = 1 - Math.pow(1 - sweepT, 3);
    shownMin = fromMin + (targetMin - fromMin) * e;
  }
  minHand.rotation.z = -(shownMin % 60) / 60 * Math.PI * 2;
  hourHand.rotation.z = -(shownMin % 720) / 720 * Math.PI * 2;
  // cuckoo: door swings open, bird slides out and bobs
  if (cuckooT > 0) {
    cuckooT -= dt;
    cuckooDoor.rotation.y = Math.min(1.6, cuckooDoor.rotation.y + dt * 6);
    cuckoo.position.z = Math.min(2.3, cuckoo.position.z + dt * 6);
    cuckoo.rotation.x = Math.sin(time * 16) * .25;
  } else {
    cuckoo.position.z = Math.max(.6, cuckoo.position.z - dt * 4);
    if (cuckoo.position.z <= .6) cuckooDoor.rotation.y = Math.max(0, cuckooDoor.rotation.y - dt * 6);
  }
  cheerT -= dt;
  kit.poseSummer(summer, time, cheerT > 0 ? 'cheer' : 'idle');
  floaters.update(dt, time);
  fx.update(dt);
});
window.__worldReady = true;
document.getElementById('fallback').classList.remove('show');   // a slow connection may have shown it already
</script>
</body>
</html>
