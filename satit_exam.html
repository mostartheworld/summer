<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 ตะลุยสาธิต — Summer's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{--cream:#FFF8E8;--dark:#2D3047;--pink:#FF6B9D;--yellow:#FFD93D;--sat:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'Fredoka','Noto Sans Thai',sans-serif;background:#fff9f0;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;animation:blob-float ease-in-out infinite;opacity:.18}
@keyframes blob-float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-28px) scale(1.05)}}

/* NAV */
.site-nav{position:sticky;top:0;z-index:100;background:var(--cream);border-bottom:4px solid var(--dark);box-shadow:0 4px 0 var(--dark);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav-brand{font-family:'Bungee',cursive;font-size:15px;color:var(--dark);text-shadow:2px 2px 0 var(--pink);white-space:nowrap;flex-shrink:0;text-decoration:none}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-link{text-decoration:none;font-family:'Fredoka','Noto Sans Thai',sans-serif;font-size:13px;font-weight:600;padding:5px 13px;border-radius:12px;border:2.5px solid var(--dark);color:var(--dark);background:white;transition:all .12s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:2px 2px 0 var(--dark)}
.nav-link:hover{background:var(--yellow);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--dark)}
.nav-link.active{background:var(--sat);color:white;border-color:var(--sat)}
@media(max-width:420px){.nav-brand{font-size:13px}.nav-link{font-size:11px;padding:4px 10px}}

/* PAGE */
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:24px 16px 60px}
.home-link-wrap{margin-bottom:14px}
.home-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:white;color:var(--dark);border:2.5px solid var(--dark);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:800;box-shadow:2px 2px 0 var(--dark)}
.home-link:hover{background:var(--yellow)}

/* HERO */
.hero{text-align:center;margin-bottom:32px}
.hero-emoji{font-size:88px;display:block;animation:hero-float 3s ease-in-out infinite}
@keyframes hero-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.hero-title{font-family:'Bungee',cursive;font-size:clamp(24px,8vw,40px);color:var(--dark);margin:12px 0 8px;line-height:1.1}
.hero-sub{color:#6b5e78;font-size:17px;font-weight:600;line-height:1.6}
.hero-badge{display:inline-block;background:linear-gradient(135deg,#5a56e0,#7c3aed);color:white;font-family:'Bungee',cursive;font-size:10px;letter-spacing:1.5px;padding:5px 14px;border-radius:20px;border:2.5px solid var(--dark);margin-top:10px;box-shadow:2px 2px 0 var(--dark)}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.cat-btn{border:3px solid var(--dark);border-radius:22px;padding:22px 14px;text-align:center;cursor:pointer;box-shadow:4px 4px 0 var(--dark);transition:all .12s;font-family:'Fredoka','Noto Sans Thai',sans-serif;background:white}
.cat-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--dark)}
.cat-btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--dark)}
.cat-btn .cat-em{font-size:52px;display:block;margin-bottom:10px}
.cat-btn .cat-name{font-size:16px;font-weight:700;color:var(--dark);line-height:1.4}
.cat-btn .cat-en{font-size:11px;font-weight:600;color:#888;margin-top:3px}
.cat-btn .cat-score{font-size:13px;font-weight:700;margin-top:9px;color:#666}
.cat-btn.done{outline:4px solid #7c3aed;outline-offset:2px}
.cat-btn.done .cat-score{color:#7c3aed}
.cat-btn.cc1{background:linear-gradient(145deg,#f0fdf4,#bbf7d0)}
.cat-btn.cc2{background:linear-gradient(145deg,#fef9c3,#fde68a)}
.cat-btn.cc3{background:linear-gradient(145deg,#eff6ff,#bfdbfe)}
.cat-btn.cc4{background:linear-gradient(145deg,#fdf4ff,#e9d5ff)}

/* QUIZ PANEL */
.quiz-panel{display:none}
.quiz-panel.show{display:block}
.quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.quiz-back{background:white;border:2.5px solid var(--dark);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:700;color:var(--dark);cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 var(--dark);transition:all .12s}
.quiz-back:hover{background:var(--yellow)}
.quiz-cat-label{font-size:18px;font-weight:700;color:var(--dark)}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.progress-bar{flex:1;height:16px;background:#e8e0f0;border-radius:999px;border:2px solid var(--dark);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:999px;transition:width .4s cubic-bezier(.34,1.2,.64,1)}
.progress-text{font-size:15px;font-weight:800;color:var(--dark);white-space:nowrap}

.question-card{background:white;border:3px solid var(--dark);border-radius:24px;padding:24px 20px;box-shadow:4px 4px 0 var(--dark);margin-bottom:16px;text-align:center}
.q-image{display:none;font-size:72px;line-height:1.2;margin-bottom:10px}
.q-image.visible{display:block}
.q-text{font-size:19px;font-weight:700;color:var(--dark);line-height:1.6;margin-bottom:4px;white-space:pre-line}
.q-text-en{font-size:12px;color:#aaa;font-weight:600;margin-top:4px}

/* ── PATTERN type ── */
.pat-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0 8px}
.pat-shape{width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:30px;border-radius:11px;background:#f0f4ff;border:2px solid #c7d2fe;user-select:none}
.pat-blank{width:50px;height:50px;border:3px dashed #7c3aed;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#faf5ff;transition:all .35s}
.pat-blank.filled{border-style:solid;border-color:#22c55e;background:#dcfce7;animation:pop-in .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop-in{from{transform:scale(0.5)}to{transform:scale(1)}}
.pat-tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.pat-tile{width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:30px;border:3px solid var(--dark);border-radius:14px;background:white;box-shadow:3px 3px 0 var(--dark);cursor:pointer;transition:all .12s;position:relative}
.pat-tile:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--dark);background:#f5f0ff}
.pat-tile[disabled]{cursor:default}
.pat-tile.correct-pick{border-color:#22c55e;background:#dcfce7;box-shadow:3px 3px 0 #22c55e}
.pat-tile.wrong-pick{border-color:#ef4444;background:#fee2e2;box-shadow:3px 3px 0 #ef4444}
.pat-letter{font-family:'Bungee',cursive;font-size:11px;color:#7c3aed;line-height:1}

/* ── TTS type ── */
.tts-card{background:#fffbeb;border:3px solid var(--dark);border-radius:20px;padding:18px;margin-bottom:14px;text-align:left}
.tts-label{font-size:12px;font-weight:700;color:#92400e;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.tts-story{font-size:15px;line-height:1.9;color:var(--dark);font-weight:600}
.btn-tts-wrap{text-align:center}
.btn-tts{display:inline-flex;align-items:center;gap:8px;margin:0 auto 16px;padding:14px 28px;background:linear-gradient(135deg,#f59e0b,#fbbf24);border:3px solid var(--dark);border-radius:99px;font-family:'Fredoka','Noto Sans Thai',sans-serif;font-size:18px;font-weight:800;color:var(--dark);cursor:pointer;box-shadow:3px 3px 0 var(--dark);transition:all .12s}
.btn-tts:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--dark)}
.btn-tts.speaking{background:linear-gradient(135deg,#10b981,#34d399);animation:pulse-tts 1.2s ease infinite}
@keyframes pulse-tts{0%,100%{transform:scale(1)}50%{transform:translate(-1px,-1px) scale(1.03)}}

/* ── BLOCKS type ── */
.block-wrap{display:flex;justify-content:center;margin:8px 0 4px}

/* CHOICES */
.choices{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.choice-btn{border:3px solid var(--dark);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:'Fredoka','Noto Sans Thai',sans-serif;background:white;box-shadow:3px 3px 0 var(--dark);transition:all .12s;text-align:left;min-height:68px}
.choice-btn:hover:not(:disabled){background:#f5f0ff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--dark)}
.choice-btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--dark)}
.choice-btn:disabled{cursor:default}
.ch-letter{font-family:'Bungee',cursive;font-size:18px;color:#7c3aed;width:26px;flex-shrink:0;text-align:center}
.ch-em{font-size:36px;flex-shrink:0;line-height:1}
.ch-lbl{font-size:19px;font-weight:700;color:var(--dark);line-height:1.3}
.choice-btn.correct{background:#dcfce7;border-color:#22c55e;box-shadow:3px 3px 0 #22c55e;animation:pop-correct .3s ease}
.choice-btn.correct .ch-letter{color:#15803d}
.choice-btn.wrong{background:#fee2e2;border-color:#ef4444;box-shadow:3px 3px 0 #ef4444}
.choice-btn.wrong .ch-letter{color:#dc2626}
@keyframes pop-correct{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

.feedback-box{border-radius:16px;padding:16px 20px;text-align:center;font-size:20px;font-weight:700;margin-bottom:14px;min-height:64px;display:flex;align-items:center;justify-content:center}
.feedback-box.correct{background:#dcfce7;color:#15803d}
.feedback-box.wrong{background:#fef9c3;color:#92400e}
.feedback-box.idle{background:transparent;visibility:hidden}

.btn-next{width:100%;padding:18px;font-family:'Fredoka','Noto Sans Thai',sans-serif;font-size:20px;font-weight:800;border:3px solid var(--dark);border-radius:18px;background:linear-gradient(135deg,#5a56e0,#7c3aed);color:white;cursor:pointer;box-shadow:4px 4px 0 var(--dark);transition:all .12s;display:none}
.btn-next.show{display:block;animation:pop-btn .35s cubic-bezier(.34,1.56,.64,1) both}
.btn-next:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--dark)}
.btn-next:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--dark)}
@keyframes pop-btn{from{transform:scale(0)}to{transform:scale(1)}}

/* SCORE */
.score-panel{display:none}
.score-panel.show{display:block}
.score-card{background:white;border:3px solid var(--dark);border-radius:28px;padding:36px 24px;box-shadow:4px 4px 0 var(--dark);text-align:center}
.score-stars{font-size:60px;margin-bottom:16px;animation:star-pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes star-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.score-num{font-family:'Bungee',cursive;font-size:clamp(64px,20vw,96px);color:var(--dark);line-height:1}
.score-denom{font-size:28px;color:#888;font-weight:700}
.score-msg{font-size:26px;font-weight:800;color:var(--dark);margin:14px 0 6px}
.score-sub{font-size:16px;color:#7c6d88;font-weight:600}
.score-btns{display:flex;gap:12px;margin-top:26px}
.btn-retry{flex:1;padding:16px;font-family:'Fredoka','Noto Sans Thai',sans-serif;font-size:17px;font-weight:800;border:3px solid var(--dark);border-radius:16px;background:var(--yellow);color:var(--dark);cursor:pointer;box-shadow:3px 3px 0 var(--dark);transition:all .12s}
.btn-cats{flex:1;padding:16px;font-family:'Fredoka','Noto Sans Thai',sans-serif;font-size:17px;font-weight:800;border:3px solid var(--dark);border-radius:16px;background:linear-gradient(135deg,#5a56e0,#7c3aed);color:white;cursor:pointer;box-shadow:3px 3px 0 var(--dark);transition:all .12s}
.btn-retry:hover,.btn-cats:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--dark)}

.confetti-piece{position:fixed;top:-20px;pointer-events:none;z-index:999;border-radius:2px;animation:confetti-fall linear forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(900deg);opacity:0}}

/* ── DOMINO type ── */
.domino-seq-wrap{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.domino-blank{border:3px dashed #7c3aed;border-radius:10px;width:70px;height:36px;display:flex;align-items:center;justify-content:center;font-family:'Bungee',cursive;font-size:22px;color:#7c3aed;background:#faf5ff}
.domino-arrow{font-size:16px;color:#aaa;line-height:1}
.ch-domino-svg{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0}
</style>
</head>
<body>


<div class="blobs" id="blobs"></div>

<div class="page">
  <div class="home-link-wrap">
    <a class="home-link" href="index.html">← กลับหน้าหลัก</a>
  </div>

  <!-- ── CATEGORY SELECTOR ── -->
  <div id="catView">
    <div class="hero">
      <span class="hero-emoji">📝</span>
      <h1 class="hero-title">ตะลุย<br>สาธิต</h1>
      <p class="hero-sub">ฝึกแบบข้อสอบจริง ทีละชุดไปเลย! ✍️</p>
      <div class="hero-badge">SATIT DRILL · REAL PRACTICE</div>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- ── QUIZ PANEL ── -->
  <div class="quiz-panel" id="quizView">
    <div class="quiz-header">
      <button class="quiz-back" onclick="goHome()">← ชุด</button>
      <span class="quiz-cat-label" id="quizCatLabel"></span>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      <span class="progress-text" id="progText">1 / 5</span>
    </div>

    <!-- Standard question card (mcq + blocks) -->
    <div class="question-card" id="stdCard">
      <span class="q-image" id="qImage">📝</span>
      <div class="block-wrap" id="blockWrap" style="display:none"></div>
      <div class="q-text" id="qText">คำถาม</div>
      <div class="q-text-en" id="qTextEn"></div>
    </div>

    <!-- Pattern card -->
    <div class="question-card" id="patCard" style="display:none">
      <div class="q-text" id="patQText"></div>
      <div class="pat-row" id="patRow"></div>
    </div>
    <div class="pat-tiles" id="patTiles" style="display:none"></div>

    <!-- TTS card -->
    <div class="tts-card" id="ttsCard" style="display:none">
      <div class="tts-label">📖 อ่านแล้วตอบ / ฟังแล้วตอบ</div>
      <div class="tts-story" id="ttsStory"></div>
    </div>
    <div class="btn-tts-wrap" id="ttsBtnWrap" style="display:none">
      <button class="btn-tts" id="btnTTS" onclick="speakStory()">🔊 ฟังเรื่อง</button>
    </div>
    <div class="q-text" id="ttsQText" style="display:none;text-align:center;margin-bottom:14px;font-size:19px;font-weight:700;color:var(--dark)"></div>

    <!-- Shared choices -->
    <div class="choices" id="choicesGrid"></div>
    <div class="feedback-box idle" id="feedbackBox">‎</div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">ข้อถัดไป →</button>
  </div>

  <!-- ── CANVAS DRAWING PANEL ── -->
  <div id="canvasView" style="display:none">
    <div class="quiz-header">
      <button class="quiz-back" onclick="goHome()">← ชุด</button>
      <span class="quiz-cat-label">✏️ ลากเส้น</span>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="cvProgFill" style="width:0%"></div></div>
      <span class="progress-text" id="cvProgText">1 / 6</span>
    </div>
    <div class="question-card">
      <div class="q-text" id="cvInstruct">วาดรูปตามลำดับจุด 1 → 2 → ...</div>
      <div style="display:flex;justify-content:center;margin-top:12px">
        <canvas id="drawCanvas" width="280" height="220" style="border:2px dashed #c4b5fd;border-radius:14px;touch-action:none;cursor:crosshair;max-width:100%"></canvas>
      </div>
    </div>
    <div class="feedback-box idle" id="cvFeedback">‎</div>
    <button class="btn-next" id="cvNextBtn" onclick="nextDrawing()">ข้อถัดไป →</button>
  </div>

  <!-- ── SCORE PANEL ── -->
  <div class="score-panel" id="scoreView">
    <div class="score-card">
      <div class="score-stars" id="scoreStars">⭐</div>
      <div><span class="score-num" id="scoreNum">0</span><span class="score-denom"> / 5</span></div>
      <div class="score-msg" id="scoreMsg">เก่งมาก!</div>
      <div class="score-sub" id="scoreSub">ลองชุดอื่นด้วยนะ</div>
      <div class="score-btns">
        <button class="btn-retry" onclick="retryCat()">🔄 ลองใหม่</button>
        <button class="btn-cats"  onclick="goHome()">🏠 กลับไปเลือกชุด</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════
   QUESTION DATA
══════════════════════════════════════════ */
const CATS = [

/* ── CAT 0: ตรรกะและการคิด (Pattern + Number series) ── */
{
  id:0, em:'🧩', name:'คิดเร็ว', en:'Logic Sprint', cls:'cc1',
  qs:[
    // --- Pattern tap-to-fill ---
    {type:'pattern', q:'เลือกรูปภาพที่หายไปให้ถูกต้อง',
      pat:['☆','🎀','☁️','✦',null,'☁️'],
      ch:[{sym:'🎀',l:'แพรพัน',ok:true},{sym:'☁️',l:'เมฆ',ok:false},{sym:'✦',l:'ดาว',ok:false},{sym:'🚩',l:'ธง',ok:false}]
    },
    {type:'pattern', q:'เลือกรูปภาพที่หายไปให้ถูกต้อง',
      pat:['✖️','❤️','💥','🚫','✖️',null,'💥','🚫'],
      ch:[{sym:'💥',l:'ระเบิด',ok:false},{sym:'❤️',l:'หัวใจ',ok:true},{sym:'✖️',l:'กากบาท',ok:false},{sym:'🚫',l:'ห้าม',ok:false}]
    },
    {type:'pattern', q:'ลูกศรที่หายไปชี้ทิศไหน?',
      pat:['➡️','⬆️','⬇️','⬅️','➡️',null,'⬇️','⬅️'],
      ch:[{sym:'⬅️',l:'ซ้าย',ok:false},{sym:'➡️',l:'ขวา',ok:false},{sym:'⬆️',l:'ขึ้น',ok:true},{sym:'⬇️',l:'ลง',ok:false}]
    },
    {type:'pattern', q:'สัตว์ที่หายไปคือตัวไหน?',
      pat:['🦓','🐘',null,'🐍','🦓','🐘','🐸','🐍'],
      ch:[{sym:'🦓',l:'ม้าลาย',ok:false},{sym:'🐘',l:'ช้าง',ok:false},{sym:'🐸',l:'กบ',ok:true},{sym:'🐍',l:'งู',ok:false}]
    },
    {type:'pattern', q:'สีที่หายไปคืออะไร?',
      pat:['🔴','🟡','🔵','🔴',null,'🔵'],
      ch:[{sym:'🔴',l:'แดง',ok:false},{sym:'🟡',l:'เหลือง',ok:true},{sym:'🔵',l:'น้ำเงิน',ok:false},{sym:'🟢',l:'เขียว',ok:false}]
    },
    {type:'pattern', q:'รูปที่หายไปคืออะไร?',
      pat:['🌙','⭐','☀️','🌙',null,'☀️'],
      ch:[{sym:'🌙',l:'ดวงจันทร์',ok:false},{sym:'⭐',l:'ดาว',ok:true},{sym:'☀️',l:'ดวงอาทิตย์',ok:false},{sym:'🌈',l:'รุ้ง',ok:false}]
    },

/* ══════════════════════════════════════════
   ISOMETRIC BLOCK SVG
══════════════════════════════════════════ */
function drawBlocks(positions) {
  const palette=['#FF6B9D','#4ECDC4','#FFD93D','#A06CD5','#FF9F1C','#95E06C'];
  function dim(h,f){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;}
  function lit(h,f){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.min(255,Math.round(r*f))},${Math.min(255,Math.round(g*f))},${Math.min(255,Math.round(b*f))})`;}
  // Dynamic block size: scale to fill SVG based on arrangement extent
  const ixs=positions.map(p=>p.x-p.y), iys=positions.map(p=>p.x+p.y), izs=positions.map(p=>p.z);
  const ixMin=Math.min(...ixs),ixMax=Math.max(...ixs),iyMax=Math.max(...iys),izMax=Math.max(...izs);
  const S=Math.min(Math.floor(250/(ixMax-ixMin+2)),Math.floor(170/(iyMax*0.5+izMax+1.5)),34);
  const cx=155-(ixMin+ixMax)/2*S;
  const cy=100+S*(izMax-iyMax*0.5-1)/2;
  const sw=Math.max(1.5,S/11).toFixed(1);
  const sorted=[...positions].sort((a,b)=>{
    const da=a.x+a.y, db=b.x+b.y;
    if(da!==db) return db-da;
    if(a.y!==b.y) return b.y-a.y;
    return a.z-b.z;
  });
  let paths='';
  sorted.forEach(({x,y,z},i)=>{
    const base=palette[(x+y*3)%palette.length];
    const sx=cx+(x-y)*S, sy=cy+(x+y)*S*0.5-z*S;
    const T=[[sx,sy-S*0.5],[sx+S,sy],[sx,sy+S*0.5],[sx-S,sy]];
    const L=[[sx-S,sy],[sx,sy+S*0.5],[sx,sy+S*0.5+S],[sx-S,sy+S]];
    const R=[[sx,sy+S*0.5],[sx+S,sy],[sx+S,sy+S],[sx,sy+S*0.5+S]];
    const p=arr=>arr.map(([a,b])=>`${Math.round(a)},${Math.round(b)}`).join(' ');
    const SK=`stroke="#111827" stroke-width="${sw}" stroke-linejoin="round"`;
    paths+=`<polygon points="${p(T)}" fill="${lit(base,1.15)}" ${SK}/>`;
    paths+=`<polygon points="${p(L)}" fill="${dim(base,0.75)}" ${SK}/>`;
    paths+=`<polygon points="${p(R)}" fill="${base}" ${SK}/>`;
  });
  return `<svg viewBox="0 0 310 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:300px">${paths}</svg>`;
}

function shuffle(arr){

  return a;
}

   BUILD CATEGORY GRID
══════════════════════════════════════════ */
function buildCatGrid(){
  const grid=document.getElementById('catGrid');
  grid.innerHTML='';
  const countTypes=(qs)=>{
    const counts={mcq:0,pattern:0,blocks:0,tts:0,domino:0,cubenet:0};
    qs.forEach(q=>{
      if(q.type==='pattern') counts.pattern++;
      else if(q.type==='blocks') counts.blocks++;
      else if(q.type==='tts') counts.tts++;
      else if(q.type==='domino'||q.type==='domino-seq') counts.domino++;
      else if(q.type==='cubenet') counts.cubenet++;
      else counts.mcq++;
    });
    return counts;
  };
  const catCountLabel=(best,qs)=>{
    const total=qs.length;
    const c=countTypes(qs);
    const parts=[`รวม ${total} ข้อ`];
    if(c.mcq) parts.push(`ตัวเลือก ${c.mcq}`);
    if(c.pattern) parts.push(`แพทเทิร์น ${c.pattern}`);
    if(c.blocks) parts.push(`บล็อก ${c.blocks}`);
    if(c.domino) parts.push(`โดมิโน ${c.domino}`);
    if(c.cubenet) parts.push(`คลี่ลูกเต๋า ${c.cubenet}`);
    if(c.tts) parts.push(`ฟัง ${c.tts}`);
    const base=parts.join(' · ');
    return (best!=null)?`⭐ ${best} / 5 · ${base}`:base;
  };
  CATS.forEach((cat,i)=>{
    const btn=document.createElement('button');
    const best=bestScores[i];
    btn.className='cat-btn '+cat.cls+(best!=null?' done':'');
    btn.innerHTML=`<span class="cat-em">${cat.em}</span><div class="cat-name">${cat.name}</div><div class="cat-en">${cat.en}</div><div class="cat-score">${catCountLabel(best,cat.qs)}</div>`;
    btn.onclick=()=>startCat(i);
    grid.appendChild(btn);
  });
  // Canvas drawing button (ทักษะมือ)
  const cvBtn=document.createElement('button');
  cvBtn.className='cat-btn cc2';
  cvBtn.innerHTML=`<span class="cat-em">✏️</span><div class="cat-name">ลากเส้น</div><div class="cat-en">Drawing</div><div class="cat-score">8 แบบ — ลากตามจุด</div>`;
  cvBtn.onclick=startCanvas;
  grid.appendChild(cvBtn);
}

/* ══════════════════════════════════════════
   DOMINO SVG + RENDERING
══════════════════════════════════════════ */
const DOT_POS={
  0:[],
  1:[[0.5,0.5]],
  2:[[0.75,0.25],[0.25,0.75]],
  3:[[0.75,0.25],[0.5,0.5],[0.25,0.75]],
  4:[[0.25,0.25],[0.75,0.25],[0.25,0.75],[0.75,0.75]],
  5:[[0.25,0.25],[0.75,0.25],[0.5,0.5],[0.25,0.75],[0.75,0.75]],
  6:[[0.25,0.25],[0.75,0.25],[0.25,0.5],[0.75,0.5],[0.25,0.75],[0.75,0.75]],
};
function makeDominoSVG(left,right,w,h){
  const halfW=w/2,R=Math.max(4,Math.round(h*0.14));
  const dotR=Math.max(2.5,h*0.1);
  const pad=Math.round(h*0.17);
  const cW=halfW-pad*2,cH=h-pad*2;
  function half(n,ox){
    return(DOT_POS[n]||[]).map(([fx,fy])=>{
      const cx=(ox+pad+fx*cW).toFixed(1);
      const cy=(pad+fy*cH).toFixed(1);
      return`<circle cx="${cx}" cy="${cy}" r="${dotR.toFixed(1)}" fill="#2d3047"/>`;
    }).join('');
  }
  return`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:${w}px;height:${h}px;display:block">
    <rect width="${w}" height="${h}" rx="${R}" ry="${R}" fill="#fffef0" stroke="#2d3047" stroke-width="2.5"/>
    <line x1="${halfW}" y1="${R}" x2="${halfW}" y2="${h-R}" stroke="#2d3047" stroke-width="1.8"/>
    ${half(left,0)}${half(right,halfW)}</svg>`;
}

function renderDomino(q){
  const card=document.getElementById('stdCard');
  card.style.display='';
  const imgEl=document.getElementById('qImage');
  imgEl.className='q-image visible';
  imgEl.style.fontSize='0';
  if(window.Satit3D){   // 3D domino; after answering the dots are counted one by one (see bottom of file)
    imgEl.className='q-image';
    const bw=document.getElementById('blockWrap'); bw.style.display='flex';
    Satit3D.domino(bw,q.left,q.right);
  } else imgEl.innerHTML=`<div style="display:flex;justify-content:center">${makeDominoSVG(q.left,q.right,160,82)}</div>`;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qTextEn').textContent=q.en||'';
  buildMCQChoices(q.ch);
}

function renderDominoSeq(q){

  document.getElementById('qText').textContent=q.q;

/* ══════════════════════════════════════════
   CUBE NET SVG + RENDERING
══════════════════════════════════════════ */
const FACE_CLR={red:'#ef4444',blue:'#3b82f6',green:'#16a34a',yellow:'#fbbf24',purple:'#7c3aed',pink:'#f472b6'};
function drawCubeNet(layout,hl){
  const CS=46;
  const rows=layout.length;
  const cols=Math.max(...layout.map(r=>r.length));
  let cells='';
  layout.forEach((row,ri)=>{
    row.forEach((face,ci)=>{
      if(!face)return;
      const x=ci*CS,y=ri*CS;
      const isHL=face===hl;
      const fill=FACE_CLR[face]||'#ccc';
      cells+=`<rect x="${x+1}" y="${y+1}" width="${CS-2}" height="${CS-2}" fill="${fill}" stroke="${isHL?'#000':'#555'}" stroke-width="${isHL?3.5:1.5}" rx="5"/>`;
      if(isHL)cells+=`<text x="${x+CS/2}" y="${y+CS/2+8}" text-anchor="middle" font-size="24" fill="white" font-weight="bold">★</text>`;
    });
  });
  const W=cols*CS,H=rows*CS;
  return`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:${Math.min(W*1.3,260)}px;height:auto;display:block">${cells}</svg>`;
}
function renderCubeNet(q){
  const card=document.getElementById('stdCard');
  card.style.display='';
  const imgEl=document.getElementById('qImage');
  imgEl.className='q-image visible';
  imgEl.style.fontSize='0';
  if(window.Satit3D){   // 3D net that can fold into a box (see bottom of file)
    imgEl.className='q-image';
    const bw=document.getElementById('blockWrap');
    bw.style.display='flex';
    Satit3D.cubenet(bw,q.layout,q.hl);
  } else imgEl.innerHTML=`<div style="display:flex;justify-content:center">${drawCubeNet(q.layout,q.hl)}</div>`;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qTextEn').textContent=q.en||'';
  buildMCQChoices(q.ch);
}

function launchConfetti(){
  const cols=['#FF6B9D','#FFD93D','#7c3aed','#4ECDC4','#a78bfa','#FF9F1C','#6366f1','#f43f5e'];
  for(let i=0;i<70;i++){

const DRAWINGS=[
  {name:'สามเหลี่ยม',em:'🔺',dots:[{x:140,y:30},{x:252,y:192},{x:28,y:192}],closed:true},
  {name:'บ้าน',em:'🏠',dots:[{x:30,y:192},{x:30,y:100},{x:140,y:28},{x:250,y:100},{x:250,y:192}],closed:true},
  {name:'สี่เหลี่ยม',em:'⬜',dots:[{x:38,y:38},{x:242,y:38},{x:242,y:182},{x:38,y:182}],closed:true},
  {name:'เพชร',em:'💎',dots:[{x:140,y:20},{x:255,y:110},{x:140,y:200},{x:25,y:110}],closed:true},
  {name:'บันได',em:'🪜',dots:[{x:28,y:195},{x:28,y:138},{x:95,y:138},{x:95,y:82},{x:162,y:82},{x:162,y:26},{x:228,y:26}],closed:false},

  {name:'ดาว',em:'⭐',dots:[{x:140,y:25},{x:192,y:184},{x:56,y:86},{x:224,y:86},{x:88,y:184}],closed:true},
  {name:'ลูกศร',em:'➡️',dots:[{x:30,y:90},{x:170,y:90},{x:170,y:60},{x:250,y:110},{x:170,y:160},{x:170,y:130},{x:30,y:130}],closed:true},
];
let cvIdx=0,cvCollected=0,cvAnswered=false;

function startCanvas(){
  cvIdx=0;
  showView('canvas');
  renderDrawing();
}

function renderDrawing(){
  const d=DRAWINGS[cvIdx];
  document.getElementById('cvProgFill').style.width=(cvIdx/DRAWINGS.length*100)+'%';
  document.getElementById('cvProgText').textContent=(cvIdx+1)+' / '+DRAWINGS.length;
  document.getElementById('cvInstruct').textContent='วาดรูป'+d.name+' — ลากเส้นผ่านจุด 1→2→3... ตามลำดับ';
  document.getElementById('cvFeedback').className='feedback-box idle';
  document.getElementById('cvFeedback').textContent='‎';
  document.getElementById('cvNextBtn').className='btn-next';
  cvCollected=0; cvAnswered=false;
  setupCanvasEvents(d);
}

function drawState(d,collected){
  const c=document.getElementById('drawCanvas');
  const g=c.getContext('2d');
  c.width=c.width; // clear
  // Draw completed path
  if(collected>1){
    g.strokeStyle='#7c3aed'; g.lineWidth=4; g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    g.moveTo(d.dots[0].x,d.dots[0].y);
    for(let i=1;i<collected;i++) g.lineTo(d.dots[i].x,d.dots[i].y);
    if(collected===d.dots.length&&d.closed) g.closePath();
    g.stroke();
  }
  // Draw dots
  d.dots.forEach((pt,i)=>{
    const done=i<collected;
    g.beginPath(); g.arc(pt.x,pt.y,18,0,Math.PI*2);
    g.fillStyle=done?'#22c55e':'#7c3aed'; g.fill();
    g.strokeStyle='white'; g.lineWidth=2.5; g.stroke();
    g.fillStyle='white';
    g.font='bold 13px Fredoka,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(done?'✓':(i+1),pt.x,pt.y);
  });
}

function setupCanvasEvents(d){
  // Replace canvas to remove old listeners
  const old=document.getElementById('drawCanvas');
  const nc=old.cloneNode(false);
  old.parentNode.replaceChild(nc,old);
  const c=document.getElementById('drawCanvas');
  let pressing=false;
  const HIT=30;
  function getPos(e){
    const r=c.getBoundingClientRect();
    const sx=c.width/r.width, sy=c.height/r.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
  }
  function check(pos){
    if(cvAnswered)return;
    const pt=d.dots[cvCollected];
    if(!pt)return;
    const dx=pos.x-pt.x,dy=pos.y-pt.y;
    if(Math.sqrt(dx*dx+dy*dy)<HIT){
      cvCollected++;
      drawState(d,cvCollected);
      if(cvCollected===d.dots.length){
        cvAnswered=true;
        const fb=document.getElementById('cvFeedback');
        fb.className='feedback-box correct'; fb.textContent=rand(PRAISE);
        const nb=document.getElementById('cvNextBtn');
        nb.textContent=cvIdx+1<DRAWINGS.length?'ข้อถัดไป →':'จบแล้ว! 🏆';
        nb.className='btn-next show';
      }
    }
  }
  if(window.Satit3D){   // 3D board: Satit3D turns taps/drags into the same {x,y} dot coordinates
    c.style.display='none';
    Satit3D.drawing(c.parentNode,d,check);
    return;
  }
  c.addEventListener('mousedown',e=>{pressing=true;check(getPos(e));});
  c.addEventListener('mousemove',e=>{if(pressing)check(getPos(e));});
  c.addEventListener('mouseup',()=>pressing=false);
  c.addEventListener('touchstart',e=>{e.preventDefault();pressing=true;check(getPos(e));},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(pressing)check(getPos(e));},{passive:false});
  c.addEventListener('touchend',()=>pressing=false);
  drawState(d,0);
}

function nextDrawing(){
  cvIdx++;
  if(cvIdx>=DRAWINGS.length){goHome();return;}
  renderDrawing();
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const kit = WorldKit(THREE, OrbitControls);

// One renderer, reused for every question (moved into whichever box shows the question)
const wrap = document.createElement('div'); wrap.className = 's3d';
const canvas = document.createElement('canvas'); wrap.appendChild(canvas);
const hint = document.createElement('div'); hint.className = 's3d-hint'; hint.textContent = '👆 ลากหมุนดูได้'; wrap.appendChild(hint);
const countEl = document.createElement('div'); countEl.className = 's3d-count'; wrap.appendChild(countEl);
const foldBtn = document.createElement('button'); foldBtn.className = 's3d-btn'; wrap.appendChild(foldBtn);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4d6, 0xb0a080, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 12, 8); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, 1, .1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enablePan = false; controls.enableDamping = true; controls.enableZoom = false;
controls.minPolarAngle = .2; controls.maxPolarAngle = 1.5;
controls.autoRotateSpeed = 1.2;
controls.addEventListener('start', () => { controls.autoRotate = false; hint.style.opacity = 0; });
const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 40), new THREE.MeshLambertMaterial({ color: '#cfe9b0' }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);

let root = null, mode = null, cubes = [], counting = null, net = null, dom = null;
function reset(el) {
  if (root) scene.remove(root);
  root = new THREE.Group(); scene.add(root);
  cubes = []; counting = null; net = null; dom = null;
  controls.minAzimuthAngle = -Infinity; controls.maxAzimuthAngle = Infinity;
  countEl.textContent = ''; foldBtn.style.display = 'none'; hint.style.opacity = 1;
  el.innerHTML = ''; el.appendChild(wrap);
  const w = wrap.clientWidth || 340, h = wrap.clientHeight || 270;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  controls.autoRotate = true;
}
// Point the camera at the shape; wantDist is eased toward in the loop (so folding can zoom in)
let wantDist = 10;
function frame(size, height, topDown = false) {
  wantDist = Math.max(size, height, 2) * 1.75 + 2.2;
  const dir = topDown ? new THREE.Vector3(.35, 1, .75) : new THREE.Vector3(.7, .62, .8);
  camera.position.copy(dir.normalize().multiplyScalar(wantDist)).add(new THREE.Vector3(0, height / 2, 0));
  controls.target.set(0, height / 2, 0);
  controls.update();
}

/* ── Blocks ── */
const PALETTE = ['#FF6B9D', '#4ECDC4', '#FFD93D', '#A06CD5', '#FF9F1C', '#95E06C'];
const cubeGeo = new THREE.BoxGeometry(.96, .96, .96);
const edgeGeo = new THREE.EdgesGeometry(cubeGeo);
function blocks(el, pos) {
  reset(el); mode = 'blocks';
  const xs = pos.map(p => p.x), ys = pos.map(p => p.y), zs = pos.map(p => p.z);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...ys) + Math.max(...ys)) / 2;
  pos.forEach(p => {
    const m = new THREE.Mesh(cubeGeo, new THREE.MeshLambertMaterial({ color: PALETTE[(p.x + p.y * 3) % PALETTE.length] }));
    m.position.set(p.x - cx, p.z + .5, p.y - cz);
    m.castShadow = m.receiveShadow = true;
    m.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: '#111827' })));
    root.add(m);
    cubes.push({ m, p, y0: m.position.y });
  });
  const size = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) + 1;
  frame(size, Math.max(...zs) + 1);
}
// After answering: light the blocks up one by one, bottom layer first, with a number on each
function countUp() {
  const order = [...cubes].sort((a, b) => a.p.z - b.p.z || a.p.y - b.p.y || a.p.x - b.p.x);
  counting = { order, i: 0, t: .3 };
  controls.autoRotate = true;
}
function numberSprite(n) {
  const s = kit.labelSprite(String(n), .5); s.position.y = .8; return s;
}

/* ── Cube net ── */
const FACE = { red: '#ef4444', blue: '#3b82f6', green: '#16a34a', yellow: '#fbbf24', purple: '#7c3aed', pink: '#f472b6' };
const starTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.font = '900 96px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('★', 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const tileGeo = new THREE.BoxGeometry(.98, .06, .98);
function tile(color, star) {
  const base = new THREE.MeshLambertMaterial({ color: FACE[color] || '#ccc' });
  const mats = [base, base, base, base, base, base];
  const m = new THREE.Mesh(tileGeo, mats); m.castShadow = true;
  if (star) {   // ★ on both sides so it shows on the outside of the folded cube too
    [.035, -.035].forEach(y => {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(.8, .8), new THREE.MeshBasicMaterial({ map: starTex, transparent: true }));
      s.rotation.x = y > 0 ? -Math.PI / 2 : Math.PI / 2; s.position.y = y; m.add(s);
    });
  }
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(tileGeo), new THREE.LineBasicMaterial({ color: '#334155' })));
  return m;
}
function cubenet(el, layout, hl) {
  reset(el); mode = 'net';
  // cells of the net; the hinge tree grows from the first cell of the middle row
  const cells = [];
  layout.forEach((row, r) => row.forEach((c, k) => { if (c) cells.push({ r, k, c }); }));
  const at = (r, k) => cells.find(x => x.r === r && x.k === k);
  const start = cells.find(x => x.r === 1) || cells[0];
  const rs = cells.map(x => x.r), ks = cells.map(x => x.k);
  const midR = (Math.min(...rs) + Math.max(...rs)) / 2, midK = (Math.min(...ks) + Math.max(...ks)) / 2;
  const holder = new THREE.Group();   // centres the flat net; moved to the cube centre when folded
  holder.position.set(start.k - midK, .05, start.r - midR);
  root.add(holder);
  start.node = new THREE.Group(); holder.add(start.node);
  start.node.add(tile(start.c, start.c === hl));
  const hinges = [], seen = new Set([start]), queue = [start];
  while (queue.length) {
    const p = queue.shift();
    [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dr, dk]) => {
      const c = at(p.r + dr, p.k + dk);
      if (!c || seen.has(c)) return;
      seen.add(c); queue.push(c);
      const pivot = new THREE.Group(); pivot.position.set(dk * .5, 0, dr * .5);   // on the shared edge
      p.node.add(pivot);
      c.node = new THREE.Group(); c.node.position.set(dk * .5, 0, dr * .5); pivot.add(c.node);
      c.node.add(tile(c.c, c.c === hl));
      // folding = turning 90° about the shared edge so the face swings up
      hinges.push({ pivot, axis: dk ? 'z' : 'x', sign: dk ? dk : -dr });
    });
  }
  net = { hinges, holder, flat: holder.position.clone(), folded: false, t: 0, hl, cells };
  foldBtn.textContent = '📦 พับกล่อง';   // the button appears after answering (no peeking first)
  frame(Math.max(Math.max(...ks) - Math.min(...ks), Math.max(...rs) - Math.min(...rs)) * .8 + 1, 0, true);   // look down on the flat net
  net.flatDist = wantDist;
  controls.autoRotate = false;
}
function toggleFold() {
  if (!net) return;
  net.folded = !net.folded;
  foldBtn.textContent = net.folded ? '📄 คลี่ออก' : '📦 พับกล่อง';
  wantDist = net.folded ? 4.2 : net.flatDist;   // zoom in on the little box
  controls.target.set(0, net.folded ? .5 : 0, 0);
  kit.tones(net.folded ? [392, 523] : [523, 392], .08, 'triangle', .12);
  controls.autoRotate = net.folded;
}
foldBtn.onclick = toggleFold;

function explain(q) {
  if (q.type === 'blocks' && mode === 'blocks') countUp();
  if (q.type === 'domino' && mode === 'domino' && !dom.steps) explainDomino(q);
  if (q.type === 'domino-seq' && mode === 'dominoSeq' && !dom.drop && dom.wave < 0) explainDominoSeq(q);
  if (q.type === 'cubenet' && mode === 'net') { foldBtn.style.display = ''; if (!net.folded) setTimeout(toggleFold, 600); }
}



/* ── Dominoes ──
   A domino stands on its long edge facing us: left half = left dots, right half = right dots.
   domino(el, L, R)    : one domino; explain() counts its dots 1,2,3… and shows the sum
   dominoSeq(el, seq)  : a row of dominoes + an empty "?" spot; explain() drops the answer in */
const PIP_SPOTS = {   // dot positions inside one half (-1..1), like a real domino
  1: [[0, 0]], 2: [[-1, 1], [1, -1]], 3: [[-1, 1], [0, 0], [1, -1]],
  4: [[-1, 1], [1, 1], [-1, -1], [1, -1]], 5: [[-1, 1], [1, 1], [0, 0], [-1, -1], [1, -1]],
  6: [[-1, 1], [0, 1], [1, 1], [-1, -1], [0, -1], [1, -1]],
};
const pipGeo = new THREE.CylinderGeometry(.1, .1, .05, 18);
const domBodyGeo = new THREE.BoxGeometry(2, 1, .3);
function makeDomino(L, R, ghost = false) {
  const g = new THREE.Group(), pips = { L: [], R: [] };
  const body = new THREE.Mesh(domBodyGeo, ghost
    ? new THREE.MeshBasicMaterial({ color: '#c4b5fd', transparent: true, opacity: .35 })
    : new THREE.MeshLambertMaterial({ color: '#fffaf0', emissive: '#6b6358' }));   // emissive keeps the face ivory, not grey
  body.castShadow = !ghost; g.add(body);
  body.add(new THREE.LineSegments(new THREE.EdgesGeometry(domBodyGeo), new THREE.LineBasicMaterial({ color: ghost ? '#7c3aed' : '#94a3b8' })));
  if (ghost) { const q = kit.labelSprite('?', .6); q.position.z = .2; g.add(q); return { g, pips }; }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(.05, .8, .02), new THREE.MeshBasicMaterial({ color: '#475569' }));
  bar.position.z = .155; g.add(bar);
  [['L', L, -.5], ['R', R, .5]].forEach(([side, n, cx]) => (PIP_SPOTS[n] || []).forEach(([px, py]) => {
    const m = new THREE.Mesh(pipGeo, new THREE.MeshLambertMaterial({ color: '#1f2937' }));
    m.rotation.x = Math.PI / 2; m.position.set(cx + px * .25, py * .25, .16);
    g.add(m); pips[side].push(m);
  }));
  return { g, pips };
}
// camera straight in front, far enough back that a row `width` wide fits
function frontView(width, centerY) {
  const vf = camera.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const dist = Math.max((width / 2 + .25) / Math.tan(hf), 1.3 / Math.tan(vf));
  camera.position.set(0, centerY + dist * .22, dist);
  controls.target.set(0, centerY, 0); controls.update();
  wantDist = camera.position.distanceTo(controls.target);
  controls.autoRotate = false;
  controls.minAzimuthAngle = -.8; controls.maxAzimuthAngle = .8;   // can peek around, never loses the face
}
function domino(el, L, R) {
  reset(el); mode = 'domino';
  const d = makeDomino(L, R); d.g.position.y = .55; d.g.rotation.x = -.12; root.add(d.g);
  dom = { L, R, d, steps: null };
  frontView(2.6, .6);
}
function dominoSeq(el, seq) {
  reset(el); mode = 'dominoSeq';
  const n = seq.length + 1, gap = 1.75, x0 = -(n - 1) * gap / 2, list = [];
  seq.forEach(([a, b], i) => {
    const d = makeDomino(a, b); d.g.scale.setScalar(.8);
    d.g.position.set(x0 + i * gap, .45, 0); root.add(d.g); list.push(d);
  });
  const ghost = makeDomino(0, 0, true); ghost.g.scale.setScalar(.8);
  ghost.g.position.set(x0 + seq.length * gap, .45, 0); root.add(ghost.g);
  dom = { seq, list, ghost, gap, x0, drop: null, wave: -1 };
  frontView((n - 1) * gap + 1.7, .5);
}
const PIP_ON = new THREE.Color('#f59e0b');
function explainDomino(q) {
  const { L, R, d } = dom;
  const total = q.q.includes('รวม'), diff = !total && q.q.includes('กี่แต้ม');
  // total: keep counting across both halves; otherwise each side is counted on its own
  const steps = [...d.pips.L.map((m, i) => ({ m, n: i + 1 })), ...d.pips.R.map((m, i) => ({ m, n: total ? L + i + 1 : i + 1 }))];
  const sign = L > R ? '>' : L < R ? '<' : '=';
  const shown = total ? `${L}+${R}=${L + R}` : diff ? `${L}−${R}=${L - R}` : `${L} ${sign} ${R}`;
  const said = total ? `${L} บวก ${R} เท่ากับ ${L + R}` : diff ? `${L} ลบ ${R} เท่ากับ ${L - R}`
    : L > R ? `ซ้าย ${L} ขวา ${R} ด้านซ้ายมากกว่า` : L < R ? `ซ้าย ${L} ขวา ${R} ด้านขวามากกว่า` : `ซ้าย ${L} ขวา ${R} เท่ากัน`;
  dom.steps = { list: steps, i: 0, t: .3, done() { countEl.textContent = shown; setTimeout(() => kit.speak(said), 250); } };
}
function explainDominoSeq(q) {
  const ok = q.ch.find(c => c.ok);
  const d = makeDomino(ok.left, ok.right); d.g.scale.setScalar(.8);
  d.g.position.set(dom.ghost.g.position.x, 4, 0); root.add(d.g);
  dom.drop = { d, v: 0 };
  // a small "a|b" tag over each domino shows the pattern
  [...dom.seq, [ok.left, ok.right]].forEach(([a, b], i) => {
    const tag = kit.labelSprite(`${a} | ${b}`, .42); tag.position.set(dom.x0 + i * dom.gap, 1.35, 0); root.add(tag);
  });
}
function dominoTick(dt, time) {
  if (!dom) return;
  const st = dom.steps;   // (single domino) dots still to count
  if (st && st.i < st.list.length) {
    st.t -= dt;
    if (st.t <= 0) {
      const { m, n } = st.list[st.i++];
      m.material.color.copy(PIP_ON); m.scale.set(1.3, 1, 1.3);
      const tag = kit.labelSprite(String(n), .3); tag.position.set(m.position.x, m.position.y + .22, .3); dom.d.g.add(tag);
      countEl.textContent = n;
      kit.tones([400 + n * 40], .03, 'triangle', .1);
      st.t = .4;
      if (st.i === st.list.length) st.done();
    }
  }
  if (dom.drop) {   // answer domino falls into the "?" spot with a little bounce, then the row does a wave
    const p = dom.drop.d.g.position;
    dom.drop.v -= 18 * dt; p.y += dom.drop.v * dt;
    if (p.y <= .45) {
      p.y = .45;
      if (dom.drop.v < -2) { dom.drop.v *= -.3; kit.tones([330], .03, 'square', .08); }
      else { dom.drop = null; dom.ghost.g.visible = false; dom.wave = 0; kit.tones([523, 659, 784], .08); }
    }
  }
  if (dom.wave >= 0) {
    dom.wave += dt;
    root.children.forEach(c => {
      if (!c.isGroup) return;
      const i = Math.round((c.position.x - dom.x0) / dom.gap), k = dom.wave * 5 - i;
      c.position.y = .45 + (k > 0 && k < Math.PI ? Math.sin(k) * .35 : 0);
    });
    if (dom.wave > 2.5) dom.wave = -1;
  }
}

/* ── ✏️ Connect-the-dots on a 3D board ──
   Same dot data as DRAWINGS (280×220 picture coordinates, 28 px = 1 unit).
   Summer runs to each dot you reach; a line of blocks follows.
   When the picture is done it stands up and becomes a 3D object. */
const dw = document.createElement('div'); dw.className = 's3d'; dw.style.height = '300px';
const dCanvas = document.createElement('canvas'); dw.appendChild(dCanvas);
const dHint = document.createElement('div'); dHint.className = 's3d-hint'; dHint.textContent = '✏️ ลากนิ้วผ่านจุด 1 → 2 → 3'; dw.appendChild(dHint);
const dRenderer = new THREE.WebGLRenderer({ canvas: dCanvas, antialias: true, alpha: true });
dRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
dRenderer.shadowMap.enabled = true;
const dScene = new THREE.Scene();
dScene.add(new THREE.HemisphereLight(0xfff4d6, 0xb0a080, 1.3));
const dSun = new THREE.DirectionalLight(0xffffff, 1.5);
dSun.position.set(4, 14, 8); dSun.castShadow = true;
Object.assign(dSun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
dScene.add(dSun);
const dCam = new THREE.PerspectiveCamera(40, 1, .1, 100);
const PX = 28;
const toWorld = (p, y = 0) => new THREE.Vector3((p.x - 140) / PX, y, (p.y - 110) / PX);
// board (fixed camera: dragging draws, it doesn't turn the view)
const board = new THREE.Group(); dScene.add(board);
const boardTop = new THREE.Mesh(new THREE.BoxGeometry(11, .3, 8.8), new THREE.MeshLambertMaterial({ color: '#fffdf5' }));
boardTop.position.y = -.15; boardTop.receiveShadow = true; board.add(boardTop);
const boardEdge = new THREE.Mesh(new THREE.BoxGeometry(11.6, .3, 9.4), new THREE.MeshLambertMaterial({ color: '#c4b5fd' }));
boardEdge.position.y = -.3; board.add(boardEdge);
const grass = new THREE.Mesh(new THREE.BoxGeometry(16, .4, 13), new THREE.MeshLambertMaterial({ color: '#a3d97a' }));
grass.position.y = -.65; grass.receiveShadow = true; board.add(grass);
const drawPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const dSummer = kit.makeSummer(); dSummer.g.scale.setScalar(.55); dScene.add(dSummer.g);

let D = null;   // current drawing state
let dCamTop = null;   // overhead camera for drawing; it swings to the front when the picture is done
function clearDrawing() {
  if (!D) return;
  [D.dotsG, D.pathG, D.trophy].forEach(g => g && dScene.remove(g));
  D = null;
}
function drawing(holder, d, check) {
  clearDrawing();
  holder.querySelectorAll('.s3d').forEach(el => el.remove());
  holder.appendChild(dw);
  const w = dw.clientWidth || 340, h = dw.clientHeight || 300;
  dRenderer.setSize(w, h, false); dCam.aspect = w / h;
  // portrait boxes need the camera further back to fit the board
  const dist = w < h * 1.1 ? 15 : 12;
  dCam.position.set(0, dist * .85, dist * .62); dCam.lookAt(0, -.4, .4); dCam.updateProjectionMatrix();
  dCamTop = { pos: dCam.position.clone(), look: new THREE.Vector3(0, -.4, .4), dist };
  dHint.style.opacity = 1;
  D = { d, check, shown: 0, dotsG: new THREE.Group(), pathG: new THREE.Group(), trophy: null, doneT: -1, posts: [], summerTo: null };
  d.dots.forEach((p, i) => {
    const post = new THREE.Group();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(.32, .36, .4, 20), new THREE.MeshLambertMaterial({ color: '#e9d5ff' }));
    m.position.y = .2; m.castShadow = true; post.add(m);
    const l = kit.labelSprite(String(i + 1), .55); l.position.y = 1; post.add(l);
    post.position.copy(toWorld(p));
    D.dotsG.add(post); D.posts.push({ post, m });
  });
  dScene.add(D.dotsG, D.pathG);
  dSummer.g.position.copy(toWorld(d.dots[0])).add(new THREE.Vector3(-.6, 0, .6));
  dSummer.g.rotation.y = 0; dSummer.g.visible = true;
  D.summerTo = dSummer.g.position.clone();
}
// pointer → board point → picture coordinates → page's check()
const dRay = new THREE.Raycaster(), dNdc = new THREE.Vector2(), hitPt = new THREE.Vector3();
let drawing_ = false;
function feed(e) {
  if (!D) return;
  const r = dCanvas.getBoundingClientRect();
  dNdc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  dRay.setFromCamera(dNdc, dCam);
  if (!dRay.ray.intersectPlane(drawPlane, hitPt)) return;
  D.check({ x: hitPt.x * PX + 140, y: hitPt.z * PX + 110 });
  if (Math.random() < .5) sparkle(hitPt);
}
dCanvas.style.touchAction = 'none';
dCanvas.addEventListener('pointerdown', e => { drawing_ = true; dCanvas.setPointerCapture(e.pointerId); dHint.style.opacity = 0; feed(e); });
dCanvas.addEventListener('pointermove', e => { if (drawing_) feed(e); });
['pointerup', 'pointercancel'].forEach(ev => dCanvas.addEventListener(ev, () => { drawing_ = false; }));

const sparks = [];
function sparkle(p) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(.12, .12, .12), new THREE.MeshBasicMaterial({ color: ['#fbbf24', '#f472b6', '#a78bfa'][Math.floor(Math.random() * 3)] }));
  m.position.copy(p).add(new THREE.Vector3(0, .2, 0)); dScene.add(m);
  sparks.push({ m, life: .5, vy: 1.5 + Math.random() });
}
const PATH_MAT = new THREE.MeshLambertMaterial({ color: '#7c3aed' });
function segment(parent, a, b, height, depth, mat, flat = true) {
  // a block bar from a to b (flat on the board, or standing in the XY plane for the trophy)
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len + depth * .5, height, depth), mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  if (flat) m.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
  else m.rotation.z = Math.atan2(b.y - a.y, b.x - a.x);
  m.castShadow = true; parent.add(m);
  return m;
}
// does the closed outline cross itself? (the star does → build it from bars instead)
function selfCrossing(pts) {
  const n = pts.length, cross = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
    if (i === 0 && j === n - 1) continue;
    const a = pts[i], b = pts[(i + 1) % n], c = pts[j], e = pts[(j + 1) % n];
    if (cross(a, b, c) * cross(a, b, e) < 0 && cross(c, e, a) * cross(c, e, b) < 0) return true;
  }
  return false;
}
const TROPHY_COLORS = ['#f472b6', '#f59e0b', '#3b82f6', '#22c55e', '#a855f7', '#ef4444', '#fbbf24', '#06b6d4'];
function buildTrophy(d) {
  // picture coordinates → standing XY plane (picture "up" = world up)
  const pts = d.dots.map(p => new THREE.Vector2((p.x - 140) / PX, -(p.y - 110) / PX));
  const mat = new THREE.MeshLambertMaterial({ color: TROPHY_COLORS[DRAWINGS.indexOf(d) % TROPHY_COLORS.length] });
  const g = new THREE.Group();
  if (d.closed && !selfCrossing(pts)) {
    const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: .9, bevelEnabled: true, bevelSize: .08, bevelThickness: .08, bevelSegments: 1 });
    geo.translate(0, 0, -.45);
    const m = new THREE.Mesh(geo, mat); m.castShadow = true; g.add(m);
  } else {
    const v = pts.map(p => new THREE.Vector3(p.x, p.y, 0));
    const n = d.closed ? v.length : v.length - 1;
    for (let i = 0; i < n; i++) segment(g, v[i], v[(i + 1) % v.length], .45, .9, mat, false);
    v.forEach(p => { const c = new THREE.Mesh(new THREE.BoxGeometry(.55, .55, .95), mat); c.position.copy(p); g.add(c); });
  }
  // centre it so it spins around its middle
  const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3());
  g.children.forEach(ch => ch.position.sub(c));
  // shrink so the standing picture fits the camera view (about 3.4 units at its biggest)
  const size = box.getSize(new THREE.Vector3()), k = Math.min(1, 3.4 / Math.max(size.x, size.y));
  const holder = new THREE.Group(); holder.add(g); holder.scale.setScalar(k);
  holder.position.z = .6;
  holder.userData.half = size.y * k / 2;
  return holder;
}

function drawTick(dt, time) {
  if (!D || !dw.isConnected || dw.offsetParent === null) return;
  const d = D.d, got = typeof cvCollected === 'number' ? cvCollected : 0;   // cvCollected lives in the page script
  while (D.shown < got) {
    const i = D.shown++;
    D.posts[i].m.material.color.set('#7c3aed');
    if (i > 0) segment(D.pathG, toWorld(d.dots[i - 1], .15), toWorld(d.dots[i], .15), .22, .26, PATH_MAT);
    kit.tones([500 + i * 60], .04, 'triangle', .1);
    D.summerTo = toWorld(d.dots[i]).add(new THREE.Vector3(0, .4, 0));
    if (D.shown === d.dots.length) {
      if (d.closed) segment(D.pathG, toWorld(d.dots[i], .15), toWorld(d.dots[0], .15), .22, .26, PATH_MAT);
      D.doneT = 0;
    }
  }
  // the next dot to reach pulses
  D.posts.forEach((p, i) => { p.post.scale.setScalar(i === D.shown && D.doneT < 0 ? 1 + Math.sin(time * 6) * .15 : 1); });
  // Summer hops toward the newest dot
  const sp = dSummer.g.position, moving = sp.distanceTo(D.summerTo) > .05;
  if (moving) {
    const dir = D.summerTo.clone().sub(sp);
    dSummer.g.rotation.y = Math.atan2(dir.x, dir.z);
    sp.add(dir.multiplyScalar(Math.min(1, dt * 6)));
  }
  kit.poseSummer(dSummer, time, D.doneT > 1.4 ? 'cheer' : moving ? 'walk' : 'idle');
  // finished: the picture stands up and becomes a 3D thing
  if (D.doneT >= 0) {
    D.doneT += dt;
    if (D.doneT > .5 && !D.trophy) {
      D.trophy = buildTrophy(d);
      D.trophy.rotation.x = -Math.PI / 2;
      dScene.add(D.trophy);
      kit.tones([523, 659, 784, 1047], .09);
      kit.speak(d.name + ' เก่งมาก');
    }
    if (D.trophy) {
      const t = Math.min(1, (D.doneT - .5) / 1.2), e = 1 - Math.pow(1 - t, 3);
      D.trophy.rotation.x = -Math.PI / 2 * (1 - e);
      D.trophy.position.y = .2 + e * (D.trophy.userData.half + .3);
      D.trophy.rotation.y = t >= 1 ? Math.sin((D.doneT - 1.7) * 1.2) * .5 : 0;   // gentle sway, always facing us
      // camera swings from overhead to the front so the standing picture reads as a house/star/arrow
      const look = dCamTop.look.clone().lerp(new THREE.Vector3(0, 1.9, .6), e);
      dCam.position.lerpVectors(dCamTop.pos, new THREE.Vector3(0, 3, dCamTop.dist * .75), e);
      dCam.lookAt(look);
      D.pathG.visible = D.dotsG.visible = t < .3;
      dSummer.g.position.lerp(new THREE.Vector3(-2.6, 0, 2.2), Math.min(1, dt * 3));
      dSummer.g.rotation.y = .5;
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.m.position.y += s.vy * dt;
    if (s.life <= 0) { dScene.remove(s.m); sparks.splice(i, 1); }
  }
  dRenderer.render(dScene, dCam);
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  drawTick(dt, time);
  if (!wrap.isConnected || wrap.offsetParent === null) return;   // nothing to draw while hidden
  if (counting && counting.i < counting.order.length) {
    counting.t -= dt;
    if (counting.t <= 0) {
      const c = counting.order[counting.i++];
      c.m.add(numberSprite(counting.i)); c.bump = 1;
      c.m.material.emissive = new THREE.Color('#ffffff'); c.m.material.emissiveIntensity = .25;
      countEl.textContent = counting.i;
      kit.tones([400 + counting.i * 40], .03, 'triangle', .1);
      counting.t = .38;
      if (counting.i === counting.order.length) setTimeout(() => kit.speak(`ทั้งหมด ${counting.i} กล่อง`), 300);
    }
  }
  dominoTick(dt, time);
  cubes.forEach(c => { if (c.bump > 0) { c.bump = Math.max(0, c.bump - dt * 4); c.m.position.y = c.y0 + Math.sin(c.bump * Math.PI) * .25; } });
  if (net) {
    net.t += ((net.folded ? 1 : 0) - net.t) * Math.min(1, dt * 3);
    const a = net.t * Math.PI / 2;
    net.hinges.forEach(h => { h.pivot.rotation[h.axis] = h.sign * a; });
    // lift the folded cube a little so it sits on the floor, centred under the camera
    net.holder.position.lerpVectors(net.flat, new THREE.Vector3(0, .05, 0), net.t);
  }
  // ease the camera distance toward wantDist
  const off = camera.position.clone().sub(controls.target);
  off.setLength(off.length() + (wantDist - off.length()) * Math.min(1, dt * 3));
  camera.position.copy(controls.target).add(off);
  controls.update();
  renderer.render(scene, camera);
}
loop();
// screen position of dot i on the drawing board (used by the automated tests)
function dotScreen(i) {
  const v = toWorld(D.d.dots[i]).project(dCam), r = dCanvas.getBoundingClientRect();
  return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
}
window.Satit3D = { blocks, cubenet, domino, dominoSeq, explain, drawing, dotScreen };
</script>
